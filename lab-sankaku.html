<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>ためし：三角形の面積</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#f3f7ea; color:#2b3a52; font-family:-apple-system, system-ui, sans-serif;
               overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  body { display:flex; flex-direction:column; }
  header { flex:none; display:flex; align-items:center; gap:8px; padding:8px 10px 4px; }
  header h1 { flex:1; font-size:17px; font-weight:900; }
  .back { text-decoration:none; background:#fff; color:#2b3a52; font-weight:800; font-size:13px; padding:7px 10px; border-radius:10px; }
  #say { flex:none; font-size:15px; font-weight:800; padding:2px 12px; min-height:24px; line-height:1.9; }
  rt { font-size:0.55em; font-weight:700; }
  #stage { flex:1; position:relative; min-height:0; }
  canvas { display:block; position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #slots { flex:none; display:flex; gap:8px; padding:4px 10px; }
  #slots button { flex:1; border:3px solid transparent; border-radius:14px; padding:6px 0; font-size:15px; font-weight:900; background:#fff; color:#2b3a52;
                  box-shadow:0 1px 3px rgba(40,60,90,0.15); }
  #slots button.on { border-color:#3f8fd0; }
  #nums { flex:none; display:grid; grid-template-columns:repeat(10, 1fr); gap:4px; padding:4px 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
  #nums button { border:0; border-radius:10px; padding:10px 0; font-size:16px; font-weight:900; color:#2b3a52; background:var(--f); box-shadow:inset 0 -3px 0 var(--b); }
</style>
</head>
<body>
<header><h1>📐 <ruby>三角形<rt>さんかくけい</rt></ruby>の<ruby>面積<rt>めんせき</rt></ruby></h1><a class="back" href="lab.html">← ためし</a></header>
<div id="say"></div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="slots"><button id="sb" class="on"></button><button id="sh"></button></div>
<div id="nums"></div>
<script>
// ページと いっしょに 新しい スクリプトを 読む（古い キャッシュと まざらないように。index.html と おなじ しくみ）
(function(){
  var v = encodeURIComponent(document.lastModified);
  ['overrides.js', 'engine.js'].forEach(function(f){ document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });
})();
</script>
<script>
// ─── 三角形の面積（ずけい を「とく」から「あそんで まなぶ」へ の サンプル。2026-10-24）─────────────────
// ・したの かず で「底辺」と「高さ」を えらぶ と、その さんかく が マス目 の うえに でる。
//   底辺 は その かず の キャラの いろ の キューブ が よこに ならび、高さ は たてに ならぶ。ながさ の かず も かく。
//   底辺・高さ の キャラ（ひと）は ださない（パパ）。うごかせる ●（てっぺん・底辺 の みぎはし）は ゆっくり てんめつ。
// ・ことば と しき は しょうがっこう の かきかた に あわせ、かんじ に ルビ（パパ）：
//     三角形の面積
//     ＝底辺×高さ÷2
//     ＝3×5÷2
//     ＝7.5        ← さんかく を タップ した とき だけ
//   タップ：長方形（底辺×高さ）が てんせん で でて → その はんぶん → 面積 の キャラ が とびだす。もう いちど で もどる。
// ・てっぺん（●）は じゆうに うごかせる（よこ：高さ は おなじ なので 面積 も おなじ ＝ とうせき へんけい。たて：高さ が かわる）。
//   底辺 の みぎはし（●）も よこに うごかせる。「ひろさ おなじ」の ことば や まえ の かたち の てんせん は ださない（パパ）。
// ・きろく は のこさない（ためし）。
const MAXN = 10, XMIN = -4, XMAX = 14;        // てっぺん が いける はんい（マス）
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), stageEl = document.getElementById('stage'), sayEl = document.getElementById('say');
let W = 0, H = 0, C = 20, OX = 0, OY = 0;      // 1マス の ピクセル と、ていへん の ひだりはし（0,0）の ばしょ
let VL = -3, VR = 12, view = null;             // いま みせて いる よこ の はんい（マス）。view：めざす C・OX・OY（さんかく に あわせて ズーム）
const tri = { b: 6, h: 4, px: 2 };            // ていへん・たかさ・てっぺん の よこ の ばしょ（マス）
let slot = 'b', mode = 'shape', anim = null, drag = null, fx = [];
// ルビ：「{三角形|さんかくけい}」→ かんじ の うえ に よみ（HTML は <ruby>、キャンバス は rubyText）
const rubyHTML = s => s.replace(/\{([^|}]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
const say = s => { sayEl.innerHTML = rubyHTML(s); };
const T = { tri: '{三角形|さんかくけい}', area: '{面積|めんせき}', base: '{底辺|ていへん}', hgt: '{高|たか}さ', rect: '{長方形|ちょうほうけい}' };

function resize(){
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  W = stageEl.clientWidth; H = stageEl.clientHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fitView(true);
}
// いまの さんかく が ちょうど はいる ように（ひだり：ていへん の キャラ、みぎ：たかさ の キューブ と キャラ、うえ：しき）。
// うごかして いる あいだ は かえない（マス が ずれない ように）。はなすと ゆっくり ズーム
const FS = 20, LH = FS*1.95;                  // しき の もじ の 大きさ・ぎょう の たかさ（ルビ こみ）
const panelH = () => 4*LH + 12;               // しき（4ぎょう）の ぶん うえ を あける
function fitView(now){
  const l = Math.min(0, tri.px) - 1, r = Math.max(tri.b, tri.px) + 3.6, top = tri.h + 1.2, bottom = 2.4, Hc = H - panelH();
  const c = Math.max(12, Math.min(64, W/(r - l), Hc/(top + bottom)));
  view = { C: c, OX: (W - (r - l)*c)/2 - l*c, OY: H - bottom*c - Math.max(0, (Hc - (top + bottom)*c)/2) };
  if(now){ C = view.C; OX = view.OX; OY = view.OY; }
}
window.addEventListener('resize', resize);
const sx = x => OX + x*C, sy = y => OY - y*C;
const area = () => tri.b*tri.h/2;
const fmt = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
const ease = k => k < 0 ? 0 : k > 1 ? 1 : k*k*(3 - 2*k);

// ── かず の キャラ（2.5 など は ガラス を のせる。けいさん と おなじ かきかた）──
function charDims(v){ const k = Math.floor(v), s = blockSpec(Math.max(1, k));
  if(Number.isInteger(v)) return { cols: s.cols, rows: s.rows };
  if(k === 0) return { cols: 1, rows: 1 };
  const g = glassPlace(k); return g.side ? { cols: s.cols + 1, rows: s.rows } : { cols: s.cols, rows: s.rows + 1 }; }
function drawChar(v, cx, foot, bs, t){
  const d = charDims(v), x = cx - d.cols*bs/2, y = foot - d.rows*bs, k = Math.floor(v), f = v - k;
  if(Number.isInteger(v)) drawNumberblock(ctx, v, x, y, bs, { t, animate: true, numberling: false });
  else if(k === 0) drawGlassFigure(ctx, glassDigit(f), cx, foot, bs, null, f);
  else { const g = glassPlace(k), oy = g.side ? 0 : bs;
    drawNumberblock(ctx, k, x, y + oy, bs, { t, animate: true, numberling: false });
    drawGlassCube(ctx, x + g.gx*bs, y + oy + g.gy*bs, bs, f, glassLiqColor(glassDigit(f))); }
  ctx.save(); ctx.font = '900 ' + Math.max(11, Math.round(bs*0.7)) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(fmt(v), cx, y - 2); ctx.fillStyle = '#16233a'; ctx.fillText(fmt(v), cx, y - 2); ctx.restore();
}
// その かず の キャラ の キューブ の いろ（へん に ならべる）
function cellColors(n){ const s = blockSpec(n); return s.cells.slice().sort((a, b) => b.gy - a.gy || a.gx - b.gx).map(c => c.colorRGB || mainColorOf(n)); }
function cubeRun(n, x0, y0, dx, dy){        // (x0,y0) から dx,dy（マス）むき に n こ。x0,y0 は キューブ の ひだりうえ（ピクセル）
  const cols = cellColors(n);
  for(let i = 0; i < n; i++){ const x = x0 + dx*i*C, y = y0 + dy*i*C, col = cols[i % cols.length];
    ctx.fillStyle = rgb(col); ctx.strokeStyle = rgb(darken(col, 0.3)); ctx.lineWidth = Math.max(1, C*0.06);
    ctx.beginPath(); ctx.roundRect(x + 1, y + 1, C - 2, C - 2, C*0.12); ctx.fill(); ctx.stroke(); }
}

// ── えがく ──
function draw(now){
  if(view && !drag){ const k = 0.15; C += (view.C - C)*k; OX += (view.OX - OX)*k; OY += (view.OY - OY)*k; }
  VL = (0 - OX)/C; VR = (W - OX)/C;
  const XMIN = Math.floor(VL), XMAX = Math.ceil(VR), YTOP = Math.ceil(OY/C);
  ctx.clearRect(0, 0, W, H);
  // マス目
  ctx.strokeStyle = 'rgba(80,110,140,0.13)'; ctx.lineWidth = 1; ctx.beginPath();
  for(let x = XMIN; x <= XMAX; x++){ ctx.moveTo(sx(x), sy(YTOP)); ctx.lineTo(sx(x), sy(-0.6)); }
  for(let y = 0; y <= YTOP; y++){ ctx.moveTo(sx(XMIN), sy(y)); ctx.lineTo(sx(XMAX), sy(y)); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(60,80,110,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(XMIN - 1), sy(0)); ctx.lineTo(sx(XMAX + 1), sy(0)); ctx.stroke();

  const { b, h, px } = tri, A = [sx(0), sy(0)], B = [sx(b), sy(0)], P = [sx(px), sy(h)];
  const k = anim ? ease((now - anim.t0)/anim.dur) : 1, toCalc = mode === 'calc';
  const ph = toCalc ? k : 1 - k;             // 0：かたち 〜 1：ひろさ
  // 長方形（底辺 × 高さ）：はじめ の 3わり で でて、つぎ の 3わり で はんぶん が うすく なる
  const rk = ease(ph/0.35), hk = ease((ph - 0.35)/0.3);
  if(rk > 0){
    ctx.save(); ctx.globalAlpha = rk;
    ctx.fillStyle = 'rgba(255,214,90,' + (0.35*(1 - hk*0.6)) + ')'; ctx.fillRect(A[0], P[1], B[0] - A[0], A[1] - P[1]);
    ctx.setLineDash([6, 5]); ctx.strokeStyle = '#d69500'; ctx.lineWidth = 2.5; ctx.strokeRect(A[0], P[1], B[0] - A[0], A[1] - P[1]);
    ctx.setLineDash([]); ctx.globalAlpha = rk*(1 - ease((ph - 0.72)/0.2));
    rubyText(T.rect + ' ' + b + '×' + h + '＝' + b*h, (A[0] + B[0])/2, P[1] - handleR()*1.9 - 4, 15, '#a86a00', 'center');   // てっぺん の ● の うえ
    ctx.restore();
  }
  // さんかく
  const col = mainColorOf(Math.max(1, Math.min(100, Math.round(area()))));
  ctx.fillStyle = rgba(ph > 0.6 ? col : [90, 160, 230], 0.28 + 0.25*hk); ctx.strokeStyle = '#2b5a8a'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.lineTo(...P); ctx.closePath(); ctx.fill(); ctx.stroke();
  // たかさ の せん（てっぺん から まっすぐ した。そと に でたら ていへん を のばす）
  ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(200,60,60,0.8)'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(P[0], P[1]); ctx.lineTo(P[0], A[1]);
  if(px < 0 || px > b){ ctx.moveTo(P[0], A[1]); ctx.lineTo(px < 0 ? A[0] : B[0], A[1]); }
  ctx.stroke(); ctx.restore();
  // ていへん：キャラ の いろ の キューブ が よこに。たかさ：さんかく の みぎ に たてに（てっぺん から てんせん）
  cubeRun(b, A[0], A[1] + 2, 1, 0);
  const hx = sx(Math.max(b, px) + 1);
  cubeRun(h, hx, A[1] - C, 0, -1);
  ctx.save(); ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(200,60,60,0.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(P[0], P[1]); ctx.lineTo(hx, P[1]); ctx.stroke(); ctx.restore();
  // ながさ の かず（底辺 は キューブ の した、高さ は キューブ の みぎ）
  lenLabel(b, (A[0] + B[0])/2, A[1] + C*1.75, mainColorOf(b));
  lenLabel(h, hx + C*1.55, A[1] - h*C/2 + C*0.35, mainColorOf(h));
  // ●（うごかせる ところ）：ゆっくり てんめつ（1.8びょう で ひとまわり。うごかして いる あいだ は オレンジ）
  const pulse = 0.5 + 0.5*Math.sin(now/1800*Math.PI*2);
  for(const [q, on] of [[P, drag && drag.k === 'p'], [B, drag && drag.k === 'b']]){
    const r0 = handleR();
    if(!on){ ctx.fillStyle = 'rgba(240,160,32,' + (0.15 + 0.3*pulse) + ')'; ctx.beginPath(); ctx.arc(q[0], q[1], r0*(1.4 + 0.5*pulse), 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = on ? '#f0a020' : 'rgb(255,' + Math.round(255 - 70*pulse) + ',' + Math.round(255 - 190*pulse) + ')'; ctx.strokeStyle = '#2b5a8a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(q[0], q[1], r0, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }
  // しき（がめん の うえ）
  drawFormula(ph);
  // ひろさ の キャラ（さいご の 3わり で とびだす）
  const ck = ease((ph - 0.7)/0.3);
  if(ck > 0){
    const v = area(), d = charDims(v), cx = (A[0] + B[0] + P[0])/3, foot = A[1] - C*0.15;
    const bs = Math.max(5, Math.min(C*0.9, (A[1] - P[1])*0.7/d.rows, Math.abs(B[0] - A[0])*0.6/d.cols));
    ctx.save(); ctx.translate(cx, foot); const s = 0.4 + 0.6*ck + 0.12*Math.sin(Math.PI*ck); ctx.scale(s, s); ctx.globalAlpha = ck; ctx.translate(-cx, -foot);
    drawChar(v, cx, foot, bs, now); ctx.restore();
  }
  // きらきら
  fx = fx.filter(p => (p.life -= 0.02) > 0);
  for(const p of fx){ p.x += p.vx; p.y += p.vy; p.vy += 0.12; ctx.fillStyle = 'hsla(' + p.hue + ',90%,60%,' + p.life + ')'; ctx.fillRect(p.x, p.y, 4, 4); }
}
// うごかせる ● の 大きさ：マス の 大きさ と、さんかく の みじかい ほう の へん（底辺・高さ）に あわせる
// （ちいさい さんかく は ズーム の じょうげん で マス が それいじょう 大きく ならない ので、1×1 でも ● が 大きすぎない ように。パパ）。
// さわれる ところ は hit で ひろい まま
function handleR(){ return Math.max(4, Math.min(C*0.26, Math.min(tri.b, tri.h)*C*0.13)); }
// ながさ の かず（へん の キューブ の よこ）
function lenLabel(n, x, y, col){
  ctx.save(); ctx.font = '900 ' + Math.round(Math.max(16, Math.min(30, C*0.9))) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(n, x, y); ctx.fillStyle = rgb(darken(col, 0.35)); ctx.fillText(n, x, y); ctx.restore();
}
// ルビ つき の 1ぎょう を かく（x：align が left なら ひだりはし、center なら まんなか。y：もじ の したの せん）。はば を かえす
function rubyText(s, x, y, size, color, align){
  const parts = []; let m, last = 0; const re = /\{([^|}]+)\|([^}]+)\}/g;
  while((m = re.exec(s))){ if(m.index > last) parts.push([s.slice(last, m.index)]); parts.push([m[1], m[2]]); last = re.lastIndex; }
  if(last < s.length) parts.push([s.slice(last)]);
  ctx.save(); ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const big = '900 ' + size + 'px sans-serif', small = '700 ' + Math.round(size*0.5) + 'px sans-serif';
  ctx.font = big; const ws = parts.map(p => ctx.measureText(p[0]).width), tot = ws.reduce((a, b) => a + b, 0);
  let xx = align === 'center' ? x - tot/2 : x;
  parts.forEach((p, i) => {
    ctx.font = big; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.strokeText(p[0], xx, y); ctx.fillStyle = color; ctx.fillText(p[0], xx, y);
    if(p[1]){ ctx.font = small; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeText(p[1], xx + ws[i]/2, y - size*1.02); ctx.fillText(p[1], xx + ws[i]/2, y - size*1.02); ctx.textAlign = 'left'; }
    xx += ws[i];
  });
  ctx.restore(); return tot;
}
// しき（しょうがっこう の かきかた）：
//   三角形の面積
//   ＝底辺×高さ÷2
//   ＝3×5÷2
//   ＝7.5（タップ した とき。長方形 の はんぶん に なった ところ で でる）
function drawFormula(ph){
  const { b, h } = tri, x = 14, y0 = 10 + LH*0.95;
  const lines = [[T.tri + 'の' + T.area, '#16233a'], ['＝' + T.base + '×' + T.hgt + '÷2', '#16233a'], ['＝' + b + '×' + h + '÷2', '#2b5a8a']];
  lines.forEach(([s, c], i) => rubyText(s, x, y0 + i*LH, FS, c));
  const k4 = ease((ph - 0.6)/0.15);
  if(k4 > 0){ ctx.save(); ctx.globalAlpha = k4; rubyText('＝' + fmt(area()), x, y0 + 3*LH, FS + 4, '#c0398a'); ctx.restore(); }
}

// ── さわる ──
function hit(x, y){
  const r = Math.max(22, C*0.8), P = [sx(tri.px), sy(tri.h)], B = [sx(tri.b), sy(0)];
  if(Math.hypot(x - P[0], y - P[1]) < r) return 'p';
  if(Math.hypot(x - B[0], y - B[1]) < r) return 'b';
  // さんかく の なか（ていへん の した の キューブ も ふくめて すこし ひろめ）
  const area2 = (a, b2, c) => Math.abs((b2[0] - a[0])*(c[1] - a[1]) - (c[0] - a[0])*(b2[1] - a[1]));
  const A = [sx(0), sy(0)], T = area2(A, B, P), Q = [x, y];
  if(Math.abs(area2(Q, A, B) + area2(Q, B, P) + area2(Q, P, A) - T) < T*0.02 + 1) return 'in';
  return null;
}
function local(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
let down = null;
cv.addEventListener('pointerdown', e => {
  const [x, y] = local(e), k = hit(x, y); down = { x, y, k, t: performance.now() };
  if(k === 'p' || k === 'b'){ drag = { k, id: e.pointerId };
    if(mode === 'calc') toggle(); cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  const [x, y] = local(e), gx = Math.round((x - OX)/C), gy = Math.round((OY - y)/C);
  if(drag.k === 'p'){
    // がめん の そと には いかない（はなすと ズーム が かわって また ひろく うごける）
    const npx = Math.max(XMIN, Math.ceil(VL), Math.min(XMAX, Math.floor(VR), gx)), nh = Math.max(1, Math.min(MAXN, Math.floor(OY/C - 0.3), gy));
    if(npx !== tri.px || nh !== tri.h){ tri.px = npx; if(nh !== tri.h){ tri.h = nh; sparkle(sx(tri.px), sy(tri.h)); } changed(); }
  } else {
    const nb = Math.max(1, Math.min(MAXN, gx));
    if(nb !== tri.b){ tri.b = nb; changed(); }
  }
});
function endDrag(e){
  if(drag && e.pointerId === drag.id){ drag = null; fitView(); }
  else if(down && down.k === 'in' && Math.hypot(local(e)[0] - down.x, local(e)[1] - down.y) < 12) toggle();
  down = null;
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', e => { drag = null; down = null; });

function changed(){
  updSlots();
  say(T.base + ' ' + tri.b + '・' + T.hgt + ' ' + tri.h + '。' + T.tri + ' を タップ すると ' + T.area + ' が わかるよ');
}
function toggle(){
  mode = mode === 'calc' ? 'shape' : 'calc'; anim = { t0: performance.now(), dur: mode === 'calc' ? 2600 : 700 };
  if(mode === 'calc'){ setTimeout(() => { if(mode === 'calc') sparkle(sx((tri.b + tri.px)/3), sy(tri.h/3), 30); }, 2000);
    say(T.rect + '（' + tri.b + '×' + tri.h + '＝' + tri.b*tri.h + '）の はんぶん。' + T.area + ' は ' + fmt(area())); }
  else changed();
}
function sparkle(x, y, n){ for(let i = 0; i < (n || 12); i++) fx.push({ x, y, vx: (Math.random() - 0.5)*5, vy: -Math.random()*4 - 1, life: 1, hue: Math.random()*360 }); }

// ── したの ボタン ──
const sb = document.getElementById('sb'), sh = document.getElementById('sh');
function updSlots(){ sb.innerHTML = rubyHTML(T.base + ' ' + tri.b); sh.innerHTML = rubyHTML(T.hgt + ' ' + tri.h);
  sb.classList.toggle('on', slot === 'b'); sh.classList.toggle('on', slot === 'h'); }
sb.addEventListener('click', () => { slot = 'b'; updSlots(); });
sh.addEventListener('click', () => { slot = 'h'; updSlots(); });
const numsEl = document.getElementById('nums');
for(let v = 1; v <= MAXN; v++){
  const b = document.createElement('button'), col = mainColorOf(v);
  b.textContent = v;
  b.style.setProperty('--f', v === 7 ? 'linear-gradient(90deg,#fbb,#fdc,#ffe9a8,#c8efc0,#bdeefa,#c7c4f0,#e3c6f2)' : rgb(mixWhite(col, 0.6)));
  b.style.setProperty('--b', rgb(v === 10 ? [229, 36, 42] : v === 7 ? [150, 110, 190] : darken(col, 0.15)));
  b.addEventListener('click', () => {
    if(mode === 'calc'){ mode = 'shape'; anim = null; }
    if(slot === 'b'){ tri.px = Math.round(tri.px*v/tri.b); tri.b = v; slot = 'h'; sparkle(sx(v/2), sy(0)); }
    else { tri.h = v; slot = 'b'; sparkle(sx(tri.px), sy(v)); }
    changed(); fitView();
  });
  numsEl.appendChild(b);
}

resize(); updSlots(); changed();
(function loop(now){ draw(now); requestAnimationFrame(loop); })(performance.now());
// テスト・しらべ よう
window.sankaku = { tri, area, mode: () => mode, toggle, hit, set: (b, h, px) => { tri.b = b; tri.h = h; tri.px = px; changed(); fitView(true); },
                   at: () => ({ P: [sx(tri.px), sy(tri.h)], B: [sx(tri.b), sy(0)], C }) };
</script>
</body>
