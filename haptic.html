<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ぶるっ テスト</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 16px 16px 40px; font-family: -apple-system, system-ui, sans-serif; background: #eaf8f2; color: #2b3a52; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { margin: 6px 0; line-height: 1.5; font-size: 15px; }
  .btn { display: block; width: 100%; margin: 10px 0; padding: 16px 14px; border: 0; border-radius: 14px; background: #3f8fd0; color: #fff;
         font-size: 18px; font-weight: 700; text-align: left; -webkit-tap-highlight-color: transparent; }
  .btn small { display: block; font-weight: 400; font-size: 13px; opacity: .9; margin-top: 2px; }
  .btn:active { background: #2d74ad; }
  .card { background: #fff; border-radius: 14px; padding: 12px 14px; margin: 12px 0; }
  #log { font-size: 13px; white-space: pre-wrap; color: #555; }
  .hidden-switch { position: absolute; left: -9999px; top: 0; opacity: 0; }
  label.real { display: flex; align-items: center; gap: 10px; font-size: 16px; }
</style>
</head>
<body>
<h1>ぶるっ テスト</h1>
<p>ボタンを おして、スマホが「コツッ」と ふるえるか ためします。どれが ふるえたか と、いちばん 下の ログの さいごの 2ぎょう（iOS の バージョン）を おしえてください。</p>

<div class="card">
  <label class="real"><input type="checkbox" switch> ← まず これを さわって、コツッと なるか たしかめる</label>
  <p style="font-size:13px">ならない ときは「せってい → サウンドと触覚 → システムの触覚」が オンか 見てください。</p>
</div>

<p><b>やりかた A</b>（いれこ・head に つくって すぐ けす）</p>
<button class="btn" data-m="A" data-p="once">A1. すぐ 1かい</button>
<button class="btn" data-m="A" data-p="later1">A2. 1びょう あとに 1かい</button>
<button class="btn" data-m="A" data-p="three">A3. かみなり 3ぼん（0・0.38・0.76びょう）</button>
<p><b>やりかた B</b>（いれこ・body に 小さく おいておく）</p>
<button class="btn" data-m="B" data-p="once">B1. すぐ 1かい</button>
<button class="btn" data-m="B" data-p="later1">B2. 1びょう あとに 1かい</button>
<button class="btn" data-m="B" data-p="three">B3. かみなり 3ぼん</button>
<p><b>やりかた C</b>（スイッチそのものを クリック）</p>
<button class="btn" data-m="C" data-p="once">C1. すぐ 1かい</button>
<button class="btn" data-m="C" data-p="later1">C2. 1びょう あとに 1かい</button>

<div class="card"><div id="log"></div></div>

<!-- B：いれこの スイッチを 画面の すみに 1px で おいておく -->
<label id="bl" aria-hidden="true" style="position:fixed;left:0;bottom:0;width:1px;height:1px;overflow:hidden;opacity:0.01"><input type="checkbox" switch id="bi" tabindex="-1"></label>

<script>
const logEl = document.getElementById('log');
const t0 = performance.now();
function log(s){ logEl.textContent = ((performance.now() - t0)/1000).toFixed(2) + 's ' + s + '\n' + logEl.textContent; }
const M = {
  // A：ios-haptics と おなじ。label の 中に switch を いれて head に おき、label を クリックして すぐ けす
  A(){ const l = document.createElement('label'); l.ariaHidden = 'true'; l.style.display = 'none';
       const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', '');
       l.appendChild(i); document.head.appendChild(l); l.click(); document.head.removeChild(l); },
  B(){ document.getElementById('bl').click(); },
  C(){ document.getElementById('bi').click(); },
};
let how = 'A';
function tick(){ if(navigator.vibrate) navigator.vibrate(30); M[how](); }
const at = (ms, n) => setTimeout(() => { tick(); log('  コツッ ' + (n || '')); }, ms);
const P = {
  once(){ tick(); log('  コツッ'); },
  three(){ [0, 380, 760].forEach((ms, i) => at(ms, i + 1)); },
  later1(){ at(1000); },
};
document.querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => { how = b.dataset.m; log('▶ ' + b.textContent.trim()); P[b.dataset.p](); }));
log('switch: ' + ('switch' in HTMLInputElement.prototype ? 'あり' : 'なし') + ' / vibrate: ' + (navigator.vibrate ? 'あり' : 'なし'));
log(navigator.userAgent);
</script>
</body>
</html>
