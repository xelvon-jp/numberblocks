<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>はんぶん</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#dff3f6; color:#2b3a52;
               font-family:-apple-system, system-ui, sans-serif;
               overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  body { display:flex; flex-direction:column; }
  #say { height:66px; flex:none; padding:6px 12px 0; text-align:center; display:flex; flex-direction:column; justify-content:center; }
  #say .big { font-size:clamp(16px, 5.8vw, 26px); font-weight:900; line-height:1.25; white-space:nowrap; }
  #say .sub { font-size:14px; color:#6a7486; min-height:18px; font-weight:700; }
  #say .ok { color:#d08a00; }
  #stage { flex:1; position:relative; min-height:0; }
  canvas { display:block; position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #bar { flex:none; display:flex; gap:8px; align-items:center; padding:6px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background:rgba(255,255,255,0.7); }
  .spin { display:flex; align-items:center; background:#fff; border-radius:14px; padding:4px; box-shadow:0 1px 3px rgba(40,60,90,0.15); }
  .spin button { width:clamp(34px, 10.5vw, 42px); height:42px; border:0; border-radius:11px; background:#3f8fd0; color:#fff; font-size:26px; font-weight:700; line-height:1; }
  .spin button:active { background:#2d74ad; }
  .spin button.off { opacity:0.3; }
  .spin .val { width:clamp(34px, 11vw, 48px); text-align:center; font-size:28px; font-weight:900; }
  #add { flex:1; height:50px; border:0; border-radius:14px; background:#f0a020; color:#fff; font-size:20px; font-weight:900; box-shadow:0 3px 0 #c07a10; white-space:nowrap; }
  #add:active { transform:translateY(2px); box-shadow:0 1px 0 #c07a10; }
  #clear { flex:none; height:50px; border:0; border-radius:14px; padding:0 10px; background:#dfe6ef; color:#2b3a52; font-size:clamp(13px, 3.9vw, 15px); font-weight:800; }
</style>
</head>
<body>
<div id="say"><div class="big"></div><div class="sub"></div></div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
  <div class="spin"><button class="m" aria-label="へらす">−</button><div class="val"></div><button class="p" aria-label="ふやす">＋</button></div>
  <button id="add">だす</button><button id="clear">かたづける</button>
</div>
<script>
// ページと いっしょに 新しい スクリプトを 読む（古い キャッシュと まざらないように。index.html と おなじ しくみ）
(function(){
  var v = encodeURIComponent(document.lastModified);
  ['overrides.js', 'engine.js'].forEach(function(f){ document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });
})();
</script>
<script>
// ─── はんぶん（しょうすう 0.5 を あそぶ）─────────────────────────────────────
// ひなたが 0.5 に きょうみを もったので つくった（ゲームの「はんぶん」タブの 中で ひらく）。もんだいは ださない。
//   ゆび 2ほんで キャラを ひろげる（ピンチアウト）と はんぶんこ：4 → 2 と 2、5 → 2.5 と 2.5、1 → 0.5 と 0.5。
//   ドラッグして かさねると くっつく（いままで どおり たしざん）：2.5 ＋ 2.5 ＝ 5。
//   はんぶん（0.5）は ながしかくの ブロック（1 の はんぶん の たかさ。1 と おなじ あか）。2.5 は 2 の あたまに のる。
//   ぼうし・かみの けが ある キャラ（3・7・20）は かくれて しまうので、あしもとの みぎよこに つく。
//   はんぶんの はんぶん（0.25）は まだ ださない（2.5 や 0.5 は わけられない）。
// この たんまつの localStorage（nb_hanbun）に いる キャラと「だす」かずを おぼえる。
const V_MAX = 100, N_MAX = 20, MAX_CHARS = 12;
const BS_MAX = 40;
const SPLIT_PX = 45;        // ゆびが これだけ ひろがったら はんぶんこ
const HALF_RGB = [229, 36, 42];    // はんぶんの ブロック（1 と おなじ あか）

const cv = document.getElementById('c'), ctx = cv.getContext('2d'), stageEl = document.getElementById('stage');
const sayBig = document.querySelector('#say .big'), saySub = document.querySelector('#say .sub');
let W = 0, H = 0;
function resize(){
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  W = stageEl.clientWidth; H = stageEl.clientHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

// ── おぼえる ──
const KEY = 'nb_hanbun';
let st = { n: 5, chars: [5] };
try{ const v = JSON.parse(localStorage.getItem(KEY)); if(v && typeof v === 'object') st = Object.assign(st, v); }catch(e){}
st.n = Math.max(1, Math.min(N_MAX, st.n|0 || 5));
const okV = v => typeof v === 'number' && v >= 0.5 && v <= V_MAX && Math.abs(v*2 - Math.round(v*2)) < 1e-9;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ n: st.n, chars: chars.map(c => c.v) })); }catch(e){} }

// ── かずの かきかた ──
const fmt = v => Number.isInteger(v) ? String(v) : String(Math.floor(v)) + '.5';
const yomi = v => Number.isInteger(v) ? '' : (v < 1 ? '0.5 は「はんぶん」' : fmt(v) + ' は「' + Math.floor(v) + ' と はんぶん」');

// ── キャラ ──
// c：{ v, x（まんなか）, y（あしもと＝いちばん したの キューブの した）, drag, born, hop, shake }
let chars = [];
let bs = 30;
const now0 = () => performance.now();
const isHalf = v => !Number.isInteger(v);
// はんぶんの ブロックの ばしょ：いちばん うえの だんの みぎはしの うえ（top）か、ぼうし・かみの けが あれば いちばん したの みぎよこ（side）
function halfAt(k){
  const s = blockSpec(k), f = s.face || {};
  if(f.jesterHat || f.hair || f.tophat){ let b = null; for(const c of s.cells) if(!b || c.gy > b.gy || (c.gy === b.gy && c.gx > b.gx)) b = c; return { side: true, gx: b.gx + 1, gy: b.gy + 0.5 }; }
  let t = null; for(const c of s.cells) if(!t || c.gy < t.gy || (c.gy === t.gy && c.gx > t.gx)) t = c;
  return { side: false, gx: t.gx, gy: t.gy - 0.5 };
}
// キャラの おおきさ（キューブ なんこぶん）
function dims(v){
  const k = Math.floor(v);
  if(k === 0) return { cols: 1, rows: 0.5 };
  const s = blockSpec(k);
  if(!isHalf(v)) return { cols: s.cols, rows: s.rows };
  const h = halfAt(k);
  return h.side ? { cols: s.cols + 1, rows: s.rows } : { cols: s.cols, rows: s.rows + 0.5 };
}
const floorY = () => H - PAD_BOT*bs - 8;
function targetBs(){
  // みんな よこに ならんで はいる（て の ぶん 1.6 と すきま 0.8）。いちばん せの たかい キャラも はいる
  let r = 1, c = 1, sum = 0; for(const ch of chars){ const d = dims(ch.v); r = Math.max(r, d.rows); c = Math.max(c, d.cols); sum += d.cols + 2.4; }
  return Math.max(4, Math.min(BS_MAX, W/(c + 6), (W - 12)/Math.max(1, sum), (H - 16)/(r + PAD_TOP + PAD_BOT + 0.6)));
}
function mk(v, x, t){ return { v, x, y: null, vy: 0, drag: null, born: t, hop: t, shake: -1e9 }; }
function freeX(){
  // あいて いる ところ（いちばん ひろい すきまの まんなか）
  const xs = chars.map(c => c.x).sort((a, b) => a - b), pts = [0].concat(xs, [W]);
  let best = W/2, gap = -1;
  for(let i = 0; i < pts.length - 1; i++){ const g = pts[i + 1] - pts[i]; if(g > gap){ gap = g; best = (pts[i] + pts[i + 1])/2; } }
  return best;
}
function addChar(v){
  if(chars.length >= MAX_CHARS){ say('いっぱい だよ', 'かたづけるか くっつけてね'); return null; }
  const c = mk(v, freeX(), now0()); c.y = 30 + dims(v).rows*bs; chars.push(c); save(); return c;
}

// ── はんぶんこ・くっつく ──
function split(c, ang){
  const t = now0();
  if(isHalf(c.v)){ c.shake = t; say(fmt(c.v) + ' は もう はんぶんこ できないよ', 'はんぶんの はんぶん は また こんど'); return false; }
  if(chars.length >= MAX_CHARS){ c.shake = t; say('いっぱい だよ', 'くっつけてから わけてね'); return false; }
  const h = c.v/2, d = dims(h), off = (d.cols*bs)/2 + bs*0.9;
  const i = chars.indexOf(c);
  const a = mk(h, c.x - off, t), b = mk(h, c.x + off, t);
  a.y = b.y = c.y; a.from = b.from = c.x;
  chars.splice(i, 1, a, b);
  burst(c.x, c.y - dims(c.v).rows*bs/2, 18);
  say(fmt(c.v) + ' を はんぶんこ → ' + fmt(h) + ' と ' + fmt(h), yomi(h) || (fmt(h) + ' ＋ ' + fmt(h) + ' ＝ ' + fmt(c.v)), true);
  save(); return true;
}
function merge(a, b){
  const t = now0(), v = a.v + b.v;
  if(v > V_MAX){ b.shake = t; a.shake = t; say(V_MAX + ' より おおきく なっちゃう', ''); return false; }
  const c = mk(v, b.x, t); c.y = b.y; c.hop = t;
  chars = chars.filter(x => x !== a && x !== b); chars.push(c);
  burst(c.x, c.y - dims(v).rows*bs/2, 26);
  say(fmt(a.v) + ' ＋ ' + fmt(b.v) + ' ＝ ' + fmt(v), yomi(v), true);
  save(); return c;
}

// ── ことば ──
function say(big, sub, ok){ sayBig.textContent = big; sayBig.classList.toggle('ok', !!ok); saySub.textContent = sub || ''; }
function sayIdle(){ say('ゆび 2ほんで ひろげて はんぶんこ', 'かさねると くっつくよ'); }

// ── かみふぶき ──
let confetti = [];
const CONF = ['#e5242a', '#f39220', '#f9d62d', '#3ebb47', '#29bee2', '#3f48cc', '#923cc0'];
function burst(x, y, n){ for(let i = 0; i < n; i++){ const a = Math.random()*Math.PI*2, s = 2 + Math.random()*4;
  confetti.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2, r: Math.random()*6, c: CONF[i % 7], life: 1 }); } }

// ── かく ──
function rect(c){ const d = dims(c.v), w = d.cols*bs, h = d.rows*bs; return { x: c.x - w/2, y: c.y - h, w, h }; }
// あたまの かず（ナンバーリングと おなじ 字。0.5 の「.」は まる）
function drawLabel(v, cx, by){
  const s = fmt(v), h = bs*0.55, gw = h*0.56, sp = h*0.2, dotW = h*0.3;
  const ws = [...s].map(ch => ch === '.' ? dotW : gw), tot = ws.reduce((a, b) => a + b, 0) + sp*(s.length - 1);
  const cy = by - bs*0.15 - h/2;
  ctx.save(); ctx.lineWidth = h*0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000'; ctx.fillStyle = '#000';
  let x = cx - tot/2;
  [...s].forEach((ch, i) => {
    if(ch === '.'){ ctx.beginPath(); ctx.arc(x + dotW/2, cy + h/2 - h*0.11, h*0.13, 0, Math.PI*2); ctx.fill(); }
    else { digitPath(ctx, ch, x + gw/2, cy, h); ctx.stroke(); }
    x += ws[i] + sp;
  });
  ctx.restore();
}
function halfCube(x, y){
  const in_ = bs*0.018, r = bs*0.07;
  ctx.fillStyle = 'rgb(' + HALF_RGB.join(',') + ')';
  ctx.beginPath(); ctx.roundRect(x + in_, y + in_, bs - in_*2, bs/2 - in_*2, r); ctx.fill();
}
function drawChar(c, now){
  const k = Math.floor(c.v), half = isHalf(c.v), d = dims(c.v);
  let x = c.x, footY = c.y;
  const age = now - c.born, hop = (now - c.hop)/450, sh = now - c.shake;
  if(c.from != null && age < 300){ const e = 1 - Math.pow(1 - age/300, 3); x = c.from + (c.x - c.from)*e; }
  if(hop < 1 && !c.drag) footY -= Math.sin(Math.PI*hop)*bs*1.4;
  if(sh < 500) x += Math.sin(sh*0.06)*bs*0.18*(1 - sh/500);
  const sc = age < 260 ? 0.7 + 0.3*(age/260) + 0.12*Math.sin(Math.PI*age/260) : 1;
  ctx.save(); ctx.translate(x, footY); ctx.scale(sc, sc); ctx.translate(-x, -footY);
  if(c.drag){ ctx.shadowColor = 'rgba(30,50,80,0.25)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 6; }
  if(k === 0){
    // 0.5：1 を たてに はんぶんに つぶした かたち（かおも てあしも ある、ちいさな ながしかく）
    ctx.save(); ctx.translate(x, footY); ctx.scale(1, 0.5);
    drawNumberblock(ctx, 1, -bs/2, -bs, bs, { t: now, animate: !c.drag, numberling: false });
    ctx.restore();
    drawLabel(c.v, x, footY - bs/2);
  } else {
    const s = blockSpec(k), y0 = footY - s.rows*bs;
    if(half){
      const h = halfAt(k), x0 = x - d.cols*bs/2;
      if(!h.side) halfCube(x0 + h.gx*bs, y0 + h.gy*bs);
      drawNumberblock(ctx, k, x0, y0, bs, { t: now, animate: !c.drag, numberling: false });
      if(h.side) halfCube(x0 + h.gx*bs, y0 + h.gy*bs);
      // かずは キャラの まんなかの うえ（ぼうし・かみの けの ぶん あける）
      const lift = s.face && (s.face.jesterHat || s.face.hair) ? bs*0.55 : s.face && s.face.tophat ? bs*1.15 : 0;
      drawLabel(c.v, x0 + s.cols*bs/2, y0 + Math.min(0, h.side ? 0 : h.gy)*bs - lift);
    } else {
      drawNumberblock(ctx, k, x - s.cols*bs/2, y0, bs, { t: now, animate: !c.drag });
    }
  }
  ctx.restore();
}

// ── うごき ──
function step(now){
  const tb = targetBs(); bs += (tb - bs)*0.2;
  const fy = floorY();
  for(const c of chars){
    if(c.drag) continue;
    if(c.y == null) c.y = fy;
    if(c.y < fy){ c.vy += 1.2; c.y = Math.min(fy, c.y + c.vy); } else { c.y = fy; c.vy = 0; }
  }
  // かさならない ように すこしずつ はなす（あしもとに いる キャラ だけ）
  const g = chars.filter(c => !c.drag);
  for(let i = 0; i < g.length; i++) for(let j = i + 1; j < g.length; j++){
    const a = g[i], b = g[j], need = (dims(a.v).cols + dims(b.v).cols)*bs/2 + bs*2.4, dx = b.x - a.x;
    if(Math.abs(dx) < need){ const p = Math.min(4, (need - Math.abs(dx))*0.15), s = dx >= 0 ? 1 : -1; a.x -= p*s; b.x += p*s; }
  }
  for(const c of g){ const hw = dims(c.v).cols*bs/2 + bs*1.2; c.x = Math.max(hw, Math.min(W - hw, c.x)); }
}
function frame(){
  const now = now0();
  step(now);
  ctx.clearRect(0, 0, W, H);
  // ゆか
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(0, floorY() + PAD_BOT*bs*0.6, W, H);
  const order = chars.filter(c => !c.drag).concat(chars.filter(c => c.drag));
  // くっつく あいて を ひからせる
  for(const c of chars) if(c.drag){ const o = overlapWith(c); if(o){ const r = rect(o);
    ctx.save(); ctx.fillStyle = 'rgba(255,215,80,0.35)'; ctx.beginPath(); ctx.roundRect(r.x - bs*0.5, r.y - bs*0.8, r.w + bs, r.h + bs*1.6, bs*0.5); ctx.fill(); ctx.restore(); } }
  for(const c of order) drawChar(c, now);
  confetti = confetti.filter(p => p.life > 0);
  for(const p of confetti){ p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.r += 0.15; p.life -= 0.015;
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life*2)); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-4, -2.5, 8, 5); ctx.restore(); }
  requestAnimationFrame(frame);
}

// ── ゆび ──
// 1ぽん：つかんで うごかす。はなした ところで ほかの キャラに かさなって いたら くっつく。
// 2ほん：おなじ キャラを 2ほんの ゆびで つまんで ひろげると はんぶんこ。ちがう キャラを 1ぽんずつ もって よせても くっつく。
const ptrs = new Map();      // id → { x, y, c, ox, oy }
let pinch = null;            // { c, a, b, d0 }
function pos(e){ const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hit(x, y, pad){
  for(let i = chars.length - 1; i >= 0; i--){ const c = chars[i], r = rect(c), p = pad*bs;
    if(x >= r.x - p && x <= r.x + r.w + p && y >= r.y - p - bs*0.6 && y <= r.y + r.h + p + bs*0.6) return c; }
  return null;
}
function overlapWith(c){
  const r = rect(c); let best = null, bd = Infinity;
  for(const o of chars){ if(o === c || o.drag) continue; const q = rect(o);
    const ox = Math.min(r.x + r.w, q.x + q.w) - Math.max(r.x, q.x), oy = Math.min(r.y + r.h, q.y + q.h) - Math.max(r.y, q.y);
    if(ox > -bs*0.3 && oy > -bs*0.3){ const d = Math.abs(o.x - c.x); if(d < bd){ bd = d; best = o; } } }
  return best;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const p = pos(e);
  // 2ほんめ の ゆびが つかんで いる キャラ（の ちかく）に きたら つまむ
  for(const [id, q] of ptrs){
    if(q.c && !pinch && hit(p.x, p.y, 1.5) === q.c){
      pinch = { c: q.c, a: id, b: e.pointerId, d0: Math.hypot(p.x - q.x, p.y - q.y) };
      q.c.drag = null; ptrs.set(e.pointerId, { x: p.x, y: p.y, c: null }); q.c = null; return;
    }
  }
  const c = hit(p.x, p.y, 0.4);
  if(c && !c.drag){ c.drag = e.pointerId; c.vy = 0; chars.splice(chars.indexOf(c), 1); chars.push(c); }
  ptrs.set(e.pointerId, { x: p.x, y: p.y, c: c && c.drag === e.pointerId ? c : null, ox: c ? c.x - p.x : 0, oy: c ? c.y - p.y : 0 });
});
cv.addEventListener('pointermove', e => {
  const q = ptrs.get(e.pointerId); if(!q) return;
  const p = pos(e); q.x = p.x; q.y = p.y;
  if(pinch && (e.pointerId === pinch.a || e.pointerId === pinch.b)){
    const A = ptrs.get(pinch.a), B = ptrs.get(pinch.b);
    if(A && B && Math.hypot(A.x - B.x, A.y - B.y) - pinch.d0 > SPLIT_PX){ split(pinch.c); pinch = null; }
    return;
  }
  if(q.c){ q.c.x = p.x + q.ox; q.c.y = Math.min(floorY(), p.y + q.oy); }
});
function up(e){
  const q = ptrs.get(e.pointerId); if(!q) return;
  ptrs.delete(e.pointerId);
  if(pinch && (e.pointerId === pinch.a || e.pointerId === pinch.b)){ pinch = null; return; }
  const c = q.c; if(!c) return;
  c.drag = null;
  if(e.type === 'pointercancel') return;
  const o = overlapWith(c);
  if(o) merge(c, o);
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);

// ── した の ボタン ──
const spin = document.querySelector('.spin'), valEl = spin.querySelector('.val');
function spinUi(){ valEl.textContent = st.n; spin.querySelector('.m').classList.toggle('off', st.n <= 1); spin.querySelector('.p').classList.toggle('off', st.n >= N_MAX); }
spin.querySelector('.m').addEventListener('click', () => { st.n = Math.max(1, st.n - 1); spinUi(); save(); });
spin.querySelector('.p').addEventListener('click', () => { st.n = Math.min(N_MAX, st.n + 1); spinUi(); save(); });
document.getElementById('add').addEventListener('click', () => { if(addChar(st.n)) sayIdle(); });
document.getElementById('clear').addEventListener('click', () => { chars = []; save(); sayIdle(); });

// ── はじめ ──
resize();
bs = BS_MAX;
const t0 = now0();
chars = (Array.isArray(st.chars) ? st.chars.filter(okV).slice(0, MAX_CHARS) : []).map((v, i, a) => mk(v, W*(i + 1)/(a.length + 1), t0));
bs = targetBs();
spinUi(); sayIdle();
