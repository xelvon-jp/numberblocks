<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かぞくチャット">
<link rel="manifest" href="famchat.webmanifest">
<title>かぞくチャット</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; background:#8fa8c8; display:flex; flex-direction:column; height:100dvh; position:fixed; inset:0; overflow:hidden; overscroll-behavior:none; }
  button { font-family: inherit; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  header { -webkit-touch-callout: none; }

  /* ---------- setup ---------- */
  #setup { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto; }
  .card { background:#fff; border-radius:16px; padding:24px 20px; width:100%; max-width:360px; box-shadow:0 4px 20px rgba(0,0,0,.18); }
  .card h1 { margin:0 0 4px; font-size:22px; text-align:center; }
  .card .sub { text-align:center; color:#666; font-size:13px; margin-bottom:20px; }
  .card label { display:block; font-size:13px; font-weight:600; margin:16px 0 8px; color:#333; }
  .members { display:flex; gap:8px; }
  .members button { flex:1; padding:14px 4px; font-size:17px; border:2px solid #ddd; border-radius:12px; background:#fafafa; cursor:pointer; }
  .members button.sel { border-color:#06c755; background:#e9fbef; font-weight:700; }
  #codeInput { width:100%; padding:12px; font-size:16px; border:2px solid #ddd; border-radius:12px; }
  .hint { font-size:12px; color:#888; margin-top:6px; line-height:1.5; }
  #startBtn { width:100%; margin-top:20px; padding:14px; font-size:17px; font-weight:700; color:#fff; background:#06c755; border:none; border-radius:12px; cursor:pointer; }
  #startBtn:disabled { background:#bbb; }

  /* ---------- chat ---------- */
  #chat { position:fixed; left:0; right:0; top:0; height:100dvh; display:none; flex-direction:column; min-height:0; }
  header { background:#2f3e5c; color:#fff; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; gap:8px; }
  header .title { font-size:17px; font-weight:700; flex:1; }
  #status { font-size:12px; opacity:.9; }
  #status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#f66; margin-right:4px; vertical-align:middle; }
  #status.on .dot { background:#06c755; }
  #resetBtn { background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; }
  #msgs { flex:1; overflow-y:auto; padding:12px 10px; -webkit-overflow-scrolling:touch; }
  .day { text-align:center; margin:10px 0; }
  .day span { background:rgba(0,0,0,.18); color:#fff; font-size:11px; padding:3px 10px; border-radius:10px; }
  .row { display:flex; flex-direction:column; margin:2px 0 10px; }
  .row.mine { align-items:flex-end; }
  .row.theirs { flex-direction:row; align-items:flex-start; gap:6px; }
  .row .col { display:flex; flex-direction:column; min-width:0; width:100%; }
  .row.theirs .col { flex:1; width:auto; }
  .row.mine .col { align-items:flex-end; }
  .row.theirs .col { align-items:flex-start; }
  .avatar { flex:none; width:38px; height:38px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:21px; border:1px solid rgba(0,0,0,.15); background:#fff; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .avatar.bg-papa { background:#ffffff; }
  .avatar.bg-mama { background:#ffd6e8; }
  .avatar.bg-boku { background:#bfe3ff; }
  .who { font-size:11px; color:#fff; margin:0 2px 2px; text-shadow:0 1px 2px rgba(0,0,0,.25); }
  .bubble { max-width:75%; padding:9px 12px; border-radius:16px; font-size:16px; line-height:1.45; word-break:break-word; white-space:pre-wrap; position:relative; }
  .mine .bubble { border-top-right-radius:4px; }
  .theirs .bubble { border-top-left-radius:4px; }
  .bubble.from-papa { background:#ffffff; }
  .bubble.from-mama { background:#ffd6e8; }
  .bubble.from-boku { background:#bfe3ff; }
  .bubble.stamp { background:none; font-size:64px; padding:0 4px; line-height:1.1; }
  .bubble.photo { padding:4px; }
  .bubble.photo img { max-width:210px; max-height:260px; border-radius:12px; display:block; }
  .time { font-size:10px; color:rgba(255,255,255,.85); margin:2px 2px 0; text-shadow:0 1px 2px rgba(0,0,0,.2); }
  .read { font-size:10px; color:#1d6f2f; margin:0 2px; font-weight:bold; min-height:12px; }
  #stampPanel { display:none; background:#fff; padding:10px; grid-template-columns:repeat(6,1fr); gap:4px; border-top:1px solid #ddd; }
  #stampPanel.open { display:grid; }
  #stampPanel button { font-size:30px; padding:8px 0; background:none; border:none; cursor:pointer; border-radius:10px; }
  #stampPanel button:active { background:#eee; }
  #inputBar { background:#f6f6f6; border-top:1px solid #ddd; display:flex; align-items:flex-end; gap:6px; padding:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
  .iconBtn { flex:none; width:40px; height:40px; font-size:22px; background:none; border:none; cursor:pointer; border-radius:50%; }
  .iconBtn:active { background:#e5e5e5; }
  #textInput { flex:1; font-size:16px; padding:10px 12px; border:1px solid #ccc; border-radius:20px; resize:none; max-height:100px; outline:none; font-family:inherit; }
  #sendBtn { flex:none; height:40px; padding:0 16px; font-size:15px; font-weight:700; color:#fff; background:#06c755; border:none; border-radius:20px; cursor:pointer; }
  #sendBtn:disabled { background:#bbb; }
  #verLabel { font-size:11px; opacity:.75; padding:4px 2px; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:rgba(0,0,0,.82); color:#fff; font-size:14px; padding:10px 16px; border-radius:20px; display:none; z-index:60; white-space:nowrap; }
  #settingsPanel { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  #photoViewer { position:fixed; inset:0; background:#000; display:none; flex-direction:column; z-index:60; }
  #photoViewer.open { display:flex; }
  #photoViewer .pvBody { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  #photoViewer img { max-width:100%; max-height:100%; object-fit:contain; }
  #photoViewer .pvBar { display:flex; gap:10px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  #photoViewer .pvBar button { flex:1; padding:13px; border:none; border-radius:10px; font-size:16px; }
  #pvSave { background:#06c755; color:#fff; font-weight:bold; }
  #pvClose { background:#333; color:#fff; }
  #settingsPanel.open { display:flex; }
  #settingsPanel .box { background:#fff; border-radius:16px; padding:20px; width:100%; max-width:340px; max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #settingsPanel h2 { margin:0 0 12px; font-size:18px; }
  #settingsPanel label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; color:#333; }
  #settingsPanel input { width:100%; padding:11px; font-size:16px; border:2px solid #ddd; border-radius:10px; }
  #settingsPanel .row { display:flex; gap:8px; margin-top:16px; }
  #settingsPanel button { flex:1; padding:12px 6px; font-size:15px; border-radius:10px; border:2px solid #ddd; background:#fafafa; cursor:pointer; }
  #settingsPanel button.primary { background:#06c755; border-color:#06c755; color:#fff; font-weight:700; }
  #settingsPanel button.danger { color:#c00; }
  #settingsPanel .ver { color:#888; font-size:12px; margin-top:14px; text-align:center; }
  .row.mine .bubble { user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #emojiGrid { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin-top:8px; }
  #emojiGrid button { font-size:24px; padding:6px 0; background:#fafafa; border:2px solid #eee; border-radius:10px; cursor:pointer; }
  #emojiGrid button.sel { border-color:#06c755; background:#e9fbef; }
</style>
</head>
<body>

<div id="setup">
  <div class="card">
    <h1>💬 かぞくチャット</h1>
    <div class="sub">家族3人だけのチャットです</div>
    <label>あなたはだれ？</label>
    <div class="members" id="memberBtns">
      <button data-m="papa">👨<br>パパ</button>
      <button data-m="mama">👩<br>ママ</button>
      <button data-m="boku">👦<br>ぼく</button>
    </div>
    <label>家族の合言葉</label>
    <input id="codeInput" type="text" autocomplete="off" placeholder="例： さくら123">
    <div class="hint">3台とも同じ合言葉を入れてください。一度入れれば、次からはこの画面は出ません。</div>
    <button id="startBtn" disabled>はじめる</button>
  </div>
</div>

<div id="chat">
  <header>
    <div class="title">💬 かぞくチャット</div>
    <div id="status"><span class="dot"></span><span id="statusText">接続中…</span></div>
    <span id="verLabel">v6.0</span>
    <button id="resetBtn">設定</button>
  </header>
  <div id="msgs"></div>
  <div id="stampPanel"></div>
  <div id="inputBar">
    <button class="iconBtn" id="photoBtn" title="写真">＋</button>
    <input type="file" id="photoInput" accept="image/*" hidden>
    <button class="iconBtn" id="stampBtn" title="スタンプ">😊</button>
    <textarea id="textInput" rows="1" placeholder="メッセージ"></textarea>
    <button id="sendBtn">送信</button>
  </div>
</div>

<div id="settingsPanel">
  <div class="box">
    <h2>設定</h2>
    <label>あなたの表示名</label>
    <input id="nameInput" type="text" maxlength="12" autocomplete="off">
    <div class="row">
      <button id="nameSaveBtn" class="primary">名前を保存</button>
    </div>
    <label>あなたのアイコン</label>
    <div style="display:flex; align-items:center; gap:12px;">
      <div id="iconPreview" class="avatar" style="width:48px; height:48px; font-size:26px;"></div>
      <div style="font-size:12px; color:#888; line-height:1.5;">写真を設定すると写真が優先されます。<br>絵文字を押すと写真は外れます。</div>
    </div>
    <div id="emojiGrid"></div>
    <div class="row">
      <button id="iconPhotoBtn">写真を選ぶ</button>
      <button id="iconPhotoClearBtn">写真をやめる</button>
    </div>
    <input type="file" id="iconPhotoInput" accept="image/*" hidden>
    <label>通知</label>
    <div style="font-size:12px; color:#888; line-height:1.5;">アプリを閉じていても、新しいメッセージが来たら通知します。ホーム画面のアイコンから開いた状態で ON にしてください。</div>
    <div class="row">
      <button id="pushBtn" class="primary">通知をONにする</button>
    </div>
    <div id="pushState" style="font-size:12px; color:#666; margin-top:6px;"></div>
    <div class="row">
      <button id="cfgResetBtn" class="danger">設定をリセット</button>
      <button id="settingsCloseBtn">閉じる</button>
    </div>
    <div class="ver">かぞくチャット <span id="verInfo">v6.0</span>（バージョンを長押しすると最新版に再読み込みします）</div>
  </div>
</div>
<div id="photoViewer">
  <div class="pvBody"><img id="pvImg" alt="写真"></div>
  <div class="pvBar"><button id="pvSave">ほぞんする</button><button id="pvClose">とじる</button></div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ================= かぞくチャット v5 (Supabase mailbox + E2E encryption + profiles/app icon + push) ================= */
const MEMBERS = {
  papa: { name: "パパ", icon: "👨" },
  mama: { name: "ママ", icon: "👩" },
  boku: { name: "ぼく", icon: "👦" },
};
const STAMPS = ["😊","😂","😍","👍","🙏","😴","😋","🤔","😲","😭","🚗","🚃","🍓","🍙","⚽","🎈","🐱","🐶","🌟","💤","⭕","❌","❓","❗"];
const SUPABASE_URL = "https://bynbisgrozqacoimnyvs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JXRs0eBVWGHPC_a4QTy_iw_JbNbRADu";
const SERVER_TABLE = "famchat_messages";
const APP_VERSION = "v6.0";
const LS_CFG = "famchat_cfg";
const MAX_KEEP = 300;

const $ = s => document.querySelector(s);
let cfg = null;            // {member, code}
let roomKey = "";          // hash of code
let sb = null;             // supabase client
let roomServer = "";       // SHA-256 hex of the code (server-side room id)
let encKey = null;         // AES-GCM key derived from the code
let serverOk = false;
let outbox = [];           // encrypted rows waiting to be inserted
let msgs = [];             // sorted by ts, id
let msgIds = new Set();
let bc = null;
let profiles = {};         // member -> {name, nameTs, emoji, photo, iconTs} (synced via control messages)
const LS_PROFILES = "famchat_profiles_v4";
let deletedIds = {};       // messageId -> ts (unsend tombstones, synced)
const LS_NAMES = "famchat_names_v3";
const LS_DELETED = "famchat_deleted_v3";
const LS_READS = "famchat_reads_v6";

/* ---------- tiny hash for the room id (obscuring only, not security) ---------- */
function hashStr(s) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) {
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
}
function lsOutboxKey() { return "famchat_outbox_" + roomKey; }
function lsHistoryKey() { return "famchat_hist_" + roomKey; }

/* ================= setup screen ================= */
let selMember = null;
$("#memberBtns").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  selMember = b.dataset.m;
  document.querySelectorAll("#memberBtns button").forEach(x => x.classList.toggle("sel", x === b));
  validateSetup();
});
$("#codeInput").addEventListener("input", validateSetup);
function validateSetup() { $("#startBtn").disabled = !(selMember && $("#codeInput").value.trim()); }
$("#startBtn").addEventListener("click", () => {
  cfg = { member: selMember, code: $("#codeInput").value.trim() };
  localStorage.setItem(LS_CFG, JSON.stringify(cfg));
  startChat();
});
/* ---------- long-press helper + toast (common spec: settings needs a deliberate gesture) ---------- */
function addLongPress(el, ms, fn) {
  let timer = null, fired = false;
  const start = e => { fired = false; timer = setTimeout(() => { fired = true; fn(); }, ms); };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener("pointerdown", start);
  el.addEventListener("pointerup", cancel);
  el.addEventListener("pointerleave", cancel);
  el.addEventListener("pointercancel", cancel);
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("click", e => { if (fired) { e.preventDefault(); e.stopPropagation(); fired = false; } }, true);
}
let toastTimer = null;
function showToast(text) {
  const t = $("#toast"); t.textContent = text; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, 1800);
}
function hardReload() {
  showToast("最新版を確認しています…");
  setTimeout(() => location.replace(location.pathname + "?u=" + Date.now()), 250);
}
/* settings opens only on long-press, so a child cannot open it by accident */
addLongPress($("#resetBtn"), 1200, () => {
  $("#nameInput").value = displayName(cfg ? cfg.member : "boku");
  refreshIconSettings(); updatePushUI();
  $("#settingsPanel").classList.add("open");
});
$("#resetBtn").addEventListener("click", () => showToast("設定は長押しで開きます"));
addLongPress($("#verLabel"), 1000, hardReload);
$("#settingsCloseBtn").addEventListener("click", () => $("#settingsPanel").classList.remove("open"));
$("#settingsPanel").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove("open"); });

/* ---------- photo viewer + save ---------- */
let pvSrc = null;
function openPhotoViewer(src) { pvSrc = src; $("#pvImg").src = src; $("#photoViewer").classList.add("open"); }
function closePhotoViewer() { $("#photoViewer").classList.remove("open"); $("#pvImg").src = ""; pvSrc = null; }
$("#pvClose").addEventListener("click", closePhotoViewer);
$("#photoViewer").addEventListener("click", e => { if (e.target.id === "photoViewer" || e.target.classList.contains("pvBody")) closePhotoViewer(); });
$("#pvSave").addEventListener("click", async () => {
  if (!pvSrc) return;
  try {
    const blob = await (await fetch(pvSrc)).blob();
    const file = new File([blob], "famchat-photo.jpg", { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    throw new Error("share unsupported");
  } catch (err) {
    if (err && err.name === "AbortError") return;
    const a = document.createElement("a"); a.href = pvSrc; a.download = "famchat-photo.jpg"; document.body.appendChild(a); a.click(); a.remove();
    showToast("保存できない時は、写真を長押しして「写真に追加」");
  }
});
$("#cfgResetBtn").addEventListener("click", () => {
  if (confirm("設定を消して、最初の画面に戻りますか？（履歴はこの端末に残ります）")) {
    localStorage.removeItem(LS_CFG);
    location.reload();
  }
});
$("#nameSaveBtn").addEventListener("click", () => {
  const v = $("#nameInput").value.trim();
  if (!v || !cfg) return;
  $("#settingsPanel").classList.remove("open");
  if (v !== displayName(cfg.member)) sendNameUpdate(v);
  showToast("名前を「" + v + "」にしました");
});

/* ================= chat core ================= */
function loadHistory() {
  try { msgs = JSON.parse(localStorage.getItem(lsHistoryKey()) || "[]"); }
  catch (e) { msgs = []; }
  if (!Array.isArray(msgs)) msgs = [];
  msgIds = new Set(msgs.map(m => m.id));
}
function saveHistory() {
  msgs.sort((a, b) => a.ts - b.ts || (a.id < b.id ? -1 : 1));
  if (msgs.length > MAX_KEEP) msgs = msgs.slice(-MAX_KEEP);
  msgIds = new Set(msgs.map(m => m.id));
  try { localStorage.setItem(lsHistoryKey(), JSON.stringify(msgs)); } catch (e) { /* photo may overflow; drop oldest photos */
    msgs = msgs.filter(m => m.type !== "photo").concat(msgs.filter(m => m.type === "photo").slice(-10));
    try { localStorage.setItem(lsHistoryKey(), JSON.stringify(msgs)); } catch (e2) {}
  }
}
function loadProfiles() {
  try { profiles = JSON.parse(localStorage.getItem(LS_PROFILES) || "{}"); } catch (e) { profiles = {}; }
  if (!profiles || typeof profiles !== "object") profiles = {};
  try { const old = JSON.parse(localStorage.getItem(LS_NAMES) || "{}");
    for (const m of Object.keys(old || {})) { if (old[m] && old[m].name && (!profiles[m] || (old[m].ts || 0) > (profiles[m].nameTs || 0))) { profiles[m] = Object.assign({}, profiles[m], { name: old[m].name, nameTs: old[m].ts || 0 }); } }
  } catch (e) {}
}
function saveProfiles() { try { localStorage.setItem(LS_PROFILES, JSON.stringify(profiles)); } catch (e) {} }
function prof(m) { return profiles[m] || {}; }
function displayEmoji(member) { return prof(member).emoji || MEMBERS[member].icon; }
function loadDeleted() { try { deletedIds = JSON.parse(localStorage.getItem(LS_DELETED) || "{}"); } catch (e) { deletedIds = {}; } if (!deletedIds || typeof deletedIds !== "object") deletedIds = {}; }
function saveDeleted() { try { localStorage.setItem(LS_DELETED, JSON.stringify(deletedIds)); } catch (e) {} }
function displayName(member) { return prof(member).name || MEMBERS[member].name; }
function senderName(m) { return prof(m.from).name || m.name || MEMBERS[m.from].name; }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function sendControl(m) { if (bc) bc.postMessage({ kind: "control", msg: m }); queueServerSend(m); }
/* ---------- read receipts ---------- */
let reads = {};
function loadReads() { try { reads = JSON.parse(localStorage.getItem(LS_READS + "_" + roomKey) || "{}") || {}; } catch (e) { reads = {}; } }
function saveReads() { try { localStorage.setItem(LS_READS + "_" + roomKey, JSON.stringify(reads)); } catch (e) {} }
function readLabel(m) {
  let n = 0; const total = Object.keys(MEMBERS).length - 1;
  for (const k of Object.keys(MEMBERS)) { if (k !== m.from && (reads[k] || 0) >= m.ts) n++; }
  return n === 0 ? "" : (n >= total ? "既読" : "既読 " + n);
}
function paintReads() {
  document.querySelectorAll("#msgs .row.mine").forEach(row => {
    const el = row.querySelector(".read"); if (!el) return;
    el.textContent = readLabel({ from: row.dataset.from, ts: +row.dataset.ts || 0 });
  });
}
let lastReadSent = 0, readTimer = null;
function sendRead() {
  if (readTimer) return;
  readTimer = setTimeout(() => {
    readTimer = null;
    if (!cfg || document.hidden) return;
    let upto = 0; for (const m of msgs) { if (m.ts > upto) upto = m.ts; }
    if (!upto || upto <= lastReadSent) return;
    lastReadSent = upto;
    if ((reads[cfg.member] || 0) < upto) { reads[cfg.member] = upto; saveReads(); }
    sendControl({ id: newId(), from: cfg.member, type: "read", body: String(upto), ts: Date.now() });
  }, 800);
}
function sendNameUpdate(name) {
  const ts = Date.now();
  profiles[cfg.member] = Object.assign({}, prof(cfg.member), { name, nameTs: ts }); saveProfiles(); renderAll();
  sendControl({ id: newId(), from: cfg.member, type: "name", body: name, ts });
}
function sendIconUpdate(emoji, photo) {
  const ts = Date.now();
  profiles[cfg.member] = Object.assign({}, prof(cfg.member), { emoji, photo, iconTs: ts }); saveProfiles(); renderAll();
  sendControl({ id: newId(), from: cfg.member, type: "profile", body: JSON.stringify({ emoji, photo }), ts });
}
function doUnsend(targetId) {
  deletedIds[targetId] = Date.now(); saveDeleted();
  msgs = msgs.filter(x => x.id !== targetId); saveHistory(); renderAll();
  sendControl({ id: newId(), from: cfg.member, type: "delete", body: targetId, ts: Date.now() });
  if (sb) { try { sb.from(SERVER_TABLE).delete().eq("id", targetId).then(() => {}, () => {}); } catch (e) {} }
}
function applyControl(m) {
  if (!m || !MEMBERS[m.from]) return false;
  if (m.type === "name" && typeof m.body === "string" && m.body) {
    if ((m.ts || 0) > (prof(m.from).nameTs || 0)) { profiles[m.from] = Object.assign({}, prof(m.from), { name: m.body.slice(0, 12), nameTs: m.ts || 0 }); saveProfiles(); return true; }
  } else if (m.type === "profile" && typeof m.body === "string") {
    if ((m.ts || 0) > (prof(m.from).iconTs || 0)) {
      try { const d = JSON.parse(m.body);
        profiles[m.from] = Object.assign({}, prof(m.from), { emoji: (typeof d.emoji === "string" && d.emoji) ? d.emoji : null, photo: (typeof d.photo === "string" && d.photo.startsWith("data:image/")) ? d.photo : null, iconTs: m.ts || 0 });
        saveProfiles(); return true;
      } catch (e) { return false; }
    }
  } else if (m.type === "read") {
    const upto = parseInt(m.body, 10) || 0;
    if (upto > (reads[m.from] || 0)) { reads[m.from] = upto; saveReads(); paintReads(); }
    return false;
  } else if (m.type === "delete" && typeof m.body === "string") {
    if (!deletedIds[m.body]) { deletedIds[m.body] = m.ts || Date.now(); saveDeleted(); }
    if (msgs.some(x => x.id === m.body)) { msgs = msgs.filter(x => x.id !== m.body); saveHistory(); return true; }
    return false;
  }
  return false;
}
function addMsg(m) {
  if (!m || !m.id || msgIds.has(m.id)) return false;
  if (deletedIds[m.id]) return false;
  if (!MEMBERS[m.from] || !["text", "stamp", "photo"].includes(m.type)) return false;
  msgs.push(m); msgIds.add(m.id);
  saveHistory(); renderMsg(m); scrollBottom();
  return true;
}
function sendMsg(type, body) {
  const m = { id: newId(), from: cfg.member, type, body, ts: Date.now(), name: displayName(cfg.member) };
  addMsg(m);
  if (bc) bc.postMessage({ kind: "chat", msg: m });
  queueServerSend(m);
}

/* ---------- crypto: key + room from the family code (WebCrypto) ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function u8ToB64(u8) { let bin = ""; for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(bin); }
function b64ToU8(b64) { const bin = atob(b64); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; }
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", te.encode(text));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function deriveKey(code) {
  const base = await crypto.subtle.importKey("raw", te.encode(code), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: te.encode("famchat-enc-salt-v2"), iterations: 120000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptMsg(m) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, encKey, te.encode(JSON.stringify(m)));
  return { id: m.id, room: roomServer, iv: u8ToB64(iv), data: u8ToB64(new Uint8Array(ct)), ts: m.ts, sender: m.from, kind: (m.type === "name" || m.type === "profile" || m.type === "delete" || m.type === "read") ? "control" : "chat" };
}
async function decryptRow(row) {
  try {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToU8(row.iv) }, encKey, b64ToU8(row.data));
    const m = JSON.parse(td.decode(pt));
    return (m && m.id) ? m : null;
  } catch (e) { return null; }  // different code / damaged row: silently skip
}

/* ---------- transport: Supabase mailbox + BroadcastChannel (same device) ---------- */
function serverConfigured() { return SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 20; }
function updateStatus() {
  if (!serverConfigured()) { $("#status").classList.remove("on"); $("#statusText").textContent = "サーバ未設定（この端末のみ）"; return; }
  $("#status").classList.toggle("on", serverOk);
  $("#statusText").textContent = serverOk ? (outbox.length ? "送信待ち " + outbox.length + "件" : "サーバと同期中") : "サーバに接続中…";
}
function loadOutbox() { try { outbox = JSON.parse(localStorage.getItem(lsOutboxKey()) || "[]"); } catch (e) { outbox = []; } if (!Array.isArray(outbox)) outbox = []; }
function saveOutbox() { try { localStorage.setItem(lsOutboxKey(), JSON.stringify(outbox)); } catch (e) {} }
async function flushOutbox() {
  if (!sb || !outbox.length) return;
  const rows = outbox.slice();
  const { error } = await sb.from(SERVER_TABLE).insert(rows);
  if (!error) {
    const sent = new Set(rows.map(r => r.id));
    outbox = outbox.filter(r => !sent.has(r.id));
    saveOutbox(); serverOk = true;
  }
  updateStatus();
}
async function queueServerSend(m) {
  if (!serverConfigured()) return;
  const row = await encryptMsg(m);
  outbox.push(row); saveOutbox();
  flushOutbox();
}
let fetching = false;
async function fetchMissed() {
  if (!sb || fetching) return;
  fetching = true;
  try {
    const { data, error } = await sb.from(SERVER_TABLE)
      .select("id,iv,data,ts").eq("room", roomServer)
      .order("ts", { ascending: true }).limit(500);
    if (!error && Array.isArray(data)) {
      serverOk = true;
      let changed = false;
      for (const row of data) {
        const m = await decryptRow(row); if (!m) continue;
        if (m.type === "name" || m.type === "delete" || m.type === "profile" || m.type === "read") { if (applyControl(m)) changed = true; }
        else if (!msgIds.has(row.id)) addMsg(m);
      }
      if (changed) renderAll();
    } else if (error) { serverOk = false; }
  } catch (e) { serverOk = false; }
  fetching = false;
  updateStatus();
  flushOutbox();
  sendRead();
}
function startTransport() {
  try { bc = new BroadcastChannel("famchat_" + roomKey); bc.onmessage = e => { if (!e.data) return; if (e.data.kind === "chat") addMsg(e.data.msg); else if (e.data.kind === "control") { if (applyControl(e.data.msg)) renderAll(); } }; } catch (e) {}
  if (!serverConfigured() || typeof supabase === "undefined") { updateStatus(); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  fetchMissed();
  try {
    sb.channel("famchat-live")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: SERVER_TABLE, filter: "room=eq." + roomServer },
        async payload => { const row = payload.new; if (!row) return; const m = await decryptRow(row); if (!m) return;
          if (m.type === "name" || m.type === "delete" || m.type === "profile" || m.type === "read") { if (applyControl(m)) renderAll(); }
          else if (!msgIds.has(row.id)) addMsg(m);
          serverOk = true; updateStatus(); sendRead(); })
      .subscribe();
  } catch (e) {}
  setInterval(fetchMissed, 10000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchMissed(); });
  window.addEventListener("online", fetchMissed);
}

/* ---------- push notifications ---------- */
let swReg = null;
async function ensureSW() {
  if (!("serviceWorker" in navigator)) return null;
  try { swReg = await navigator.serviceWorker.register("famchat-sw.js"); } catch (e) {}
  return swReg;
}
function u8FromB64url(str) {
  const b64 = str.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (str.length % 4)) % 4);
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
function setPushState(t) { const el = $("#pushState"); if (el) el.textContent = t; }
async function fetchVapidKey() {
  const r = await fetch(SUPABASE_URL + "/functions/v1/bright-worker", { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY } });
  if (!r.ok) throw new Error("通知係に届きません(" + r.status + ")");
  const j = await r.json();
  if (!j.publicKey) throw new Error("公開鍵がありません");
  return j.publicKey;
}
async function saveSubscription(sub) {
  try { localStorage.setItem("famchat_push_endpoint", sub.endpoint); } catch (e) {}
  if (!sb) return;
  try {
    const { error } = await sb.from("famchat_push_subs").insert({ room: roomServer, member: cfg.member, endpoint: sub.endpoint, sub: JSON.stringify(sub.toJSON()) });
    if (error && !/duplicate|unique/i.test(error.message || "")) console.warn("push sub save", error.message);
  } catch (e) {}
}
async function enablePush() {
  try {
    if (!("PushManager" in window) || !("Notification" in window)) { setPushState("この開き方では通知を使えません。ホーム画面のアイコンから開いてください。"); return; }
    setPushState("許可を確認しています…");
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { setPushState("通知が許可されませんでした（iPhone の「設定」→「通知」から変更できます）。"); return; }
    const reg = (await ensureSW()) || (await navigator.serviceWorker.ready);
    const pub = await fetchVapidKey();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8FromB64url(pub) });
    await saveSubscription(sub);
    setPushState("通知は ON です。アプリを閉じていても届きます。");
    showToast("通知をONにしました");
  } catch (e) { setPushState("うまくいきませんでした：" + (e && e.message ? e.message : e)); }
}
async function refreshPushSubscription() {
  try {
    if (!("PushManager" in window) || !("Notification" in window) || Notification.permission !== "granted") return;
    const reg = (await ensureSW()) || (await navigator.serviceWorker.ready);
    const sub = await reg.pushManager.getSubscription();
    if (sub) await saveSubscription(sub);
    if (navigator.clearAppBadge) { try { navigator.clearAppBadge(); } catch (e) {} }
  } catch (e) {}
}
function updatePushUI() {
  if (!("Notification" in window)) { setPushState("この開き方では通知を使えません。ホーム画面のアイコンから開いてください。"); return; }
  setPushState(Notification.permission === "granted" ? "通知は ON です（許可済み）。" : "まだ ON になっていません。");
}

function setupAppIcon() {
  try {
    const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = APP_ICON_DATA; document.head.appendChild(l);
    const f = document.createElement("link"); f.rel = "icon"; f.type = "image/jpeg"; f.href = APP_ICON_DATA; document.head.appendChild(f);
  } catch (e) {}
}
setupAppIcon();

/* ================= boot ================= */
async function startChat() {
  roomKey = hashStr("famchat:" + cfg.code);
  $("#setup").style.display = "none";
  $("#chat").style.display = "flex";
  loadProfiles(); loadDeleted(); loadReads();
  loadHistory(); renderAll(); loadOutbox();
  roomServer = await sha256Hex("famchat-room-v2:" + cfg.code);
  encKey = await deriveKey(cfg.code);
  startTransport(); updateStatus();
  refreshPushSubscription();
}
/* ---------- keep the header visible when the iOS keyboard opens ---------- */
let stickBottom = true;
function fitViewport() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const t = vv ? vv.offsetTop : 0;
  ["#chat"].forEach(sel => { const el = document.querySelector(sel); if (el) { el.style.height = h + "px"; el.style.top = t + "px"; } });
  const sp = document.querySelector("#settingsPanel"); if (sp) { sp.style.height = h + "px"; sp.style.top = t + "px"; }
  if (stickBottom) requestAnimationFrame(() => { const m = document.querySelector("#msgs"); if (m) m.scrollTop = m.scrollHeight; });
}
if (window.visualViewport) { visualViewport.addEventListener("resize", fitViewport); visualViewport.addEventListener("scroll", fitViewport); }
window.addEventListener("resize", fitViewport);
window.addEventListener("orientationchange", () => setTimeout(fitViewport, 100));
fitViewport();
ensureSW();
$("#verLabel").textContent = APP_VERSION;
$("#verInfo").textContent = APP_VERSION;
try {
  const saved = JSON.parse(localStorage.getItem(LS_CFG) || "null");
  if (saved && MEMBERS[saved.member] && saved.code) { cfg = saved; startChat(); }
} catch (e) {}
</script>
