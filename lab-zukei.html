                  box-shadow:0 1px 3px rgba(40,60,90,0.15); line-height:1.9; }

<body>

<script>
// ページと いっしょに 新しい スクリプトを 読む（古い キャッシュと まざらないように。index.html と おなじ しくみ）
(function(){

  ['overrides.js', 'engine.js'].forEach(function(f){ document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });

</script>
<script>
// ─── 図形の面積（ずけい を「とく」から「あそんで まなぶ」へ。2026-10-24。さいしょ は lab-sankaku.html の 三角形 だけ だった）─────
// 三角形・長方形・正方形・平行四辺形・台形・ひし形。うえ の ボタン で えらぶ。
// ・したの かず で へん の ながさ を えらぶ と、その 図形 が マス目 の うえに でる。へん は その かず の キャラの いろ の キューブ が ならび、
//   ながさ の かず も かく。うごかせる ●（かど・てっぺん）は ゆっくり てんめつ。● の 大きさ は どの 図形 でも だいたい おなじ。
// ・しき は しょうがっこう の かきかた、かんじ に ルビ（パパ）：
//     台形の面積
//     ＝(上底＋下底)×高さ÷2
//     ＝(3＋6)×4÷2
//     ＝9×4÷2      ← ここ から した は 図形 を タップ した とき（アニメ に あわせて じゅんに でる）
//     ＝36÷2
//     ＝18
// ・タップ の アニメ（図形 ごと）：三角形・ひし形 は まわり の 長方形 の はんぶん、長方形・正方形 は 1マス ずつ うまる、
//   平行四辺形 は ひだり の 三角形 を きって みぎへ（長方形 に なる）、台形 は おなじ 台形 を さかさ に つないで 平行四辺形 → はんぶん。
//   さいご に 面積 の キャラ が とびだす。もう いちど タップ で もどる。
// ・いつも おだい（コンセプト は きまった ので じゆう に あそぶ モード は なし。パパ）：「底辺が7、高さが6の三角形の面積を調べよう！」。
//   かたち を つくって「できた！」ボタン（図形 の タップ では ない）。ちがう とき は ぷるぷる して どこ が ちがう か だけ。
//   あって いれば アニメ → 面積 の キャラ が まんなか に とびだして 2びょう ほど はねて よろこぶ（celebrate）→「つぎ ▶」。
//   こたえ が でる まで は タップ で 面積 を ださない。せいかい の あと「つぎ ▶」まで は 等積変形 だけ。
// ・「ひろさ おなじ」の ことば や まえ の かたち の てんせん は ださない（パパ）。きろく は のこさない（ためし）。
const MAXN = 10, XMIN = -4, XMAX = 16;
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), stageEl = document.getElementById('stage'), sayEl = document.getElementById('say');
let W = 0, H = 0, C = 20, OX = 0, OY = 0, VL = -3, VR = 12, view = null;
let mode = 'shape', anim = null, drag = null, fx = [], shakeT = -1e9, slot = 0;
const fmt = v => Number.isInteger(v) ? String(v) : String(+v.toFixed(2));
const ease = k => k < 0 ? 0 : k > 1 ? 1 : k*k*(3 - 2*k);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rubyHTML = s => s.replace(/\{([^|}]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
const say = s => { sayEl.innerHTML = rubyHTML(s); };
const W_ = { area: '{面積|めんせき}', base: '{底辺|ていへん}', hgt: '{高|たか}さ', rect: '{長方形|ちょうほうけい}', para: '{平行四辺形|へいこうしへんけい}',
             upper: '{上底|じょうてい}', lower: '{下底|かてい}', diag: '{対角線|たいかくせん}', side: '1{辺|へん}', yoko: '{横|よこ}' };

// ── 図形 ごと の きまり ──────────────────────────────────────────────
// p：へん の ながさ（ボタン で えらぶ もの）[キー, なまえ]。pts：かど（マス）。law：こうしき。steps：かず を いれた しき（[しき, でる とき（0〜1）]）。
// handles：うごかせる ●（x, y と、ドラッグ で どう かわるか）。rulers：へん の キューブ（h：よこ、v：たて）。hline：高さ の てんせん。
// overlay：タップ の アニメ（ph：0〜1）。
const SH = {
  tri: { name: '{三角形|さんかくけい}', p: [['b', W_.base], ['h', W_.hgt]], st: { b: 6, h: 4, px: 2 },
    pts: s => [[0, 0], [s.b, 0], [s.px, s.h]], area: s => s.b*s.h/2,
    law: '＝' + W_.base + '×' + W_.hgt + '÷2',
    steps: s => [['＝' + s.b + '×' + s.h + '÷2', 0], ['＝' + s.b*s.h + '÷2', 0.25], ['＝' + fmt(s.b*s.h/2), 0.6]],
    handles: s => [{ x: s.px, y: s.h, keep: true, set: (gx, gy) => { s.px = gx; s.h = clamp(gy, 1, MAXN); } }, { x: s.b, y: 0, set: gx => { s.b = clamp(gx, 1, MAXN); } }],
    rulers: s => [{ k: 'b', n: s.b, x: 0, y: 0, dir: 'h' }, { k: 'h', n: s.h, x: Math.max(s.b, s.px) + 1, dir: 'v' }],
    hline: s => ({ x: s.px, y: s.h, l: 0, r: s.b }),
    overlay: (ph, s) => halfRect(ph, 0, s.b, s.h, W_.rect + ' ' + s.b + '×' + s.h + '＝' + s.b*s.h),
    onSet: (s, k, v, old) => { if(k === 'b') s.px = Math.round(s.px*v/old); } },
  rect: { name: '{長方形|ちょうほうけい}', p: [['h', 'たて'], ['w', W_.yoko]], st: { w: 6, h: 4 },
    pts: s => [[0, 0], [s.w, 0], [s.w, s.h], [0, s.h]], area: s => s.w*s.h,
    law: '＝たて×' + W_.yoko,
    steps: s => [['＝' + s.h + '×' + s.w, 0], ['＝' + s.w*s.h, 0.55]],
    handles: s => [{ x: s.w, y: s.h, set: (gx, gy) => { s.w = clamp(gx, 1, MAXN); s.h = clamp(gy, 1, MAXN); } }],
    rulers: s => [{ k: 'w', n: s.w, x: 0, y: 0, dir: 'h' }, { k: 'h', n: s.h, x: s.w + 1, dir: 'v' }],
    overlay: (ph, s) => fillCells(ph, s.w, s.h) },
  sq: { name: '{正方形|せいほうけい}', p: [['a', W_.side]], st: { a: 5 },
    pts: s => [[0, 0], [s.a, 0], [s.a, s.a], [0, s.a]], area: s => s.a*s.a,
    law: '＝' + W_.side + '×' + W_.side,
    steps: s => [['＝' + s.a + '×' + s.a, 0], ['＝' + s.a*s.a, 0.55]],
    handles: s => [{ x: s.a, y: s.a, set: (gx, gy) => { s.a = clamp(Math.abs(gx - s.a) >= Math.abs(gy - s.a) ? gx : gy, 1, MAXN); } }],
    rulers: s => [{ k: 'a', n: s.a, x: 0, y: 0, dir: 'h' }, { k: 'a', n: s.a, x: s.a + 1, dir: 'v' }],
    overlay: (ph, s) => fillCells(ph, s.a, s.a) },
  para: { name: W_.para, p: [['b', W_.base], ['h', W_.hgt]], st: { b: 6, h: 4, off: 2 },
    pts: s => [[0, 0], [s.b, 0], [s.b + s.off, s.h], [s.off, s.h]], area: s => s.b*s.h,
    law: '＝' + W_.base + '×' + W_.hgt,
    steps: s => [['＝' + s.b + '×' + s.h, 0], ['＝' + s.b*s.h, 0.6]],
    handles: s => [{ x: s.off, y: s.h, keep: true, set: (gx, gy) => { s.off = gx; s.h = clamp(gy, 1, MAXN); } }, { x: s.b, y: 0, set: gx => { s.b = clamp(gx, 1, MAXN); } }],
    rulers: s => [{ k: 'b', n: s.b, x: 0, y: 0, dir: 'h' }, { k: 'h', n: s.h, x: Math.max(s.b, s.b + s.off) + 1, dir: 'v' }],
    hline: s => ({ x: s.off, y: s.h, l: 0, r: s.b }),
    overlay: (ph, s) => cutMove(ph, s) },
  trap: { name: '{台形|だいけい}', p: [['a', W_.upper], ['b', W_.lower], ['h', W_.hgt]], st: { a: 3, b: 6, h: 4, off: 1 },
    pts: s => [[0, 0], [s.b, 0], [s.off + s.a, s.h], [s.off, s.h]], area: s => (s.a + s.b)*s.h/2,
    law: '＝(' + W_.upper + '＋' + W_.lower + ')×' + W_.hgt + '÷2',
    steps: s => [['＝(' + s.a + '＋' + s.b + ')×' + s.h + '÷2', 0], ['＝' + (s.a + s.b) + '×' + s.h + '÷2', 0.15], ['＝' + (s.a + s.b)*s.h + '÷2', 0.35], ['＝' + fmt((s.a + s.b)*s.h/2), 0.62]],
    handles: s => [{ x: s.off, y: s.h, keep: true, set: (gx, gy) => { s.off = gx; s.h = clamp(gy, 1, MAXN); } },
                   { x: s.off + s.a, y: s.h, set: gx => { s.a = clamp(gx - s.off, 1, MAXN); } },
                   { x: s.b, y: 0, set: gx => { s.b = clamp(gx, 1, MAXN); } }],
    rulers: s => [{ k: 'b', n: s.b, x: 0, y: 0, dir: 'h' }, { k: 'a', n: s.a, x: s.off, y: s.h, dir: 'h', up: true },
                  { k: 'h', n: s.h, x: Math.min(0, s.off) - 2, dir: 'v', left: true }],   // ひだり（みぎ は アニメ で さかさ の 台形 が つながる）
    hline: s => ({ x: s.off, y: s.h, l: 0, r: s.b }),
    overlay: (ph, s) => trapCopy(ph, s) },
  rhom: { name: '{ひし形|ひしがた}', p: [['d1', W_.diag + '(' + W_.yoko + ')'], ['d2', W_.diag + '(たて)']], st: { d1: 6, d2: 4 },
    pts: s => [[0, s.d2/2], [s.d1/2, 0], [s.d1, s.d2/2], [s.d1/2, s.d2]], area: s => s.d1*s.d2/2,
    law: '＝' + W_.diag + '×' + W_.diag + '÷2',
    steps: s => [['＝' + s.d1 + '×' + s.d2 + '÷2', 0], ['＝' + s.d1*s.d2 + '÷2', 0.25], ['＝' + fmt(s.d1*s.d2/2), 0.6]],
    handles: s => [{ x: s.d1, y: s.d2/2, set: gx => { s.d1 = clamp(gx, 1, MAXN); } }, { x: s.d1/2, y: s.d2, set: (gx, gy) => { s.d2 = clamp(gy, 1, MAXN); } }],
    rulers: s => [{ k: 'd1', n: s.d1, x: 0, y: 0, dir: 'h' }, { k: 'd2', n: s.d2, x: s.d1 + 1, dir: 'v' }],
    diag: true,
    overlay: (ph, s) => halfRect(ph, 0, s.d1, s.d2, W_.rect + ' ' + s.d1 + '×' + s.d2 + '＝' + s.d1*s.d2) },
};
const ORDER = ['tri', 'rect', 'sq', 'para', 'trap', 'rhom'];
let cur = (/[?&]s=(\w+)/.exec(location.search) || [])[1];
if(!SH[cur]) cur = 'tri';
const S = () => SH[cur], st = () => SH[cur].st;
const area = () => S().area(st());

// ── がめん の 大きさ・ズーム ──
const FS = 18, LH = FS*1.9;
const panelH = () => (2 + S().steps(st()).length)*LH + 12;          // しき の ぎょう の ぶん うえ を あける
function bounds(){
  const s = st(), P = S().pts(s), xs = P.map(p => p[0]).concat(S().rulers(s).map(r => r.dir === 'v' ? r.x + 1 : r.x + r.n));
  const rs = S().rulers(s), lx = Math.min(...rs.map(r => r.dir === 'v' && r.left ? r.x - 1.6 : 0));
  if(cur === 'trap') xs.push(s.b + s.off + s.a);                      // さかさ に つなぐ 台形 の ぶん
  return { l: Math.min(...P.map(p => p[0]), 0, lx + 1) - 1, r: Math.max(...xs) + 1.8, t: Math.max(...P.map(p => p[1])) + (cur === 'trap' ? 2.2 : 1.2) };
}
function fitView(now){
  const b = bounds(), bottom = 2.4, Hc = H - panelH();
  const c = Math.max(12, Math.min(64, W/(b.r - b.l), Hc/(b.t + bottom)));
  view = { C: c, OX: (W - (b.r - b.l)*c)/2 - b.l*c, OY: H - bottom*c - Math.max(0, (Hc - (b.t + bottom)*c)/2) };
  if(now){ C = view.C; OX = view.OX; OY = view.OY; }
}
function resize(){
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  W = stageEl.clientWidth; H = stageEl.clientHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fitView(true);
}
window.addEventListener('resize', resize);
// おだい の カード で #stage の たかさ が かわる（window の resize は こない）。みはらない と えが つぶれて さわれない
if(typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { if(stageEl.clientWidth !== W || stageEl.clientHeight !== H) resize(); }).observe(stageEl);
const sx = x => OX + x*C, sy = y => OY - y*C;

// ── かず の キャラ（2.5 など は ガラス を のせる）──
function charDims(v){ const k = Math.floor(v), s = blockSpec(Math.max(1, k));
  if(Number.isInteger(v)) return { cols: s.cols, rows: s.rows };
  if(k === 0) return { cols: 1, rows: 1 };
  const g = glassPlace(k); return g.side ? { cols: s.cols + 1, rows: s.rows } : { cols: s.cols, rows: s.rows + 1 }; }
function drawChar(v, cx, foot, bs, t){
  const d = charDims(v), x = cx - d.cols*bs/2, y = foot - d.rows*bs, k = Math.floor(v), f = v - k;
  if(Number.isInteger(v)) drawNumberblock(ctx, v, x, y, bs, { t, animate: true, numberling: false });
  else if(k === 0) drawGlassFigure(ctx, glassDigit(f), cx, foot, bs, null, f);
  else { const g = glassPlace(k), oy = g.side ? 0 : bs;
    drawNumberblock(ctx, k, x, y + oy, bs, { t, animate: true, numberling: false });
    drawGlassCube(ctx, x + g.gx*bs, y + oy + g.gy*bs, bs, f, glassLiqColor(glassDigit(f))); }
  ctx.save(); ctx.font = '900 ' + Math.max(11, Math.round(bs*0.7)) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(fmt(v), cx, y - 2); ctx.fillStyle = '#16233a'; ctx.fillText(fmt(v), cx, y - 2); ctx.restore();
}
// へん の キューブ（その かず の キャラ の いろ）と ながさ の かず
function cellColors(n){ const s = blockSpec(n); return s.cells.slice().sort((a, b) => b.gy - a.gy || a.gx - b.gx).map(c => c.colorRGB || mainColorOf(n)); }
function ruler(r){
  const cols = cellColors(r.n), col0 = mainColorOf(r.n);
  for(let i = 0; i < r.n; i++){
    const x = r.dir === 'h' ? sx(r.x + i) : sx(r.x), y = r.dir === 'h' ? (r.up ? sy(r.y) - C - 2 : sy(r.y) + 2) : sy(i + 1), col = cols[i % cols.length];
    ctx.fillStyle = rgb(col); ctx.strokeStyle = rgb(darken(col, 0.3)); ctx.lineWidth = Math.max(1, C*0.06);
    ctx.beginPath(); ctx.roundRect(x + 1, y + 1, C - 2, C - 2, C*0.12); ctx.fill(); ctx.stroke();
  }
  const lx = r.dir === 'h' ? sx(r.x + r.n/2) : r.left ? sx(r.x) - C*0.55 : sx(r.x) + C*1.55, ly = r.dir === 'h' ? (r.up ? sy(r.y) - C*1.6 : sy(r.y) + C*1.75) : sy(r.n/2) + C*0.1;
  ctx.save(); ctx.font = '900 ' + Math.round(clamp(C*0.9, 16, 30)) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(r.n, lx, ly); ctx.fillStyle = rgb(darken(col0, 0.35)); ctx.fillText(r.n, lx, ly); ctx.restore();
}
const handleR = () => { const s = st(), m = Math.min(...S().p.map(([k]) => s[k])); return Math.max(5, Math.min(8, m*C*0.12)); };
const poly = (P, close = true) => { ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(sx(p[0]), sy(p[1])) : ctx.moveTo(sx(p[0]), sy(p[1]))); if(close) ctx.closePath(); };

// ── タップ の アニメ ──
// まわり の 長方形 → その はんぶん（三角形・ひし形）
function halfRect(ph, x0, x1, h, label){
  const rk = ease(ph/0.35), hk = ease((ph - 0.35)/0.3);
  if(rk <= 0) return;
  ctx.save(); ctx.globalAlpha = rk;

// ── えがく ──
function draw(now){
  if(view && !drag){ const k = 0.15; C += (view.C - C)*k; OX += (view.OX - OX)*k; OY += (view.OY - OY)*k; }
  VL = (0 - OX)/C; VR = (W - OX)/C;
  const gx0 = Math.floor(VL), gx1 = Math.ceil(VR), gyT = Math.ceil(OY/C), s = st(), sh = S();
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(80,110,140,0.13)'; ctx.lineWidth = 1; ctx.beginPath();
  for(let x = gx0; x <= gx1; x++){ ctx.moveTo(sx(x), sy(gyT)); ctx.lineTo(sx(x), sy(-0.6)); }

  if(sh.hline){ const hl = sh.hline(s); ctx.moveTo(sx(hl.x), sy(hl.y)); ctx.lineTo(sx(hl.x), sy(0));
    if(hl.x < hl.l || hl.x > hl.r){ ctx.moveTo(sx(hl.x), sy(0)); ctx.lineTo(sx(hl.x < hl.l ? hl.l : hl.r), sy(0)); } }

      ctx.save(); ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(200,60,60,0.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx(top[0]), sy(r.n)); ctx.lineTo(sx(r.x), sy(r.n)); ctx.stroke(); ctx.restore(); }

  sh.handles(s).forEach((hd, i) => {

// ルビ つき の 1ぎょう（x：align が left なら ひだりはし、center なら まんなか。y：もじ の したの せん）

// しき：〇〇の面積 ／ ＝こうしき ／ ＝かず を いれた しき（ここ まで いつも）／ そのあと は タップ の アニメ に あわせて じゅんに
function drawFormula(ph){

// ── さわる ──
function inPoly(x, y, P){ let c = false; for(let i = 0, j = P.length - 1; i < P.length; j = i++){ const [xi, yi] = P[i], [xj, yj] = P[j];

let down = null;
cv.addEventListener('pointerdown', e => {

const CEL_MS = 2000;

// ── おだい ──
let goal = null, cleared = false;
// せいかい の あと「つぎ ▶」まで は 等積変形 だけ（パパ）：面積 が かわらない ●（三角形・平行四辺形・台形 の うえ の かど）を よこ に だけ。

function goalText(g){

const matches = () => S().p.every(([k]) => st()[k] === goal[k]);

}

}
function updLock(){ document.getElementById('nums').classList.toggle('lock', locked()); }

// ── ボタン ──
const shapesEl = document.getElementById('shapes'), slotsEl = document.getElementById('slots');
for(const k of ORDER){

  b.style.setProperty('--f', v === 7 ? 'linear-gradient(90deg,#fbb,#fdc,#ffe9a8,#c8efc0,#bdeefa,#c7c4f0,#e3c6f2)' : rgb(mixWhite(col, 0.6)));

}

resize(); setShape(cur); newGoal();          // いつも おだい
(function loop(now){ draw(now); requestAnimationFrame(loop); })(performance.now());
// テスト・しらべ よう
window.zukei = { shape: () => cur, setShape, st, area, mode: () => mode, toggle, tapShape, pressDone, goal: () => goal, locked,
  set: o => { Object.assign(st(), o); changed(); fitView(true); }, setGoal: g => { goal = g; cleared = false; changed(); },
  handles: () => S().handles(st()).map(h => [sx(h.x), sy(h.y)]), C: () => C };
</script>
