    ctx.restore();
    sizeBtns.push({x:bx,y:by,w:szW,h:szH,val:k});
  });
}

// ─── マジックミラー ───────────────────────────────────────────────────────────
// 上段の中央に置く。ここへキャラをドラッグして離すと、そのキャラが複製される。
// 因数モード・ドリルモードではキャラを自由に動かさないので出さない。
let mirrorFlash = 0;      // 複製した瞬間の光り（1→0へ減衰）
let fxParticles = [];     // 複製したときの紙吹雪
let mirrorRing  = 0;      // 複製した瞬間に広がる光の輪（0→1）
let mirrorAfter = 0;      // 指を離したあとの見せ場。指が無いのでよく見える
let mirrorHandoff = 0;    // 鏡の中の像 → 実体へのバトンタッチ（すぐ消える）
let homeAfter   = 0;      // おうちも同じ
let mirrorReflect = 0;    // 鏡に映るキャラの出かた（0→1）
let mirrorReflectNum = 0; // 今どのキャラが映っているか

// ドロップ先は上部バーのすぐ下に4つ並べる。
// 左から「おうち（帰る）」「÷2」「×2」「ミラー（ふえる）」。
// 減る側を左、増える側を右にまとめてあるので、押し間違えても大事にならない。
const DROP_TARGETS = ['home','half','double','mirror'];
// おだい中は、おだいカードを上部バーのすぐ下に置き、アイコン列はその下へ下げる。
// 「何をつくるか」を先に読ませて、道具はそのあとに見せる並びにしてある。
function targetRowY(){
  const r = getTaskCardRect();
  return r ? Math.round(r.y + r.h + 8) : TAB_H + 6;
}
function getTargetRect(id){
  if(mode==='factor'||mode==='quiz'||mode==='clock') return null;
  const w=51, h=60, n=DROP_TARGETS.length;
  const gap = Math.min(40, Math.max(8, (sw - EDGE_MARGIN*2 - n*w)/(n-1)));
  const total = n*w + (n-1)*gap;
  const x0 = (sw - total)/2;
  const i = DROP_TARGETS.indexOf(id);
  return { id:id, i:i, gap:gap, w:w, h:h, x:Math.round(x0 + i*(w+gap)), y:targetRowY() };
}
function getMirrorRect(){ return getTargetRect('mirror'); }
function getHomeRect(){   return getTargetRect('home'); }

// 指と手のひらは「触れた点より下」を覆う。判定を下へ大きく伸ばしておくと、
// 本体を直接押さえなくても手前で反応するので、演出が手に隠れない。
// 4つぶんの縦長の帯が隙間なく並ぶので、必ずどれか1つだけが反応する。
// アイコンの下へどれだけ伸ばすか。指と手のひらはタップした点より下を覆うので、
// 少し下でも反応するようにしてアイコンが隠れないようにする。ただし伸ばしすぎると
// 関係ない場所で離したのに反応してしまうので、アイコンのすぐ下までに留める。
const ZONE_BELOW = 72;
function targetZone(id){
  const m=getTargetRect(id); if(!m) return null;
  const half=(m.w+m.gap)/2, cx=m.x+m.w/2;
  return { x:cx-half, y:m.y-12, w:half*2, h:m.h+ZONE_BELOW };
}
function isOverTarget(id,x,y){
  const z=targetZone(id);
  return !!z && ptInRect(x,y,z.x,z.y,z.w,z.h);
}
function isOverMirror(x,y){ return isOverTarget('mirror',x,y); }
function isOverHome(x,y){   return isOverTarget('home',x,y); }

// ×2 と ÷2 が使えるか（100を超える／割り切れないときは受け付けない）
function canScale(id,n){
  return id==='double' ? (n*2<=MAX_NUM) : (n%2===0 && n/2>=1);
}
function scaledNum(id,n){ return id==='double' ? n*2 : n/2; }

// 上がアーチ型の鏡のかたち
function mirrorPath(ctx,x,y,w,h){
  const rad=w/2, r=5;
  ctx.beginPath();
  ctx.moveTo(x, y+h-r);
  ctx.lineTo(x, y+rad);
  ctx.arc(x+rad, y+rad, rad, Math.PI, 0);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.closePath();
}

// ─── おうち ───────────────────────────────────────────────────────────────
// ミラーと対になる場所。ここへキャラをドラッグすると、手を振って帰っていく。
// 「消す」ではなく「おうちに帰る」なので、子どもにとって嫌な操作にならない。
let homeFlash = 0;     // 帰った瞬間の光り
let homeOpen  = 0;     // 扉の開きぐあい（0→1）
let homeNum   = 0;     // 今どのキャラが入ろうとしているか
// キャラをおうちへ帰す（＝画面から消す）
function sendHome(b){
  const m=getHomeRect(); if(!m) return;
  pushUndo();
  blocks = blocks.filter(x=>x!==b);
  logStep('home', b.num);
  homeNum = b.num; homeFlash = 1; homeAfter = 1;   // 離したあとに扉が閉じるまでを見せる
  const px=m.x+m.w/2, py=m.y+m.h*0.7;
  for(let i=0;i<16;i++) fxParticles.push(new Particle(px,py));
  updateTargets();
}

function drawHome(ctx, t){
  const m=getHomeRect(); if(!m) return;
  if(homeFlash>0) homeFlash=Math.max(0, homeFlash-0.04);
  const hover = !!(dragBlock && dragPtr && isOverHome(dragPtr.x, dragPtr.y));
  if(hover) homeNum = dragBlock.num;
  homeOpen += ((hover?1:0) - homeOpen) * 0.25;
  if(homeOpen < 0.02) homeOpen = 0;
  if(homeAfter>0) homeAfter = Math.max(0, homeAfter-0.018);
  const show  = Math.max(homeOpen, homeAfter);

  const beat  = 0.5+0.5*Math.sin(t*0.013);
  const swell = 1 + show*(0.92 + 0.10*beat) + 0.13*homeFlash;
  const ease  = show*show*(3-2*show);

  ctx.save();
  if(swell !== 1){
    const cx0=m.x+m.w/2, cy0=m.y+m.h/2;
    const hw=m.w*swell/2, hh=m.h*swell/2;
    const cx=Math.min(Math.max(cx0, EDGE_MARGIN+hw), sw-EDGE_MARGIN-hw);
    const cy=Math.max(cy0, targetRowY()+hh);
    ctx.translate(cx, cy); ctx.scale(swell, swell); ctx.translate(-cx0, -cy0);
  }
  const glow = Math.max(homeFlash, show);
  if(glow>0){
    ctx.shadowColor='rgba(255,215,140,'+(0.55+glow*0.45)+')';
    ctx.shadowBlur=14+glow*(16+14*beat);
  }

  const wallY = m.y + m.h*0.38, wallH = m.h - (wallY-m.y);
  // 屋根
  ctx.fillStyle='#e0685f';
  ctx.beginPath();
  ctx.moveTo(m.x+m.w/2, m.y+2);
  ctx.lineTo(m.x+m.w-1, wallY+3);
  ctx.lineTo(m.x+1,     wallY+3);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  // 壁
  ctx.fillStyle='#f6ead6';
  ctx.beginPath(); ctx.roundRect(m.x+m.w*0.10, wallY, m.w*0.80, wallH-2, 4); ctx.fill();
  ctx.strokeStyle='#c9ab85'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(m.x+m.w*0.10, wallY, m.w*0.80, wallH-2, 4); ctx.stroke();

  // 扉。近づけると開いて、中のあかりが見える
  const dW=m.w*0.42, dH=wallH*0.72;
  const dX=m.x+m.w/2-dW/2, dY=m.y+m.h-2-dH;
  ctx.fillStyle='#4a3b2c';
  ctx.beginPath(); ctx.roundRect(dX,dY,dW,dH,3); ctx.fill();
  if(ease>0.02){
    const gl=ctx.createLinearGradient(dX,dY+dH,dX,dY);
    gl.addColorStop(0,'rgba(255,214,120,'+(0.95*ease)+')');
    gl.addColorStop(1,'rgba(255,240,200,'+(0.55*ease)+')');
    ctx.fillStyle=gl;
    ctx.beginPath(); ctx.roundRect(dX+1.5,dY+1.5,dW-3,dH-1.5,2); ctx.fill();
    // 中へ入っていくキャラの影
    if(homeNum>0) drawHomeSilhouette(ctx, dX, dY, dW, dH, homeNum, ease, t);
  } else {
    ctx.fillStyle='#e8c76a';   // ドアノブ
    ctx.beginPath(); ctx.arc(dX+dW*0.78, dY+dH*0.55, 1.8, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// 扉の中に見える、帰っていくキャラの影
function drawHomeSilhouette(ctx, dX, dY, dW, dH, num, ease, t){
  const spec = blockSpec(num);
  const cell = Math.max(1.2, Math.min((dW-6)/spec.cols, (dH-6)/spec.rows));
  const w=spec.cols*cell, h=spec.rows*cell;
  const bx=dX+dW/2-w/2, by=dY+dH-3-h;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(dX+1.5,dY+1.5,dW-3,dH-1.5,2); ctx.clip();
  ctx.globalAlpha=0.55*ease;
  ctx.fillStyle='#4a3b2c';
  ctx.fillRect(bx, by + Math.sin(t*0.006)*0.8, w, h);
  ctx.restore();
}

// ─── ×2 と ÷2 ─────────────────────────────────────────────────────────────
// キャラをドロップすると、そのまま2倍／半分のキャラに変わる。
// ミラー・おうちと同じ操作（近づけて離す）なので、覚え直すことがない。
let tgtFx = {
  double:{ open:0, after:0, flash:0, num:0 },
  half:  { open:0, after:0, flash:0, num:0 }
};
const SCALE_STYLE = {
  double:{ label:'×2', top:'#ffcf6b', bottom:'#f59331', edge:'#d9782a', glow:'255,200,120' },
  half:  { label:'÷2', top:'#a8e6ff', bottom:'#4aa8dd', edge:'#2f86ba', glow:'150,220,255' }
};

// 近づけているキャラを変えたらいくつになるか。NaN は「できない」。
function scalePreview(id){
  if(!(dragBlock && dragPtr && isOverTarget(id, dragPtr.x, dragPtr.y))) return null;
  return canScale(id, dragBlock.num) ? scaledNum(id, dragBlock.num) : NaN;
}

function drawScaleTarget(ctx, t, id){
  const m=getTargetRect(id); if(!m) return;
  const st=tgtFx[id], sty=SCALE_STYLE[id];
  const prev = scalePreview(id);
  const hover = prev!==null;
  const ok = hover && !Number.isNaN(prev);
  if(ok) st.num = prev;
  st.open += ((hover?1:0) - st.open) * 0.25;
  if(st.open < 0.02) st.open = 0;
  if(st.after>0) st.after = Math.max(0, st.after-0.018);
  if(st.flash>0) st.flash = Math.max(0, st.flash-0.04);
  const show = Math.max(st.open, st.after);
  const beat  = 0.5+0.5*Math.sin(t*0.013);
  const swell = 1 + show*(0.92 + 0.10*beat) + 0.13*st.flash;
  const ease  = show*show*(3-2*show);

  ctx.save();
  if(swell !== 1){
    const cx0=m.x+m.w/2, cy0=m.y+m.h/2;
    const hw=m.w*swell/2, hh=m.h*swell/2;
    const cx=Math.min(Math.max(cx0, EDGE_MARGIN+hw), sw-EDGE_MARGIN-hw);
    const cy=Math.max(cy0, targetRowY()+hh);
    ctx.translate(cx, cy); ctx.scale(swell, swell); ctx.translate(-cx0, -cy0);
  }
  if(show>0){
    ctx.shadowColor='rgba('+sty.glow+','+(0.55+show*0.45)+')';
    ctx.shadowBlur=14+show*(16+14*beat);
  }
  const g=ctx.createLinearGradient(m.x, m.y, m.x, m.y+m.h);
  g.addColorStop(0, sty.top); g.addColorStop(1, sty.bottom);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.roundRect(m.x, m.y, m.w, m.h, 12); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=sty.edge; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.roundRect(m.x, m.y, m.w, m.h, 12); ctx.stroke();

  // 近づけているあいだは「いくつになるか」を大きく出す
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(ease>0.05 && ok){
    ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.font='bold 13px sans-serif';
    ctx.fillText(sty.label, m.x+m.w/2, m.y+m.h*0.24);
    ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(m.h*0.40)+'px sans-serif';
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=3;
    ctx.strokeText(String(st.num), m.x+m.w/2, m.y+m.h*0.63);
    ctx.fillText(String(st.num),  m.x+m.w/2, m.y+m.h*0.63);
  } else {
    ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(m.h*0.42)+'px sans-serif';
    ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=3;
    ctx.strokeText(sty.label, m.x+m.w/2, m.y+m.h/2);
    ctx.fillText(sty.label,  m.x+m.w/2, m.y+m.h/2);
  }
  // できないとき（奇数の÷2、100を超える×2）は斜線で知らせる
  if(hover && !ok){
    ctx.strokeStyle='rgba(210,30,30,0.9)'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(m.x+m.w*0.18, m.y+m.h*0.80);
    ctx.lineTo(m.x+m.w*0.82, m.y+m.h*0.20);
    ctx.stroke();
  }
  ctx.restore();
}

// ドロップされたキャラを2倍／半分に置き換える
function scaleBlock(b, id){
  const m=getTargetRect(id); if(!m) return;
  pushUndo();
  const n = scaledNum(id, b.num);
  logStep(id, b.num, null, n);
  blocks = blocks.filter(x=>x!==b);
  const res = new NumberBlock(n, 0, 0);
  res.x = Math.min(Math.max(playLeft(), m.x+m.w/2-res.width/2), sw-EDGE_MARGIN-res.width);
  res.y = m.y + m.h + 4;
  res.targetX = res.x; res.birth = 0; res.vx = 0; res.vy = 1;
  blocks.push(res);
  const st=tgtFx[id];
  st.flash=1; st.after=1; st.num=n;
  for(let i=0;i<18;i++) fxParticles.push(new Particle(m.x+m.w/2, m.y+m.h));
  updateTargets();
}

// 4つのドロップ先をまとめて描く。反応しているものは大きくなるので最後に描く。
function drawDropTargets(ctx, t){
  const active = DROP_TARGETS.find(id =>
    dragBlock && dragPtr && isOverTarget(id, dragPtr.x, dragPtr.y));
  const draw = id => {
    if(id==='mirror') drawMirror(ctx,t);
    else if(id==='home') drawHome(ctx,t);
    else drawScaleTarget(ctx,t,id);
  };
  for(const id of DROP_TARGETS) if(id!==active) draw(id);
  if(active) draw(active);
}

// 鏡の中に映るキャラ。実物と同じ描画エンジンを縮めて使い、左右を反転させる。
// prog は 0→1 で、小さく暗いところから、すっと浮かび上がってくる。
function drawMirrorReflection(ctx, m, num, prog, t){
  const spec = blockSpec(num);
  // アーチの内側に収まるように描く箱。上はアーチで狭いので少し下げる。
  const boxY = m.y + Math.round(m.w*0.40);      // 上のバッジを避けて下寄りに
  const boxW = m.w - 12, boxH = m.h - (boxY - m.y) - 6;
  const cell = Math.max(1.5, Math.min(boxW/spec.cols, boxH/spec.rows));
  const w = spec.cols*cell, h = spec.rows*cell;
  const cx = m.x + m.w/2;
  const bx = cx - w/2;
  const by = boxY + (boxH - h)/2;

  const ease = prog*prog*(3-2*prog);          // ゆるやかに出入りさせる
  const scale = 0.72 + 0.28*ease;
  const bob = Math.sin(t*0.006)*1.2*ease;     // 鏡の中でゆらゆらさせる

  ctx.save();
  mirrorPath(ctx, m.x+4, m.y+4, m.w-8, m.h-7); ctx.clip();

  // 鏡像なので左右反転。拡大縮小は鏡の中心を軸にする。
  ctx.translate(cx, by + h/2 + bob);
  ctx.scale(-scale, scale);
  ctx.translate(-cx, -(by + h/2));

  ctx.globalAlpha = 0.30 + 0.62*ease;
  // 小さいマス目をそのまま指定すると、エンジンの線幅が最低1pxで止まってしまい、
  // 10のまとまりのフチだけが不釣り合いに太く見える。いったん普通の大きさで
  // 描いてから全体を縮めることで、本物をそのまま小さくした見た目になる。
  const RB = 24, k = cell/RB;
  ctx.translate(bx, by); ctx.scale(k, k);
  drawNumberblock(ctx, num, 0, 0, RB, { t:t, animate:true, numberling:false });
  ctx.restore();

  // 鏡らしく、上から薄い光の膜をかける
  ctx.save();
  mirrorPath(ctx, m.x+4, m.y+4, m.w-8, m.h-7); ctx.clip();
  const gl=ctx.createLinearGradient(m.x, m.y, m.x+m.w, m.y+m.h);
  gl.addColorStop(0,'rgba(255,255,255,'+(0.22*ease)+')');
  gl.addColorStop(0.5,'rgba(220,240,255,'+(0.05*ease)+')');
  gl.addColorStop(1,'rgba(255,255,255,'+(0.18*ease)+')');
  ctx.fillStyle=gl; ctx.fillRect(m.x, m.y, m.w, m.h);
  ctx.restore();
}

function drawMirror(ctx, t){
  const m=getMirrorRect(); if(!m) return;
  if(mirrorFlash>0) mirrorFlash=Math.max(0, mirrorFlash-0.035);
  // 複製できた合図の光の輪。鏡から外へ広がって消える。
  if(mirrorRing>0){
    mirrorRing=Math.max(0, mirrorRing-0.045);
    const e=1-mirrorRing;
    ctx.save();
    ctx.globalAlpha=mirrorRing*0.85;
    ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=3*mirrorRing+1;
    ctx.beginPath();
    ctx.ellipse(m.x+m.w/2, m.y+m.h/2, m.w*(0.5+e*1.1), m.h*(0.5+e*1.0), 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  const hover = !!(dragBlock && dragPtr && isOverMirror(dragPtr.x, dragPtr.y));
  if(hover) mirrorReflectNum = dragBlock.num;
  mirrorReflect += ((hover?1:0) - mirrorReflect) * 0.25;   // すっと現れて、すっと消える
  if(mirrorReflect < 0.02) mirrorReflect = 0;
  // 離したあとは指が画面から離れている。ここが一番よく見えるので、
  // すぐ縮めずにしばらく大きいまま見せる。
  if(mirrorAfter>0) mirrorAfter = Math.max(0, mirrorAfter-0.018);
  const show = Math.max(mirrorReflect, mirrorAfter);
  // 鏡の中の像は、複製が飛び出したらすぐ消す。残したままだと
  // 「実体2体＋鏡の中の1体」で3体いるように見えてしまう。
  if(mirrorHandoff>0) mirrorHandoff = Math.max(0, mirrorHandoff-0.16);
  const refl = Math.max(mirrorReflect, mirrorHandoff);
  const pulse = Math.sin(t*0.004)*0.5+0.5;
  const glow  = Math.max(mirrorFlash, show);

  ctx.save();
  // ドロップできる状態のときは、鏡がふくらんで脈打つ。
  // 「何が起きるか」は鏡の中の映り込みが伝えるので、こちらは
  // 「今が離すタイミング」だけを伝える役に徹する。
  const beat  = 0.5+0.5*Math.sin(t*0.013);
  const swell = 1 + show*(0.92 + 0.10*beat) + 0.13*mirrorFlash;
  if(swell !== 1){
    // 大きくすると画面からはみ出すので、中心を内側へずらしながら広げる
    const cx0=m.x+m.w/2, cy0=m.y+m.h/2;
    const hw=m.w*swell/2, hh=m.h*swell/2;
    const cx=Math.min(Math.max(cx0, EDGE_MARGIN+hw), sw-EDGE_MARGIN-hw);
    const cy=Math.max(cy0, targetRowY()+hh);
    ctx.translate(cx, cy);
    ctx.scale(swell, swell);
    ctx.translate(-cx0, -cy0);
  }
  if(glow>0){
    ctx.shadowColor='rgba(150,220,255,'+(0.55+glow*0.45)+')';
    ctx.shadowBlur=14+glow*(16+14*beat);
  }
  // 鏡面（虹色のグラデーション）
  const g=ctx.createLinearGradient(m.x, m.y, m.x+m.w, m.y+m.h);
  g.addColorStop(0.00,'#bcd8ff');
  g.addColorStop(0.35,'#c3b2f2');
  g.addColorStop(0.62,'#a9ead9');
  g.addColorStop(1.00,'#f7c9e9');
  ctx.fillStyle=g;
  mirrorPath(ctx,m.x,m.y,m.w,m.h); ctx.fill();
  ctx.shadowBlur=0;

  // 内側の明るい面
  const gi=ctx.createLinearGradient(m.x, m.y+m.h, m.x+m.w, m.y);
  gi.addColorStop(0,'rgba(255,255,255,0.75)');
  gi.addColorStop(0.5,'rgba(255,255,255,0.25)');
  gi.addColorStop(1,'rgba(255,255,255,0.70)');
  ctx.fillStyle=gi;
  mirrorPath(ctx,m.x+4,m.y+4,m.w-8,m.h-7); ctx.fill();

  // 斜めのハイライト（鏡らしさ）
  ctx.save();
  mirrorPath(ctx,m.x+4,m.y+4,m.w-8,m.h-7); ctx.clip();
  ctx.fillStyle='rgba(255,255,255,'+(0.35+pulse*0.3)+')';
  ctx.beginPath();
  ctx.moveTo(m.x-4, m.y+m.h*0.72); ctx.lineTo(m.x+m.w*0.55, m.y-6);
  ctx.lineTo(m.x+m.w*0.80, m.y-6); ctx.lineTo(m.x+m.w*0.20, m.y+m.h+6);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // ここで離せばコピーされる、というときは鏡にそのキャラを映す。
  // 「鏡の中にもう一人いる」が見えるので、何が起きるか説明なしで伝わる。
  if(refl > 0.02 && mirrorReflectNum > 0){
    drawMirrorReflection(ctx, m, mirrorReflectNum, refl, t);
  }

  // 虹色のふち
  const gb=ctx.createLinearGradient(m.x, m.y+m.h, m.x+m.w, m.y);
  gb.addColorStop(0,'#7fd8f0'); gb.addColorStop(0.5,'#b39ef0'); gb.addColorStop(1,'#7ff0c8');
  ctx.strokeStyle=gb; ctx.lineWidth=2.5 + 1.8*show*beat;
  if(show>0){
    ctx.shadowColor='rgba(255,255,255,'+(0.5*show)+')';
    ctx.shadowBlur=8*show;
  }
  mirrorPath(ctx,m.x,m.y,m.w,m.h); ctx.stroke();
  ctx.shadowBlur=0;

  // 上のバッジ（おうちマーク）
  const bx=m.x+m.w/2, by=m.y+m.w*0.21, br=m.w*0.16;
  ctx.fillStyle='#e9f3ff'; ctx.strokeStyle='#8fb8e8'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill(); ctx.stroke();
  const hw=br*0.95, hh=br*0.80;
  ctx.fillStyle='#5ec8b8';
  ctx.beginPath();                                   // 屋根
  ctx.moveTo(bx, by-hh*0.72);
  ctx.lineTo(bx+hw*0.72, by-hh*0.06);
  ctx.lineTo(bx-hw*0.72, by-hh*0.06);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(bx-hw*0.42, by-hh*0.06, hw*0.84, hh*0.66);   // 壁

  ctx.restore();
}

// 上段中央：合体したときにクイズを出すかどうかの切り替え。
// ドリルモードはクイズそのものなので、そこでは出さない。
function drawQuizToggle(ctx){
  toggleBtns = [];
  if(mode==='factor'||mode==='quiz'||mode==='clock') return;
  const h=30, gap=6, y=Math.round((TOP_ROW_H-h)/2);
  const left = BAR_LEFT_RESERVE, right = sw - BAR_RIGHT_RESERVE;
  const w = Math.min(76, Math.floor((right-left-gap)/2));
  const x0 = Math.round((left+right)/2 - w - gap/2);
  const defs = [
    { val:'quiz', on:quizOn, label:'クイズ '+(quizOn?'ON':'OFF') },
    { val:'task', on:taskOn, label:'おだい '+(taskOn?'ON':'OFF') }
  ];
  defs.forEach((d,i)=>{
    const x = x0 + i*(w+gap);
    ctx.save();
    ctx.fillStyle = d.on ? 'rgba(100,160,255,0.95)' : 'rgba(82,92,110,0.95)';
    ctx.beginPath(); ctx.roundRect(x,y,w,h,8); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,'+(d.on?0.75:0.35)+')'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(x,y,w,h,8); ctx.stroke();
    ctx.fillStyle='white'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 11px sans-serif';
    ctx.fillText(d.label, x+w/2, y+h/2);
    ctx.restore();
    toggleBtns.push({x:x,y:y,w:w,h:h,val:d.val});
  });
}

// 下段：モードタブ（＋ − × ÷ 因数 ドリル）。画面幅いっぱいに等分する
function drawModeTabs(ctx){
  const pad = 3;
  const tabW = (sw - pad*2) / TAB_DEFS.length;
  tabBtns = [];
  let tx = pad;
  for(let i=0;i<TAB_DEFS.length;i++){
    const td=TAB_DEFS[i];
    const ty=TOP_ROW_H;
    const active = (td.val==='calc') ? isCalcMode() : (td.val===mode);
    ctx.save();
    // 選んでいないタブが「押せない」ように見えないよう、はっきり明るくする
    ctx.fillStyle = active?'rgba(100,160,255,0.95)':'rgba(82,92,110,0.95)';
    ctx.beginPath(); ctx.roundRect(tx+2,ty+2,tabW-4,TAB_ROW_H-4,8); ctx.fill();
    ctx.strokeStyle = active?'rgba(255,255,255,0.75)':'rgba(255,255,255,0.35)';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(tx+2,ty+2,tabW-4,TAB_ROW_H-4,8); ctx.stroke();
    ctx.fillStyle=active?'white':'#eef2f8';
    ctx.font='bold 13px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(td.label,tx+tabW/2,ty+TAB_ROW_H/2);
    ctx.restore();
    tabBtns.push({x:tx+2,y:ty+2,w:tabW-4,h:TAB_ROW_H-4,val:td.val});
    tx += tabW;
  }
}

// ─── NumberBlock ──────────────────────────────────────────────────────────────
// 見た目（かたち・色・顔・手足）は共通エンジン engine.js が担当する。
// このクラスは、ゲームの物理演算・ドラッグ・レイアウトに必要な当たり判定の
// 箱（x/y/width/height）と速度だけを持ち、描画はエンジンへ丸投げする。
let blockIdCounter = 0;
class NumberBlock {
  constructor(num,x,y){
    this.id=blockIdCounter++; this.num=Math.max(1,Math.min(MAX_NUM,num));
    this.x=x; this.y=y; this.vx=0; this.vy=0; this.onGround=false; this.targetX=x;
    this.birth=1;   // 1 なら通常。0 から始めるとミラーから生まれる演出が付く
    this.launch=0;  // >0 のあいだは整列を無視して飛ぶ（ミラーからの射出）
    this._computeShape();
  }
  _computeShape(){
    // かたちはエンジンの blockSpec が正。ここはその外形サイズを写すだけ
    const spec = blockSpec(this.num);
    this.cols = spec.cols; this.rows = spec.rows;
    // 1〜100は全員同じマスの大きさ（100の面積は1の100倍、という原則）。
    // ただし101以上を同じマスで描くと画面から完全にはみ出すので、
    // 大きい数のときだけ、そのキャラが収まるところまでマスを小さくする。
    this.bs = BS;
    if(this.num > 100 && bsKey !== 'A'){
      const maxW = sw - EDGE_MARGIN*2;
      // 上は「おうち・÷2・×2・ミラー」のアイコン列より下から。重ならないように。
      // さらに 400px で頭打ちにする。遊び場いっぱいに伸びると圧迫感があるため。
      const maxH = Math.min(BIG_MAX_H, Math.max(60, calcFloor() - (targetRowY() + 68)));
      this.bs = Math.max(1.2, Math.min(BS, maxW/this.cols, maxH/this.rows));
    }
    this.width=this.cols*this.bs; this.height=this.rows*this.bs;
  }
  get cx(){ return this.x+this.width/2; }
  get cy(){ return this.y+this.height/2; }
  draw(ctx,t=0,bounceY=0){
    // ミラーから出てきた直後は、小さく現れて「ぽんっ」と実物大になる
    if(this.birth < 1){
      this.birth = Math.min(1, this.birth + 0.055);
      const p=this.birth, c1=1.70158, c3=c1+1;
      const back = 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2);   // 少し行き過ぎて戻る
      const sc = 0.30 + 0.70*back;
      const ax=this.x+this.width/2, ay=this.y+this.height;        // 足元を軸にする
      ctx.save();
      ctx.globalAlpha = Math.min(1, 0.35+0.75*p);
      ctx.translate(ax,ay); ctx.scale(sc,sc); ctx.translate(-ax,-ay);
      this._drawBody(ctx,t,bounceY);
      ctx.restore();
      return;
    }
    this._drawBody(ctx,t,bounceY);
  }
  _drawBody(ctx,t=0,bounceY=0){
    const n=this.num,x=this.x,y=this.y+bounceY;
    const isMoving=Math.abs(this.vx)>0.5||Math.abs(this.vy)>1.0;
    drawNumberblock(ctx, n, x, y, this.bs, { t:t, animate:isMoving, numberling:false });
    // 数字ラベルはゲーム側の見せ方（白フチ黒文字）を維持する
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.font='bold '+Math.max(9,Math.round(BS*0.6))+'px sans-serif';
    ctx.strokeStyle='white'; ctx.lineWidth=3; ctx.strokeText(String(n),x+this.width/2,y-3);
    ctx.fillStyle='#111'; ctx.fillText(String(n),x+this.width/2,y-3);
    ctx.restore();
  }
}

// ─── Particle ─────────────────────────────────────────────────────────────────
class Particle {
  constructor(x,y){
    this.x=x; this.y=y; this.vx=(Math.random()-0.5)*10; this.vy=-Math.random()*12-2;
    this.gravity=0.5; this.hue=Math.random()*360; this.life=1.0;
    this.rot=Math.random()*Math.PI*2; this.rotV=(Math.random()-0.5)*0.2;
    this.w=6+Math.random()*6; this.h=4+Math.random()*4;
  }
  update(){ this.vy+=this.gravity; this.x+=this.vx; this.y+=this.vy; this.rot+=this.rotV; this.life-=0.018; }
  draw(ctx){
    if(this.life<=0) return;
    ctx.save(); ctx.globalAlpha=Math.max(0,this.life); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    ctx.fillStyle=`hsl(${this.hue},90%,60%)`; ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);
    ctx.restore();
  }
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function drawNoEntry(ctx,x,y,r){
  ctx.save(); ctx.fillStyle='rgba(200,0,0,0.92)'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='white'; ctx.lineWidth=r*0.12; ctx.beginPath(); ctx.arc(x,y,r*0.88,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='white'; const bw=r*1.4,bh=r*0.45;
  ctx.beginPath(); ctx.roundRect(x-bw/2,y-bh/2,bw,bh,bh*0.3); ctx.fill(); ctx.restore();
}
function drawOKGlow(ctx,block,t){
  const pulse=Math.sin(t*0.015)*0.5+0.5; ctx.save();
  ctx.shadowColor=`rgba(0,220,60,${0.6+pulse*0.4})`; ctx.shadowBlur=18+pulse*10;
  ctx.strokeStyle=`rgba(0,200,50,${0.7+pulse*0.3})`; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect(block.x-3,block.y-3,block.width+6,block.height+6,6); ctx.stroke(); ctx.restore();
}
// 2つの数と演算子から、式と答えを出す。
function calcPair(a,b,op){
  if(op==='+')  return { n1:a, n2:b, ans:a+b };
  if(op==='x')  return { n1:a, n2:b, ans:a*b };
  const lg=Math.max(a,b), sm=Math.min(a,b);
  if(op==='-')  return { n1:lg, n2:sm, ans:lg-sm };
  return { n1:lg, n2:sm, ans:lg/sm };
}

// 2体がどれだけ近いか。中心どうしの距離だと、大きいキャラは体の上に置いても
// 中心が遠くて届かない。体（四角）どうしの隙間で測るので、重なっていれば0になる。
function blockGap(a,b){
  const dx = Math.max(b.x-(a.x+a.width),  a.x-(b.x+b.width),  0);
  const dy = Math.max(b.y-(a.y+a.height), a.y-(b.y+b.height), 0);
  return Math.hypot(dx,dy);
}
// 体どうしが触れるくらいまで近づけたときだけ合体させる。広くしすぎると
// 離れて立っているキャラに勝手に反応してしまう。
const MERGE_REACH = 28;   // ここまで近づけたら合体できる（体の隙間）
const NEAR_REACH  = 60;   // 通行止めの合図を出しはじめる距離

function canCalc(a,b,m){
  if(m==='+')   return a.num+b.num<=MAX_NUM;
  if(m==='-')   return Math.abs(a.num-b.num)>=1;
  if(m==='x')   return a.num*b.num<=MAX_NUM;
  if(m==='div'){ const lg=Math.max(a.num,b.num),sm=Math.min(a.num,b.num); return sm>=1&&lg%sm===0; }
  return false;
}

// ─── Puzzle class（4択クイズ）────────────────────────────────────────────────
class Puzzle {
  constructor(draggedBlock,targetBlock,calcMode){
    this.calcMode=calcMode;
    let n1,n2,ans;
    if(calcMode==='+'){      n1=draggedBlock.num; n2=targetBlock.num; ans=n1+n2;
    } else if(calcMode==='-'){
      n1=Math.max(draggedBlock.num,targetBlock.num); n2=Math.min(draggedBlock.num,targetBlock.num); ans=n1-n2;
    } else if(calcMode==='x'){
      n1=draggedBlock.num; n2=targetBlock.num; ans=n1*n2;
    } else {
      n1=Math.max(draggedBlock.num,targetBlock.num); n2=Math.min(draggedBlock.num,targetBlock.num); ans=n1/n2;
    }
    this.n1=n1; this.n2=n2; this.ans=ans;
    this.a=draggedBlock.num; this.b=targetBlock.num;   // 演算子の切り替え用
    this.mergeX=(draggedBlock.x+targetBlock.x)/2;
    this.char1=new NumberBlock(n1,0,0); this.char2=new NumberBlock(n2,0,0);
    this.charRes=new NumberBlock(Math.max(1,Math.round(ans)),0,0);
    this.choices=this._genChoices(ans);
    this.eliminated=new Set();
    this.wrongFlash=0; this.wrongChoiceIdx=null; // 誤答演出
    this.phase='countdown'; // 'countdown'|'correct'|'timeout'|'done'
    // 正解演出は続けて何問も解くので、長いとテンポが悪くなる。
    // さらに、待たされないよう画面をタップすれば途中でも先へ進める。
    this.elapsed=0; this.COUNTDOWN=5000; this.CORRECT_ANIM=700;
    this.particles=[];
  }

  _genChoices(ans){
    const n1 = this.n1;
    const n2 = this.n2;

    const candidates = new Set();

    function addIfValid(v){
      if(v >= 1 && v <= MAX_NUM && v !== ans){
        candidates.add(v);
      }
    }

    // --- ① 操作ミス ---
    if(this.calcMode === '+'){
      addIfValid(n1 * n2);
      addIfValid(Math.abs(n1 - n2));
    } else if(this.calcMode === '-'){
      addIfValid(n1 + n2);
      addIfValid(n2 - n1);
    } else if(this.calcMode === 'x'){
      addIfValid(n1 + n2);
      addIfValid(Math.abs(n1 - n2));
    } else if(this.calcMode === 'div'){
      addIfValid(n1 * n2);
      addIfValid(n1 + n2);
    }

    // --- ② 計算ミス ---
    for(let i=0;i<10;i++){
      const diff = Math.floor(Math.random()*5)+1;
      addIfValid(ans + diff);
      addIfValid(ans - diff);
    }

    // --- ③ 近似 ---
    addIfValid(ans + 10);
    addIfValid(ans - 10);

    // --- 配列化してシャッフル ---
    let wrongs = [...candidates];

    // 不足分を補充
    while(wrongs.length < 3){
      const v = ans + (Math.random()<0.5?-1:1)*(Math.floor(Math.random()*20)+1);
      if(v >= 1 && v <= 100 && v !== ans && !wrongs.includes(v)){
        wrongs.push(v);
      }
    }

    // 3つに絞る
    wrongs = wrongs.slice(0,3);

    // ★ 最後に正解を必ず追加
    const choices = [ans, ...wrongs];

    // 昇順ソート
    return choices.sort((a,b)=>a-b);
  }


  tapChoice(idx){
    if(this.phase!=='countdown') return;
    if(this.eliminated.has(idx)) return;
    if(this.choices[idx]===this.ans){
      // ドリルでは「一発で当てたか」を成績にする（間違えた後に当てても連続は途切れる）
      if(mode==='quiz') quizScore(this.eliminated.size===0);
      this.phase='correct'; this.elapsed=0;
      for(let i=0;i<70;i++) this.particles.push(new Particle(sw/2,sh/2));
    } else {
      this.eliminated.add(idx); this.elapsed=0;
      this.wrongFlash=500; this.wrongChoiceIdx=idx; // 誤答フラッシュ
    }
  }

  update(dt){
    this.elapsed+=dt; this.wrongFlash=Math.max(0,this.wrongFlash-dt);
    if(this.phase==='countdown'&&this.elapsed>=this.COUNTDOWN) this.phase='timeout';
    else if(this.phase==='correct'&&this.elapsed>=this.CORRECT_ANIM) this.phase='done';
    for(const p of this.particles) p.update();
    this.particles=this.particles.filter(p=>p.life>0);
  }

  _panelRect(){
    const pw=Math.min(sw-24,520), ph=Math.min(sh-60,480);
    return {px:(sw-pw)/2,py:(sh-ph)/2,pw,ph};
  }

  // 表示中の選択肢の座標（昇順ソート済み）
  _getChoiceRects(){
    const {px,py,pw,ph}=this._panelRect();
    const visible=[0,1,2,3].filter(i=>!this.eliminated.has(i));
    if(!visible.length) return [];
    const btnH=48,gap=8,totalW=pw-40,btnW=(totalW-(visible.length-1)*gap)/visible.length;
    const choiceY=py+ph-btnH-14;
    return visible.map((idx,pos)=>({idx,x:px+20+pos*(btnW+gap),y:choiceY,w:btnW,h:btnH}));
  }

  _opStr(){ return {'+':'+','-':'−','x':'×','div':'÷'}[this.calcMode]||'?'; }

  draw(ctx,t){
    const {px,py,pw,ph}=this._panelRect();
    // 暗幕は上部バーより下だけに掛ける。画面全体に掛けるとモードタブまで
    // 暗くなり、他のモードに切り替えられないように見えてしまう。
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,TAB_H,sw,sh-TAB_H);
    const grad=ctx.createLinearGradient(px,py,px+pw,py+ph);
    grad.addColorStop(0,'#f80'); grad.addColorStop(0.5,'#e00'); grad.addColorStop(1,'#80f');
    ctx.save(); ctx.beginPath(); ctx.roundRect(px-3,py-3,pw+6,ph+6,20); ctx.fillStyle=grad; ctx.fill(); ctx.restore();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.roundRect(px,py,pw,ph,16); ctx.fill();

    if(this.phase==='correct'){
      this._drawCorrectAnim(ctx,t,px,py,pw,ph);
    } else {
      this._drawQuestion(ctx,t,px,py,pw,ph);
      this._drawCountdownBar(ctx,px,py,pw,ph);
      this._drawChoiceButtons(ctx);
    }
    for(const p of this.particles) p.draw(ctx);

    // 誤答演出：赤フラッシュ＋✗
    if(this.wrongFlash>0){
      const alpha=(this.wrongFlash/500)*0.42;
      ctx.save();
      ctx.fillStyle=`rgba(220,20,20,${alpha})`;
      ctx.beginPath(); ctx.roundRect(px,py,pw,ph,16); ctx.fill();
      ctx.font=`bold ${Math.round(ph*0.28)}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=`rgba(255,0,0,${Math.min(1,alpha*3)})`;
      ctx.fillText('✗',px+pw/2,py+ph*0.45);
      ctx.restore();
    }
  }

  _drawQuestion(ctx,t,px,py,pw,ph){
    ctx.save(); ctx.font='bold 22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#333';
    ctx.fillText(`${this.n1} ${this._opStr()} ${this.n2} = ?`,px+pw/2,py+12); ctx.restore();
    if(this.calcMode==='x') this._drawMultiplyGrid(ctx,t,px,py,pw,ph);
    else this._drawCharPair(ctx,t,px,py,pw,ph);
  }

  _drawCharPair(ctx,t,px,py,pw,ph){
    const c1=this.char1,c2=this.char2;
    // 下揃え：選択肢＋バー分（92px）を除いたエリアの底に合わせる
    const contentBottom=py+ph-92;
    const b1Y=Math.sin(this.elapsed*0.003)*5, b2Y=Math.sin(this.elapsed*0.003+Math.PI)*5;
    const opW=30,gap=14,totalW=c1.width+gap+opW+gap+c2.width;
    let cx=(sw-totalW)/2;
    c1.x=cx; c1.y=contentBottom-c1.height; c1.draw(ctx,t,b1Y); cx+=c1.width+gap;
    const maxH=Math.max(c1.height,c2.height);
    ctx.save(); ctx.font='bold 28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#444';
    ctx.fillText(this._opStr(),cx+opW/2,contentBottom-maxH/2); ctx.restore(); cx+=opW+gap;
    c2.x=cx; c2.y=contentBottom-c2.height; c2.draw(ctx,t,b2Y);
  }

  _drawMultiplyGrid(ctx,t,px,py,pw,ph){
    const n1=this.n1,n2=this.n2,blockW=this.char2.width,blockH=this.char2.height;
    const cols=Math.min(10,n1),rows=Math.ceil(n1/cols),gapX=6,gapY=10;
    const totalRowW=cols*(blockW+gapX)-gapX;
    // 下揃え
    const contentBottom=py+ph-92;
    const gridH=rows*(blockH+gapY)-gapY;
    const startX=px+(pw-totalRowW)/2, startY=contentBottom-gridH;
    const bounce=Math.sin(this.elapsed*0.003)*4;
    for(let i=0;i<n1;i++){
      const col=i%cols,row=Math.floor(i/cols);
      const nb=new NumberBlock(n2,startX+col*(blockW+gapX),startY+row*(blockH+gapY));
      nb.draw(ctx,t,bounce);
    }
  }

  _drawCountdownBar(ctx,px,py,pw,ph){
    if(this.noBar) return;            // 制限なしのときは残り時間バーを出さない
    const prog=Math.max(0,1-this.elapsed/this.COUNTDOWN);
    const bw=pw-40,bh=12,bx=px+20,by=py+ph-78;
    ctx.fillStyle='#ddd'; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,6); ctx.fill();
    ctx.fillStyle=`hsl(${prog*120},80%,45%)`; ctx.beginPath(); ctx.roundRect(bx,by,bw*prog,bh,6); ctx.fill();
  }

  _drawChoiceButtons(ctx){
    const rects=this._getChoiceRects();
    for(const r of rects){
      ctx.save(); ctx.fillStyle='rgba(50,100,240,0.9)';
      ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,10); ctx.fill();
      ctx.fillStyle='white'; ctx.font='bold 24px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(this.choices[r.idx]),r.x+r.w/2,r.y+r.h/2);
      ctx.restore();
    }
  }

  _drawCorrectAnim(ctx,t,px,py,pw,ph){
    ctx.save(); ctx.font='bold 40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#080';
    ctx.fillText('正解！',px+pw/2,py+12); ctx.restore();
    const cr=this.charRes, bounce=Math.sin(this.elapsed*0.01)*10;
    cr.x=px+(pw-cr.width)/2; cr.y=py+(ph-cr.height)/2-10; cr.draw(ctx,t,bounce);
    ctx.save(); ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#333';
    ctx.fillText(`${this.n1} ${this._opStr()} ${this.n2} = ${this.ans}`,px+pw/2,py+ph-12); ctx.restore();
  }
}

// ─── Game state ───────────────────────────────────────────────────────────────
let blocks=[], puzzle=null, dragBlock=null, dragPointers={};
let dragPtr=null;   // ドラッグ中の指／マウスの位置（マジックミラーの判定用）
let walkTime=0;
// CLR（ぜんぶ消す）は取り返しがつかないので、押し続けないと実行しない。
// 押しているあいだリングが溜まっていき、一周したら実行する。
const CLR_HOLD_MS = 650;
let clrHold = null;   // {pid, t0}

function applyPhysics(){
  for(const b of blocks){
    if(b===dragBlock) continue;
    if(b.launch>0){
      // ミラーから射出された直後。整列に引き戻さず、そのまま飛ばす
      b.launch--; b.vx*=0.97;
    } else {
      const dx=b.targetX-b.x;
      if(Math.abs(dx)>1){ b.vx=dx>0?2:-2; } else { b.vx=0; b.x=b.targetX; }
    }
    b.vy+=GRAVITY; b.x+=b.vx; b.y+=b.vy;
    const fl=calcFloor()-b.height;
    if(b.y>=fl){ b.y=fl; b.vy=0; b.onGround=true; } else b.onGround=false;
    // 画面の左右ギリギリに立たせると、つかもうとした指が
    // Safari の「端からスワイプで戻る」に取られてしまう。少し内側で止める。
    const lb=playLeft();
    if(b.x<lb){ b.x=lb; if(b.launch>0){ b.vx=0; b.launch=0; } }
    if(b.x+b.width>sw-EDGE_MARGIN){ b.x=sw-EDGE_MARGIN-b.width; if(b.launch>0){ b.vx=0; b.launch=0; } }
  }
}

// 全員を横に並べて画面に収まる「1マスの大きさ」を求める。
// 横は全員の幅の合計、縦はいちばん背の高いキャラで決まる。
function computeAutoBS(){
  if(!blocks.length) return BS_MAP.L;
  let totalCols = 0, maxRows = 1;
  for(const b of blocks){
    const spec = blockSpec(b.num);
    totalCols += spec.cols;
    if(spec.rows > maxRows) maxRows = spec.rows;
  }
  const mL = 14 + playLeft(), mR = 14 + EDGE_MARGIN; // updateTargets と同じ余白
  const gaps   = Math.max(0, blocks.length-1) * 4; // キャラ同士の最低すき間
  const availW = Math.max(20, sw - mL - mR - gaps);
  const availH = Math.min(BIG_MAX_H, Math.max(40, calcFloor() - (targetRowY() + 68)));
  return Math.max(1.5, Math.min(BS_MAP.L, availW/totalCols, availH/maxRows));
}

// オートのときだけ、全員の1マスの大きさを決め直す
function applyAutoScale(){
  if(bsKey !== 'A') return;
  const want = computeAutoBS();
  if(Math.abs(want - BS) < 0.05) return;
  BS = want;
  for(const b of blocks) b._computeShape();
}

function updateTargets(){
  applyAutoScale();
  const sorted=[...blocks].sort((a,b)=>a.num-b.num);
  if(!sorted.length) return;
  // 数が増えると1列に収まらなくなるので、間隔を詰めて画面内に入れる。
  // それでも足りないときは少しだけ重ねる（小さい数から順に並ぶので、
  // 重なっても手前の大きい数が隠れてしまうことはない）。
  const mL = 14 + playLeft(), mR = 14 + EDGE_MARGIN;
  const blocksW = sorted.reduce((s,b)=>s+b.width,0);
  const avail   = sw - mL - mR;
  if(sorted.length === 1){ sorted[0].targetX = Math.max(mL, mL+(avail-blocksW)/2); return; }

  const gap = (avail - blocksW) / (sorted.length - 1);
  if(gap >= 0){
    // 余裕がある：すき間を最大16pxまでにして中央寄せ
    const g = Math.min(16, gap);
    const total = blocksW + g*(sorted.length-1);
    let cx = Math.max(mL, mL + (avail-total)/2);
    for(const b of sorted){ b.targetX=cx; cx+=b.width+g; }
  } else {
    // 入りきらない：左右いっぱいに等間隔で置く（重なるが必ず画面内に収まる）
    const last = sorted[sorted.length-1];
    const step = (avail - last.width) / (sorted.length - 1);
    sorted.forEach((b,i) => { b.targetX = mL + step*i; });
  }
}

function spawnBlock(num){
  if(blocks.length>=MAX_BLOCKS) return;
  pushUndo();
  blocks.push(new NumberBlock(num,sw/2+(Math.random()-0.5)*100,targetRowY()+70));
  logStep('new', num);
  updateTargets();
}

function setBlockSize(k){
  if(bsKey===k) return;
  bsKey=k;
  if(k!=='A') BS=BS_MAP[k]; else BS=computeAutoBS();
  for(const b of blocks) b._computeShape();
  updateTargets();
}

// ─── Formula display ──────────────────────────────────────────────────────────
function drawFormula(ctx){
  if(!blocks.length) return;
  // おだい中は出さない。「1+1+1+1+1 = 5」と合体する前から答えが見えてしまい、
  // 自分で組み立てる楽しみを先に奪ってしまうため。
  if(taskActive()) return;
  const sorted=[...blocks].sort((a,b)=>a.num-b.num);
  const nums=sorted.map(b=>b.num);
  let formula='';
  if(mode==='+') formula=nums.join(' + ')+' = '+nums.reduce((a,v)=>a+v,0);
  else if(mode==='-'&&nums.length===2){ const big=Math.max(...nums),sm=Math.min(...nums); formula=`${big} − ${sm} = ${big-sm}`; }
  else if(mode==='x'&&nums.length===2) formula=`${nums[0]} × ${nums[1]} = ${nums[0]*nums[1]}`;
  else if(mode==='div'&&nums.length===2){ const big=Math.max(...nums),sm=Math.min(...nums); if(sm>=1&&big%sm===0) formula=`${big} ÷ ${sm} = ${big/sm}`; }
  if(!formula) formula=nums.join(', ');
  ctx.save();
  ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const maxW = sw - 24;
  const lines = wrapText(ctx, formula, maxW);
  const lh = 20;
  // ドロップ先のアイコン列（拡大時を含む）の下から書く
  let ty = getTaskCardRect() ? targetRowY() + 88 : TAB_H + 132;
  for(const line of lines){
    ctx.strokeStyle='white'; ctx.lineWidth=4; ctx.strokeText(line, sw/2, ty);
    ctx.fillStyle='#111'; ctx.fillText(line, sw/2, ty);
    ty += lh;
  }
  ctx.restore();
}

// 数式が画面幅に収まらないときは、区切り（空白）で折り返す。
// 「7 +」で行が終わらないよう、演算子は次の行の先頭に送らず行末に残す。
function wrapText(ctx, text, maxW){
  if(ctx.measureText(text).width <= maxW) return [text];
  const parts = text.split(' ');
  const lines = [];
  let cur = '';
  for(const part of parts){
    const next = cur ? cur+' '+part : part;
    if(cur && ctx.measureText(next).width > maxW){ lines.push(cur); cur = part; }
    else cur = next;
  }
  if(cur) lines.push(cur);
  return lines;
}

// ─── Numpad ───────────────────────────────────────────────────────────────────
function getNumpadLayout(){
  const padH=getPadH(),padY=sh-padH;
  // おだい中は、使ってよい数字と CLR だけを出す。
  // ランダム(R)は しばりを壊すので出さない。
  if(taskActive()){
    const t = currentTask();
    const items = t.use.map(d=>({label:String(d), val:d}));
    items.push({label:'CLR', val:'CLR', color:'#c55'});
    const btnH=40, gap=10;
    const btnW=Math.min(72, Math.floor((sw-40-gap*(items.length-1))/items.length));
    const total=items.length*btnW + gap*(items.length-1);
    const x0=(sw-total)/2, y=padY+Math.round((padH-safeBottom()-btnH)/2);
    return items.map((it,i)=>({...it, x:x0+i*(btnW+gap), y:y, w:btnW, h:btnH}));
  }
  const items=[
    {label:'1',val:1},{label:'2',val:2},{label:'3',val:3},{label:'4',val:4},
    {label:'5',val:5},{label:'6',val:6},{label:'7',val:7},{label:'8',val:8},
    {label:'9',val:9},{label:'10',val:10},
    {label:'R',val:'R',color:'#5a9'},{label:'CLR',val:'CLR',color:'#c55'}
  ];
  if(isLandscape()){
    const btnH=padH-12,btnW=Math.min(Math.floor((sw-10)/items.length)-2,70);
    return items.map((item,i)=>({...item,x:5+i*(btnW+2),y:padY+6,w:btnW,h:btnH}));
  }
  const btnH=36,col6W=Math.min(Math.floor((sw-10)/6)-2,58);
  return [
    ...items.slice(0,6).map((item,i)=>({...item,x:5+i*(col6W+2),y:padY+8,w:col6W,h:btnH})),
    ...items.slice(6).map((item,i)=>({...item,x:5+i*(col6W+2),y:padY+52,w:col6W,h:btnH}))
  ];
}

function drawNumpad(ctx){
  const padH=getPadH(),padY=sh-padH;
  ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(0,padY,sw,padH);
  // CLR を押し続けている進み具合（0〜1）。一周したら実行する。
  let clrProg = 0;
  if(clrHold){
    clrProg = Math.min(1, (Date.now()-clrHold.t0)/CLR_HOLD_MS);
    if(clrProg>=1){ pushUndo(); blocks=[]; taskLog=[]; updateTargets(); clrHold=null; clrProg=0; }
  }
  for(const b of getNumpadLayout()){
    const holding = (b.val==='CLR' && clrProg>0);
    ctx.save();
    ctx.fillStyle=b.color||'rgba(80,80,180,0.9)';
    ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,8); ctx.fill();
    if(holding){
      // 下から溜まっていくゲージ。どこまで進んだかが一目で分かる
      ctx.save();
      ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,8); ctx.clip();
      ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.fillRect(b.x, b.y+b.h*(1-clrProg), b.w, b.h*clrProg);
      ctx.restore();
      ctx.strokeStyle='white'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.roundRect(b.x-2,b.y-2,b.w+4,b.h+4,10); ctx.stroke();
    }
    ctx.fillStyle='white'; ctx.font='bold 15px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2);
    ctx.restore();
  }
}

// ─── Factor mode ──────────────────────────────────────────────────────────────
let factorVal=12, factorReveal={}, factorBlocks=[], factorBS=10;
const factorUI=document.getElementById('factor-ui');
const factorNum=document.getElementById('factor-num');
const factorRange=document.getElementById('factor-range');

function buildFactorRows(n){
  factorReveal={}; factorBlocks=[];
  // 分母ごとのrows数をBS=1で取得してfactorBSを計算
  const divisors=[];
  for(let d=1;d<=n;d++) if(n%d===0) divisors.push(d);
  const savedBS=BS;
  BS=1;
  const rowCounts=divisors.map(d=>{ const tmp=new NumberBlock(d,0,0); return tmp.rows; });
  BS=savedBS;
  const avail=sh-TAB_H-FACTOR_H-safeBottom()-8;
  const totalBlockRows=rowCounts.reduce((s,r)=>s+r,0);
  // factorBS × totalBlockRows + 12 × numRows ≤ avail
  factorBS=Math.max(4,Math.min(BS,Math.floor((avail-12*divisors.length)/Math.max(1,totalBlockRows))));
  // blocksをfactorBSで生成
  BS=factorBS;
  divisors.forEach((d,ri)=>{
    const m=n/d,row=[];
    for(let bi=0;bi<m;bi++){
      const nb=new NumberBlock(d,0,0); nb.x=-nb.width-20; nb.y=0; row.push(nb);
    }
    factorBlocks.push({d,m,L:n,blocks:row,rowH:Math.max(36,row[0].height+12)});
  });
  BS=savedBS;
}

function updateFactorTargets(){
  const savedBS=BS; BS=factorBS;
  const labelW=90,gapX=4; let curY=TAB_H+8;
  for(const row of factorBlocks){
    for(let bi=0;bi<row.blocks.length;bi++){
      const nb=row.blocks[bi]; nb.targetX=labelW+bi*(nb.width+gapX); nb.y=curY+(row.rowH-nb.height)/2;
    }
    curY+=row.rowH;
  }
  BS=savedBS;
}

function lerpFactorBlocks(){
  for(const row of factorBlocks) for(const nb of row.blocks) nb.x+=(nb.targetX-nb.x)*0.12;
}

function drawFactorMode(ctx,t){
  const savedBS=BS; BS=factorBS;
  let curY=TAB_H+8;
  for(let ri=0;ri<factorBlocks.length;ri++){
    const row=factorBlocks[ri],rowH=row.rowH;
    if(curY+rowH>sh-FACTOR_H) break;
    ctx.fillStyle=ri%2===0?'rgba(255,255,255,0.09)':'rgba(255,255,255,0.04)';
    ctx.fillRect(0,curY,sw,rowH);
    ctx.save(); ctx.font='bold 14px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='white';
    ctx.fillText(`${row.d}×${row.m}=${row.L}`,6,curY+rowH/2); ctx.restore();
    for(const nb of row.blocks) nb.draw(ctx,t,0);
    const bw=row.blocks[0]?.width||factorBS;
    const btnW=Math.max(70,sw-row.blocks.length*(bw+4)-95-6),revX=sw-btnW-6;
    const revealed=!!factorReveal[ri];
    ctx.save(); ctx.fillStyle=revealed?'rgba(80,200,80,0.85)':'rgba(200,200,200,0.3)';
    ctx.beginPath(); ctx.roundRect(revX,curY+8,btnW,rowH-16,8); ctx.fill();
    ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#111';
    ctx.fillText(`${row.L}÷${row.d}=${revealed?String(row.m):'?'}`,revX+btnW/2,curY+rowH/2); ctx.restore();
    curY+=rowH;
  }
  BS=savedBS;
}

function handleFactorTap(x,y){
  let curY=TAB_H+8;
  for(let ri=0;ri<factorBlocks.length;ri++){
    const row=factorBlocks[ri],rowH=row.rowH;
    if(curY+rowH>sh-FACTOR_H) break;
    const bw=row.blocks[0]?.width||factorBS;
    const btnW=Math.max(70,sw-row.blocks.length*(bw+4)-95-6),revX=sw-btnW-6;
    if(ptInRect(x,y,revX,curY+8,btnW,rowH-16)){ factorReveal[ri]=!factorReveal[ri]; return; }
    curY+=rowH;
  }
}

factorRange.addEventListener('input',()=>{
  factorVal=parseInt(factorRange.value,10); factorNum.textContent=String(factorVal);
  buildFactorRows(factorVal); updateFactorTargets(); factorReveal={};
});

// ─── ドリルモード（四則計算をひたすら解く）──────────────────────────────────
// キャラ同士をくっつけたときに出るのと同じクイズを、ランダムに出し続ける。
// 出題そのものは既存の Puzzle クラスをそのまま使う（見た目・操作を揃えるため）。
const quizUI      = document.getElementById('quiz-ui');
const quizMaxEl   = document.getElementById('quiz-max');
const quizMaxVal  = document.getElementById('quiz-max-val');
const quizLimitEl = document.getElementById('quiz-limit');

let quizOps   = ['+','-'];      // 出題する計算の種類（最低1つ）
let quizMax   = 10;             // 使う数の上限
const QUIZ_LIMITS = [0, 10000, 5000];   // 0＝制限なし
let quizLimitIdx = 0;
let quizStats = { asked:0, correct:0, streak:0, best:0 };
let quizScored = false;         // この問題の正誤をもう数えたか

function quizLimitLabel(){
  const ms = QUIZ_LIMITS[quizLimitIdx];
  return 'じかん：' + (ms ? (ms/1000)+'びょう' : 'なし');
}
/** 1〜quizMax の範囲で、その計算が成り立つ2つの数を選ぶ */
function quizPickPair(op){
  const M = quizMax, r = n => 1 + Math.floor(Math.random()*n);
  for(let i=0;i<200;i++){
    if(op==='+'){
      const a=r(M), b=r(M);
      if(a+b<=100) return [a,b];
    } else if(op==='-'){
      const a=r(M), b=r(M);
      if(a!==b) return [Math.max(a,b), Math.min(a,b)];
    } else if(op==='x'){
      const a=r(M), b=r(M);
      if(a*b<=100) return [a,b];
    } else {
      const b=r(M), q=r(M);          // わり算は「割り切れる」ように積から作る
      if(b*q<=100 && b>1) return [b*q, b];
    }
  }
  return op==='div' ? [6,3] : [1,1];   // 念のための保険
}
function quizNewPuzzle(){
  const op = quizOps[Math.floor(Math.random()*quizOps.length)];
  const [a,b] = quizPickPair(op);
  puzzle = new Puzzle({num:a, x:sw/2}, {num:b, x:sw/2}, op);
  const ms = QUIZ_LIMITS[quizLimitIdx];
  if(!ms) puzzle.COUNTDOWN = Infinity;   // 制限なし（あせらせない）
  else    puzzle.COUNTDOWN = ms;
  puzzle.noBar = !ms;
  quizStats.asked++;
  quizScored = false;
}
function quizReset(){
  quizStats = { asked:0, correct:0, streak:0, best:0 };
  puzzle = null;
  quizNewPuzzle();
}
/** 成績を1問ぶん記録する（一発で当てたときだけ「せいかい」に数える） */
function quizScore(ok){
  if(quizScored) return;
  quizScored = true;
  if(ok){
    quizStats.correct++;
    quizStats.streak++;
    if(quizStats.streak > quizStats.best) quizStats.best = quizStats.streak;
  } else {
    quizStats.streak = 0;
  }
}
function drawQuizScore(ctx){
  const txt = 'もんだい ' + quizStats.asked + '　せいかい ' + quizStats.correct +
              '　れんぞく ' + quizStats.streak + '（さいこう ' + quizStats.best + '）';
  ctx.save();
  ctx.font='bold 15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle='white'; ctx.lineWidth=4; ctx.strokeText(txt, sw/2, TAB_H+16);
  ctx.fillStyle='#111'; ctx.fillText(txt, sw/2, TAB_H+16);
  ctx.restore();
}

quizMaxEl.addEventListener('input', ()=>{
  quizMax = parseInt(quizMaxEl.value,10);
  quizMaxVal.textContent = String(quizMax);
});
quizMaxEl.addEventListener('change', ()=>{ if(mode==='quiz') quizNewPuzzle(); });
quizLimitEl.addEventListener('click', ()=>{
  quizLimitIdx = (quizLimitIdx+1) % QUIZ_LIMITS.length;
  quizLimitEl.textContent = quizLimitLabel();
  if(mode==='quiz') quizNewPuzzle();
});
for(const btn of document.querySelectorAll('.opBtn')){
  btn.addEventListener('click', ()=>{
    const op = btn.dataset.op;
    const i = quizOps.indexOf(op);
    if(i>=0){ if(quizOps.length>1){ quizOps.splice(i,1); btn.classList.remove('on'); } }  // 最低1つは残す
    else    { quizOps.push(op); btn.classList.add('on'); }
    if(mode==='quiz') quizNewPuzzle();
  });
}

// ─── とけいモード ─────────────────────────────────────────────────────────
// 文字盤のまわりに「5個ずつのかたまり」を並べる。長針が3を指していれば
// 3かたまり＝15個が光るので、「3なのに15ふん」のズレが目で分かる。
// 数字1〜12はそのキャラの色で描くので、知っている顔と地続きになる。
let clockT = 3*60 + 0;        // 0時ちょうどからの分（0〜719）
let clockDrag = null;         // 'hour' | 'min'

function clockHour(){ return Math.floor(clockT/60)%12; }
function clockMin(){  return clockT%60; }

function getClockGeom(){
  const top = TAB_H + 12, bottom = calcFloor();
  const R = Math.max(50, Math.min((sw - EDGE_MARGIN*2)/2, (bottom - top - 150)/2));
  return { cx: sw/2, cy: top + R + 4, R: R, textY: top + 2*R + 34 };
}

// 針の先の座標。12時が上、時計回り。
function handPos(g, frac, len){
  const a = frac*Math.PI*2 - Math.PI/2;
  return { x: g.cx + Math.cos(a)*len, y: g.cy + Math.sin(a)*len };
}

function drawClockMode(ctx, t){
  const g = getClockGeom();
  const min = clockMin(), hr = clockHour();
  const litGroups = Math.floor(min/5);          // 光りきったかたまりの数

  // 文字盤
  ctx.save();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(g.cx,g.cy,g.R,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#3a4a63'; ctx.lineWidth=Math.max(3,g.R*0.035);
  ctx.beginPath(); ctx.arc(g.cx,g.cy,g.R,0,Math.PI*2); ctx.stroke();

  // まわりの60個のブロック（5個ずつのかたまり）
  const cubeR = g.R*0.845, cube = Math.max(4, g.R*0.062);
  for(let i=0;i<60;i++){
    // かたまりは「その数字にたどり着く5個」。1〜5分が「1」の色、
    // 6〜10分が「2」の色…と対応するので、3を指せば3かたまりぶんが光る。
    const num = (i===0) ? 12 : Math.ceil(i/5);
    const col = mainColorOf(num);
    // 12の位置(i=0)が出発点。そこから数えて min 個ぶんが光る。
    // 針の真下のブロックがちょうど最後の1個になる。
    const lit = (i > 0 && i <= min);
    // 5の位置（数字の真上）のブロックは大きめ・フチ強め。
    // かたまりの切れ目が見えるので「5ずつ」の並びが読みやすくなる。
    const isMark = (i % 5 === 0);
    const sz = cube * (isMark ? 1.42 : 1);
    const a = (i/60)*Math.PI*2 - Math.PI/2;
    const x = g.cx + Math.cos(a)*cubeR, y = g.cy + Math.sin(a)*cubeR;
    ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.PI/2);
    ctx.fillStyle = lit ? rgb(isMark ? col : mixWhite(col,0.22))
                        : rgb(mixWhite(col, isMark ? 0.68 : 0.82));
    ctx.beginPath(); ctx.roundRect(-sz/2,-sz/2,sz,sz,sz*0.22); ctx.fill();
    ctx.strokeStyle = lit ? rgb(darken(col, isMark ? 0.45 : 0.28))
                          : rgb(mixWhite(col, isMark ? 0.28 : 0.5));
    ctx.lineWidth = Math.max(0.9, sz*(isMark ? 0.19 : 0.12));
    ctx.beginPath(); ctx.roundRect(-sz/2,-sz/2,sz,sz,sz*0.22); ctx.stroke();
    ctx.restore();
  }

  // 数字 1〜12（そのキャラの色）
  const numR = g.R*0.66;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(g.R*0.19)+'px sans-serif';
  for(let n=1;n<=12;n++){
    const a = (n/12)*Math.PI*2 - Math.PI/2;
    const x = g.cx + Math.cos(a)*numR, y = g.cy + Math.sin(a)*numR;
    const col = mainColorOf(n);
    const on = (n===12 ? litGroups===0 : litGroups>=n);
    ctx.lineWidth=Math.max(2,g.R*0.03); ctx.strokeStyle='rgba(255,255,255,0.95)';
    ctx.strokeText(String(n),x,y);
    ctx.fillStyle = rgb(on ? darken(col,0.12) : mixWhite(col,0.35));
    ctx.fillText(String(n),x,y);
  }

  // 針（短針は時、長針は分）
  const hFrac = (clockT/720), mFrac = (min/60);
  const hp = handPos(g, hFrac, g.R*0.48), mp = handPos(g, mFrac, g.R*0.80);
  // 短針＝赤（みじかくて太い）／長針＝青（ながくて細い）
  ctx.lineCap='round';
  ctx.strokeStyle='#e0403f'; ctx.lineWidth=Math.max(6,g.R*0.075);
  ctx.beginPath(); ctx.moveTo(g.cx,g.cy); ctx.lineTo(hp.x,hp.y); ctx.stroke();
  ctx.strokeStyle='#1f6fd8'; ctx.lineWidth=Math.max(3.5,g.R*0.042);
  ctx.beginPath(); ctx.moveTo(g.cx,g.cy); ctx.lineTo(mp.x,mp.y); ctx.stroke();
  ctx.fillStyle='#2b3a52'; ctx.beginPath(); ctx.arc(g.cx,g.cy,Math.max(4,g.R*0.055),0,Math.PI*2); ctx.fill();
  ctx.restore();

  // 「10:40 (10時40分)」。デジタル表記を大きく、読みをその横に小さく。
  const h12 = (hr===0 ? 12 : hr);
  const digital = h12 + ':' + String(min).padStart(2,'0');
  const kanji   = '(' + h12 + '時' + min + '分)';
  ctx.save(); ctx.textAlign='left'; ctx.textBaseline='middle';
  const fBig='bold 30px sans-serif', fSmall='bold 17px sans-serif';
  ctx.font=fBig;   const wBig   = ctx.measureText(digital).width;
  ctx.font=fSmall; const wSmall = ctx.measureText(kanji).width;
  const gap = 8;
  let tx = sw/2 - (wBig + gap + wSmall)/2;
  ctx.lineJoin='round';
  ctx.font=fBig;
  ctx.strokeStyle='white'; ctx.lineWidth=6; ctx.strokeText(digital, tx, g.textY);
  ctx.fillStyle='#111'; ctx.fillText(digital, tx, g.textY);
  tx += wBig + gap;
  ctx.font=fSmall;
  ctx.strokeStyle='white'; ctx.lineWidth=5; ctx.strokeText(kanji, tx, g.textY+1);
  ctx.fillStyle='#39485e'; ctx.fillText(kanji, tx, g.textY+1);
  ctx.restore();

  drawClockParts(ctx, t, g);
}

// ─── 5のなかま ───────────────────────────────────────────────────────────
// 長針が数字を1つ通り過ぎるたびに「5」が1体ふえる。3を指していれば5が3体。
// 下の列をタップすると合体して「15」になり、もう一度タップすると5に戻る。
// 「3なのに15ふん」の理由が、いつもの合体あそびと同じ手つきで分かる。
let clockMerged = false;
let clockPopAt = 0, clockPrevGroups = 0;

// とけいの下に並べるときは、1桁は1列に積んだ形を使う。
// 4 が 2×2 のままだと、5のなかまの横で背の高さがそろわない。
function clockPartSpec(n){ return n < 10 ? columnSpec(n) : blockSpec(n); }

function clockPartsArea(g){
  return { top: g.textY + 18, bottom: calcFloor(), w: sw - EDGE_MARGIN*2 };
}

function drawClockParts(ctx, t, g){
  const min = clockMin();
  const groups = Math.floor(min/5);
  if(groups !== clockPrevGroups){
    if(groups > clockPrevGroups) clockPopAt = Date.now();   // 増えた瞬間だけ跳ねる
    clockPrevGroups = groups;
  }
  const a = clockPartsArea(g);
  // ちょうどの時刻は「0ふん」。ブロックを持たないゼロが出てくる。
  if(min === 0){
    // 背の高さは One と同じ＝1マスぶん。ほかのキャラと同じ物差しで並ぶ。
    const bs = Math.max(6, Math.min(24, a.w, (a.bottom - a.top - 26)/1.7));
    drawClockFormula(ctx, '0', a.top);
    drawZero(ctx, sw/2, a.bottom - zeroHeight(bs), bs, t, true);
    return;
  }

  const availH = Math.max(30, a.bottom - a.top - 20), gap = 6;

  if(clockMerged){
    const spec = clockPartSpec(min);
    const bs = Math.max(3, Math.min(26, a.w/spec.cols, availH/spec.rows));
    const x = sw/2 - spec.cols*bs/2, y = a.bottom - spec.rows*bs;
    drawClockFormula(ctx, String(min), a.top);
    drawNumberblock(ctx, min, x, y, bs, { t:t, animate:false, numberling:false, spec:spec });
    return;
  }

  // 5は2体でペアにして手をつなぐ。ペアの下に「10」を出すので、
  // 10のかたまりがいくつあるかが一目で分かる。
  const items = [];
  for(let i=0;i<groups;i++) items.push(5);
  const rem = min%5; if(rem) items.push(rem);
  const nFives = groups;

  // ペアの中は腕が届く間隔、ペアとペアのあいだは広め。
  // 間隔は1マスの大きさに比例するので、先に「1マス何個ぶん空くか」を数える。
  const GAP_IN = 0.55, GAP_OUT = 1.6;
  const gapUnitAt = i => (i < nFives && i % 2 === 1) ? GAP_IN : GAP_OUT;
  let totalCols = 0, maxRows = 1, gapUnits = 0;
  for(let i=0;i<items.length;i++){
    const sp = clockPartSpec(items[i]);
    totalCols += sp.cols; if(sp.rows>maxRows) maxRows = sp.rows;
    if(i>0) gapUnits += gapUnitAt(i);
  }
  const labelH = 20;                                  // 下に「10」を出すぶん
  const bs = Math.max(3, Math.min(24, a.w/(totalCols+gapUnits), (availH-labelH)/maxRows));
  const baseY = a.bottom - labelH;

  drawClockFormula(ctx, items.join(' + ') + ' = ' + min, a.top);

  // 位置を先に決めてから描く（ペアの下に線を引くため）
  const place = [];
  let x = sw/2 - (totalCols*bs + gapUnits*bs)/2;
  for(let i=0;i<items.length;i++){
    if(i>0) x += gapUnitAt(i)*bs;
    const sp = clockPartSpec(items[i]);
    place.push({ n:items[i], sp:sp, x:x, w:sp.cols*bs, h:sp.rows*bs });
    x += sp.cols*bs;
  }

  // ペアの下の「10」
  ctx.save();
  ctx.strokeStyle='rgba(40,60,90,0.55)'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
  for(let i=0;i+1<nFives;i+=2){
    const L=place[i], R=place[i+1];
    const y = baseY + 5;
    ctx.beginPath(); ctx.moveTo(L.x, y); ctx.lineTo(R.x+R.w, y); ctx.stroke();
    ctx.strokeStyle='white'; ctx.lineWidth=4; ctx.lineJoin='round';
    ctx.strokeText('10', (L.x+R.x+R.w)/2, y+2);
    ctx.fillStyle='#233'; ctx.fillText('10', (L.x+R.x+R.w)/2, y+2);
    ctx.strokeStyle='rgba(40,60,90,0.55)'; ctx.lineWidth=2;
  }
  ctx.restore();

  // 増えた瞬間の1体だけ「ぽんっ」と跳ねる
  const pop = Math.max(0, 1 - (Date.now()-clockPopAt)/260);
  for(let i=0;i<place.length;i++){
    const it = place[i], y = baseY - it.h;
    const isNew = (pop>0 && rem===0 && i===place.length-1);
    if(isNew){
      const e = 1-pop, sc = 0.45 + 0.55*e;
      ctx.save();
      ctx.translate(it.x+it.w/2, y+it.h); ctx.scale(sc,sc); ctx.translate(-(it.x+it.w/2), -(y+it.h));
      drawNumberblock(ctx, it.n, it.x, y, bs, { t:t, animate:true, numberling:false, spec:it.sp });
      ctx.restore();
    } else {
      drawNumberblock(ctx, it.n, it.x, y, bs, { t:t, animate:false, numberling:false, spec:it.sp });
    }
  }

  // つないだ手の印。腕は体の後ろに描かれるので、そのままだと隣の体に隠れて
  // 「手をつないでいる」ことが伝わらない。合わさる位置に丸を重ねて示す。
  const clasp = darken(oneCellColor(5,0), 0.55);
  ctx.save(); ctx.fillStyle = rgb(clasp);
  for(let i=0;i+1<nFives;i+=2){
    const L=place[i], R=place[i+1];
    const cx2 = (L.x+L.w + R.x)/2, cy2 = baseY - L.h*0.40;
    ctx.beginPath(); ctx.arc(cx2, cy2, Math.max(2.5, bs*0.17), 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawClockFormula(ctx, txt, y){
  ctx.save(); ctx.font='bold 15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.strokeStyle='white'; ctx.lineWidth=4; ctx.lineJoin='round';
  ctx.strokeText(txt, sw/2, y); ctx.fillStyle='#233'; ctx.fillText(txt, sw/2, y);
  ctx.restore();
}

// 針をつかむ・動かす
function clockAngleFrac(x,y){
  const g = getClockGeom();
  let a = Math.atan2(y-g.cy, x-g.cx) + Math.PI/2;
  a = (a % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  return a/(Math.PI*2);                       // 0〜1（12時が0）
}
function handleClockStart(x,y){
  const g = getClockGeom();
  // 文字盤より下＝5のなかまの場所。タップで合体／もとに戻す。
  if(y > g.textY && clockMin() > 0){
    clockMerged = !clockMerged;
    const a = clockPartsArea(g);
    for(let i=0;i<14;i++) fxParticles.push(new Particle(sw/2, a.bottom-20));
    return;
  }
  const d = Math.hypot(x-g.cx, y-g.cy);
  if(d > g.R*1.15) return;
  // 近いほうの針をつかむ。短針は内側、長針は外側にあるので距離でも分ける。
  const f = clockAngleFrac(x,y);
  const dm = Math.min(Math.abs(f-clockMin()/60), 1-Math.abs(f-clockMin()/60));
  const dh = Math.min(Math.abs(f-clockT/720),    1-Math.abs(f-clockT/720));
  clockDrag = (d > g.R*0.55) ? 'min' : (dm < dh ? 'min' : 'hour');
  handleClockMove(x,y);
}
function handleClockMove(x,y){
  if(!clockDrag) return;
  const f = clockAngleFrac(x,y);
  if(clockDrag==='min'){
    // 分だけ動かす。1周こえたら時もくり上がる（本物と同じ）
    const nm = Math.round(f*60) % 60;
    let dm = nm - clockMin();
    if(dm >  30) dm -= 60;
    if(dm < -30) dm += 60;
    clockT = (clockT + dm + 720) % 720;
  } else {
    clockT = (Math.round(f*720) + 720) % 720;   // 短針は時と分の両方をあらわす
  }
}

// ─── クリアしたときの演出 ─────────────────────────────────────────
// できたキャラを主役にする。うしろから集中線がひろがり、本人はぴょんと跳ね、
// 紙吹雪がキャラから吹き出す。最短手でできたときだけ「さいたん！」が出る。
let winFx = null;              // {block, t, minimal, moves}
const WIN_MS = 2000;

function drawWinLines(ctx){
  if(!winFx || !winFx.block) return;
  const b = winFx.block, t = winFx.t;
  const cx = b.x + b.width/2, cy = b.y + b.height/2;
  // 0→1 へ一気に開いて、おわりにかけてすうっと消える
  const grow = Math.min(1, t/260), fade = Math.min(1, Math.max(0, (WIN_MS-t)/700));
  const hole  = (Math.max(b.width, b.height)/2 + 26) * (0.45 + 0.55*grow);
  const outer = Math.hypot(sw, sh);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, TAB_H, sw, sh - bottomPanelH() - TAB_H);
  ctx.clip();
  ctx.translate(cx, cy);
  const N = 46;
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2 + t*0.00018;
    const w = 0.004 + 0.013*(((i*37)%9)/9);       // 太さをばらけさせて手描きっぽく
    const r0 = hole * (1 + 0.18*(((i*13)%5)/5));  // 内側のふちもそろえない
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
    ctx.lineTo(Math.cos(a-w)*outer, Math.sin(a-w)*outer);
    ctx.lineTo(Math.cos(a+w)*outer, Math.sin(a+w)*outer);
    ctx.closePath();
    ctx.fillStyle = (i%3===0) ? 'rgba(255,226,130,'+(0.55*fade)+')'
                              : 'rgba(255,255,255,'+(0.62*fade)+')';
    ctx.fill();
  }
  // 広がる光の輪
  if(grow < 1 || t < 900){
    const rr = hole + 240*Math.min(1, t/900);
    ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,'+(0.5*(1-Math.min(1,t/900)))+')';
    ctx.lineWidth = 10*(1-Math.min(1,t/900))+2; ctx.stroke();
  }
  ctx.restore();
}

function drawWinStamp(ctx){
  if(!winFx) return;
  const b = winFx.block, t = winFx.t;
  const fade = Math.min(1, Math.max(0, (WIN_MS-t)/500));
  // 出るときにちょっと行き過ぎてから戻る（ぽんっと押した感じ）
  const e = Math.min(1, t/190);
  const sc = 1 + 0.55*(1-e)*(1-e) - 0.22*Math.sin(e*Math.PI);
  const cx = b ? Math.min(Math.max(90, b.x + b.width/2), sw-90) : sw/2;
  // 顔はいちばん上のかたまりにあるので、その下（胸のあたり）に押す。
  // 101以上は顔が「板1まい」ぶんの大きさなので、その高さを見てずらす。
  let faceH = b ? b.bs : 0;
  if(b){
    const sp = blockSpec(b.num);
    if(sp && sp.faceBox) faceH = sp.faceBox.h * b.bs;
  }
  const cy = b ? Math.min(b.y + faceH + b.bs*0.7 + 22, calcFloor() - 34)
               : (TAB_H + calcFloor())/2;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.rotate(-0.06);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineJoin='round';
  ctx.font='bold 40px sans-serif';
  ctx.strokeStyle='#fff'; ctx.lineWidth=9; ctx.strokeText('できた！',0,0);
  ctx.fillStyle='#e8622a'; ctx.fillText('できた！',0,0);
  const pr = winFx.praise;
  if(pr){
    ctx.font='bold ' + (pr.big ? 24 : 22) + 'px sans-serif';
    ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.strokeText(pr.text,0,32);
    ctx.fillStyle=pr.color; ctx.fillText(pr.text,0,32);
  }
  ctx.restore();
}

function updateWinFx(dt){
  if(!winFx) return;
  winFx.t += dt;
  if(winFx.block && !blocks.includes(winFx.block)) winFx.block = blocks.find(b=>b.num===winFx.num) || null;
  if(winFx.t > WIN_MS) winFx = null;
}

// ─── おだいカード ─────────────────────────────────────────────────────────
// ドロップ先のアイコン列の下、数式の上に置く。遊び方は変えず、お題だけ乗せる。
let taskBtns = [];

// ヒントを開いているあいだは、そのぶんカードが下にのびる（アイコン列も下がる）
function taskCardH(){ return 50 + ((hintOn && !taskDone) ? 34 : 0); }
function getTaskCardRect(){
  if(!taskActive()) return null;
  return { x:playLeft(), y:TAB_H+6, w:sw-playLeft()-EDGE_MARGIN, h:taskCardH() };
}

// カードの中の小さなボタン
function drawCardBtn(ctx, x, y, w, h, label, fill, fg){
  // 文字のそろえ方を変えるので、呼んだ側の設定を壊さないよう包んでおく
  ctx.save();
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,9); ctx.fill();
  ctx.fillStyle = fg;
  ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, x+w/2, y+h/2+1);
  ctx.restore();
}

function drawTaskCard(ctx, t){
  taskBtns = [];
  const r = getTaskCardRect(); if(!r) return;
  const task = currentTask();
  const pulse = 0.5+0.5*Math.sin(t*0.006);
  if(!taskStartT) taskStartT = Date.now();   // 開き直したときの数えはじめ
  const lv = TASK_LEVELS[task.lv||0];

  ctx.save();
  ctx.fillStyle = taskDone ? 'rgba(255,205,70,0.96)' : 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,12); ctx.fill();
  ctx.strokeStyle = taskDone ? 'rgba(220,150,20,0.95)' : 'rgba(60,80,110,0.35)';
  ctx.lineWidth = taskDone ? 2.5+pulse : 1.5;
  ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,12); ctx.stroke();

  ctx.textBaseline='middle';
  if(taskDone){
    ctx.textAlign='left'; ctx.fillStyle='#6b4a00'; ctx.font='bold 19px sans-serif';
    ctx.fillText('できた！  ' + task.n, r.x+14, r.y+19);
    ctx.font='bold 12px sans-serif'; ctx.fillStyle='#8a6a1a';
    const pz = winFx && winFx.praise;
    ctx.fillText(taskLog.length + ' て' + (pz ? '　' + pz.text : ''), r.x+14, r.y+37);
    const bh=32, by=r.y+9;
    const nw=58, tw=68, gap=6;
    const bx2 = r.x+r.w-10-nw, bx1 = bx2-gap-tw;
    drawCardBtn(ctx, bx1, by, tw, bh, 'てじゅん', 'rgba(255,255,255,0.95)', '#6b4a00');
    drawCardBtn(ctx, bx2, by, nw, bh, 'つぎ',     'rgba(60,110,240,0.95)', '#fff');
    taskBtns.push({x:bx1,y:by,w:tw,h:bh,val:'steps'});
    taskBtns.push({x:bx2,y:by,w:nw,h:bh,val:'next'});
  } else {

    // 右：あそんでいる子・ヒント・ステージいちらん
    const bh=36, by=r.y+7;
    const bw=64, bx=r.x+r.w-bw-10;
    ctx.fillStyle = lv.color;
    ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,9); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font='bold 14px sans-serif';
    ctx.fillText(stageLabel(taskIdx), bx+bw/2, by+13);
    ctx.font='bold 10px sans-serif';
    ctx.fillText('いちらん', bx+bw/2, by+27);
    taskBtns.push({x:bx,y:by,w:bw,h:bh,val:'stages'});
    let leftOfBtns = bx;   // 右に並べたボタンの、いちばん左のふち

    // ヒントは最初から出さない。なかなか解けないときだけ、ふわっと出てくる。
    if(hintReady()){
      if(!hintShownAt) hintShownAt = Date.now();
      const age = Date.now() - hintShownAt;
      const hw=40, hx=bx-hw-6;
      ctx.save();
      ctx.globalAlpha = Math.min(1, age/450);
      // 出てきた直後だけ、気づいてもらえるように ふちが やさしく明滅する
      if(!hintOn && age < 6000){
        ctx.shadowColor='rgba(255,190,60,'+(0.45+0.4*pulse)+')'; ctx.shadowBlur=12;
      }
      ctx.fillStyle = hintOn ? 'rgba(255,196,60,0.97)' : 'rgba(236,240,248,0.98)';
      ctx.beginPath(); ctx.roundRect(hx,by,hw,bh,9); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle='rgba(70,90,120,0.28)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.roundRect(hx,by,hw,bh,9); ctx.stroke();
      ctx.fillStyle = hintOn ? '#5a3c00' : '#5a6a84';
      ctx.textAlign='center';
      ctx.font='bold 17px sans-serif'; ctx.fillText('?', hx+hw/2, by+14);
      ctx.font='bold 9px sans-serif';  ctx.fillText('ヒント', hx+hw/2, by+28);
      ctx.restore();
      taskBtns.push({x:hx,y:by,w:hw,h:bh,val:'hint'});
      leftOfBtns = hx;
    } else if(hintOn){
      hintOn = false;   // 出す条件から外れたら、ふきだしも閉じる
    }

    // だれの記録として残るのかが分かるように、名前を出しておく
    const nw2=54, nx=leftOfBtns-nw2-6;
    ctx.fillStyle = profile().color;
    ctx.beginPath(); ctx.roundRect(nx,by+4,nw2,bh-8,8); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font='bold 12px sans-serif'; ctx.fillText(profile().name, nx+nw2/2, by+bh/2);
    taskBtns.push({x:nx,y:by+4,w:nw2,h:bh-8,val:'stages'});

    // 「◯をつくろう！」。使える数字は数字キーを見れば分かるので書かない。
    // 右のボタンにぶつかりそうなら、ひと回り小さくして収める。
    const titleMax = nx - r.x - 22;
    const tail = ' を つくろう！';
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    let f1 = 28, f2 = 18;
    for(let k=0;k<3;k++){
      ctx.font='bold '+f1+'px sans-serif';
      const w1 = ctx.measureText(String(task.n)).width;
      ctx.font='bold '+f2+'px sans-serif';
      if(w1 + ctx.measureText(tail).width <= titleMax) break;
      f1 -= 4; f2 -= 2;
    }
    const ty0 = r.y+33;
    ctx.fillStyle='#16233a'; ctx.font='bold '+f1+'px sans-serif';
    ctx.fillText(String(task.n), r.x+16, ty0);
    const nw = ctx.measureText(String(task.n)).width;
    ctx.font='bold '+f2+'px sans-serif'; ctx.fillStyle='#2b3a52';
    ctx.fillText(tail, r.x+16+nw, ty0);
    ctx.textBaseline='middle';
  }
  ctx.restore();

  // ヒントのふきだし（カードの下半分にのびる）
  if(hintOn && !taskDone){
    const hy = r.y + 50 - 4, hh = 30;
    ctx.save();
    ctx.fillStyle='rgba(255,239,190,0.97)';
    ctx.beginPath(); ctx.roundRect(r.x+8, hy, r.w-16, hh, 9); ctx.fill();
    ctx.strokeStyle='rgba(215,165,40,0.8)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(r.x+8, hy, r.w-16, hh, 9); ctx.stroke();
    ctx.fillStyle='#6b4a00'; ctx.font='bold 15px sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('ヒント： ' + task.hint, r.x+20, hy+hh/2);
    ctx.restore();
  }
}

// ─── ステージいちらん ─────────────────────────────────────────────────
// 60問をレベルごとに並べる。クリアしたものは色が付き、押すと「てじゅん」が見られる。
function stageLabel(i){
  const t = TASKS[i]; if(!t) return '';
  let first = 0;
  for(let k=0;k<TASKS.length;k++){ if(TASKS[k].lv===t.lv){ first=k; break; } }
  return (t.lv+1) + '-' + (i-first+1);
}
function clearedCount(){ return Object.keys(taskCleared).length; }

function stageGrid(){
  const pad = 12, cols = 10, cgap = 4;
  const cw = (sw - pad*2 - cgap*(cols-1)) / cols;
  const y0 = TAB_H + 52;
  const rowH = Math.min(74, Math.max(40, (sh - y0 - 20) / TASK_LEVELS.length));
  return { pad:pad, cols:cols, cgap:cgap, cw:cw, y0:y0, rowH:rowH,
           ch:Math.max(26, Math.min(46, rowH-24)) };
}

function drawStageSelect(ctx, t){
  stageBtns = [];
  const g = stageGrid();

  ctx.save();
  ctx.fillStyle='rgba(14,24,40,0.97)'; ctx.fillRect(0,TAB_H,sw,sh-TAB_H);

  // 見出し
  ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.fillStyle='#fff'; ctx.font='bold 15px sans-serif';
  ctx.fillText('ステージ', g.pad, TAB_H+26);

  // 長押しが一周したら実行する（ボタンを押した瞬間には何もしない）
  if(stageHold){
    const hp = Math.min(1, (Date.now()-stageHold.t0)/STAGE_HOLD_MS);
    if(hp >= 1){
      if(stageHold.val==='rec'){ recOpen=true; recConfirm=null; stageDetail=-1; askOnListClose=true; }
      else if(stageHold.val==='prof'){ setProfile(stageHold.i); }
      stageHold = null;
    }
  }

  // だれの記録を見ているか。長押しするとその子に切り替わる（記録は別々）
  const pw=74, ph=32, pgap=5, px0=g.pad+66, py=TAB_H+10;
  PROFILES.forEach((pr,i)=>{
    const x = px0 + i*(pw+pgap), on = (i===profileIdx);
    ctx.fillStyle = on ? pr.color : 'rgba(255,255,255,0.07)';
    ctx.beginPath(); ctx.roundRect(x,py,pw,ph,9); ctx.fill();
    ctx.strokeStyle = on ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.22)';
    ctx.lineWidth = on ? 2 : 1;
    ctx.beginPath(); ctx.roundRect(x,py,pw,ph,9); ctx.stroke();
    ctx.textAlign='center';
    ctx.fillStyle = on ? '#fff' : '#b9c8dc';
    ctx.font='bold 12px sans-serif'; ctx.fillText(pr.name, x+pw/2, py+11);
    ctx.font='bold 10px sans-serif';
    ctx.fillStyle = on ? 'rgba(255,255,255,0.85)' : '#8fa2bb';
    ctx.fillText(clearedCountOf(pr.id) + ' / ' + TASKS.length, x+pw/2, py+24);
    stageBtns.push({x:x,y:py,w:pw,h:ph,val:'prof',i:i});
  });
  ctx.textAlign='left';

  const cw2=58, ch2=30, cx2=sw-g.pad-cw2, cy2=TAB_H+11;
  drawCardBtn(ctx, cx2, cy2, cw2, ch2, 'とじる', 'rgba(255,255,255,0.9)', '#22314a');
  stageBtns.push({x:cx2,y:cy2,w:cw2,h:ch2,val:'close'});
  const rw=54, rx=cx2-rw-6;
  drawCardBtn(ctx, rx, cy2, rw, ch2, 'きろく', 'rgba(255,255,255,0.22)', '#e6edf7');
  stageBtns.push({x:rx,y:cy2,w:rw,h:ch2,val:'rec'});

  // 長押し中のボタンに、たまっていくゲージを重ねる
  if(stageHold && stageHold.rect){
    const r = stageHold.rect;
    const hp = Math.min(1, (Date.now()-stageHold.t0)/STAGE_HOLD_MS);
    ctx.save();
    ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,9); ctx.clip();
    ctx.fillStyle='rgba(255,205,70,0.8)';
    ctx.fillRect(r.x, r.y+r.h*(1-hp), r.w, r.h*hp);
    ctx.restore();
    ctx.strokeStyle='rgba(255,220,120,0.95)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.roundRect(r.x-2,r.y-2,r.w+4,r.h+4,11); ctx.stroke();
  }

  // レベルごとに1行
  for(let lv=0; lv<TASK_LEVELS.length; lv++){
    const ry = g.y0 + lv*g.rowH;
    const L = TASK_LEVELS[lv];
    ctx.textAlign='left'; ctx.fillStyle=L.color; ctx.font='bold 11px sans-serif';
    ctx.fillText('レベル' + (lv+1) + '  ' + L.name, g.pad, ry+7);

    const idxs = [];
    for(let i=0;i<TASKS.length;i++) if(TASKS[i].lv===lv) idxs.push(i);
    idxs.forEach((idx,c)=>{
      const x = g.pad + c*(g.cw+g.cgap), y = ry+16, w = g.cw, h = g.ch;
      const done = !!taskCleared[idx], cur = (idx===taskIdx);
      ctx.fillStyle = done ? L.color : 'rgba(255,255,255,0.14)';
      ctx.beginPath(); ctx.roundRect(x,y,w,h,7); ctx.fill();
      if(cur){
        ctx.strokeStyle='rgba(255,210,70,0.98)'; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.roundRect(x-1,y-1,w+2,h+2,8); ctx.stroke();
      }
      ctx.fillStyle = done ? '#fff' : '#cdd9ea';
      const nt = String(TASKS[idx].n);
      ctx.font='bold ' + (nt.length>3 ? 11 : 13) + 'px sans-serif'; ctx.textAlign='center';
      ctx.fillText(nt, x+w/2, y+h/2-3);
      const star = done && isNice(idx);
      ctx.font = star ? '10px sans-serif' : '9px sans-serif';
      ctx.fillStyle = star ? '#fff8d0' : (done ? 'rgba(255,255,255,0.85)' : '#8fa2bb');
      ctx.fillText(done ? (star ? '★' : '✓') : String(c+1), x+w/2, y+h-7);
      stageBtns.push({x:x,y:y,w:w,h:h,val:'go',idx:idx});
    });
  }
  ctx.restore();

  if(recOpen)             drawRecordPanel(ctx);
  else if(stageDetail>=0) drawStageDetail(ctx, stageDetail);
}

// ─── だれが あそぶ？ ────────────────────────────────────────────
// 久しぶりに開いたときだけ出す。押すだけなので、ひなたも自分で選べる。
function drawWhoPicker(ctx, t){
  whoBtns = [];
  const pulse = 0.5+0.5*Math.sin(t*0.005);
  ctx.save();
  ctx.fillStyle='rgba(14,24,40,0.93)'; ctx.fillRect(0,0,sw,sh);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif';
  ctx.fillText('だれが あそぶ？', sw/2, Math.max(90, sh*0.20));

  const bw = Math.min(280, sw-56), bh = 104, gap = 20;
  const total = PROFILES.length*bh + (PROFILES.length-1)*gap;
  const y0 = Math.max(150, (sh - total)/2);
  PROFILES.forEach((pr,i)=>{
    const x = (sw-bw)/2, y = y0 + i*(bh+gap), on = (i===profileIdx);
    ctx.save();
    if(on){ ctx.shadowColor='rgba(255,255,255,'+(0.3+0.25*pulse)+')'; ctx.shadowBlur=16; }
    ctx.fillStyle = pr.color;
    ctx.beginPath(); ctx.roundRect(x,y,bw,bh,20); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth = on ? 3.5 : 1.5;
    ctx.beginPath(); ctx.roundRect(x,y,bw,bh,20); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 34px sans-serif';
    ctx.fillText(pr.name, x+bw/2, y+bh/2-10);
    ctx.font='bold 13px sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.fillText('クリア ' + clearedCountOf(pr.id) + ' / ' + TASKS.length, x+bw/2, y+bh/2+24);
    ctx.restore();
    whoBtns.push({x:x,y:y,w:bw,h:bh,i:i});
  });
  ctx.restore();
}
// ずかん・全画面は canvas の外（HTML）にあるので、覆いかぶさらない。
