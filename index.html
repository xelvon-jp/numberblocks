<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- ホーム画面に追加して起動すると全画面（スタンドアロン）になり、
       Safari の「引っぱって更新」「左端スワイプで戻る」が無くなる。
       キャラのドラッグがブラウザの操作と取り合いにならないので、これが一番効く。 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ナンバーブロックス">
  <title>Number Blocks</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      background:#000; overflow:hidden;
      overscroll-behavior:none;          /* 引っぱって更新・端のバウンドを止める */
      touch-action:none;                 /* ピンチ／ダブルタップ拡大を止める */
      -webkit-user-select:none; user-select:none;
      -webkit-touch-callout:none;        /* 長押しの「画像を保存」メニューを止める */
      -webkit-tap-highlight-color:transparent;
    }
    body { position:fixed; top:0; left:0; }
    canvas {
      display:block; touch-action:none;
      -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    }
    /* バージョン表示。子どもの操作の邪魔にならないよう、
       数字パッドのさらに下の余白に、薄く小さく置く。 */
    #ver-btn {
      position:fixed; left:4px; z-index:30;
      bottom:calc(2px + env(safe-area-inset-bottom, 0px));
      padding:2px 6px; border:0; border-radius:6px;
      background:transparent; color:rgba(255,255,255,0.55);
      font-size:9px; font-family:sans-serif; letter-spacing:0.02em;
      cursor:pointer; -webkit-tap-highlight-color:transparent;
    }
    /* 長押しの進み具合。ボタンの上に出す。ボタン自身に出すと指で隠れるため。 */
    #ver-hint {
      position:fixed; left:6px; z-index:31; display:none;
      bottom:calc(80px + env(safe-area-inset-bottom, 0px));
      padding:6px 10px 7px; border-radius:9px;
      background:rgba(0,0,0,0.72); color:#fff;
      font-size:11px; font-weight:700; font-family:sans-serif;
      pointer-events:none;
    }
    #ver-hint.show { display:block; }
    #ver-hint .bar {
      margin-top:5px; width:104px; height:5px; border-radius:3px;
      background:rgba(255,255,255,0.25); overflow:hidden;
    }
    #ver-hint .bar i { display:block; height:100%; width:0; background:#fff; }
    /* 画面下の安全域（ホームバー）の高さを測るためだけの目印 */
    #safe-probe {
      position:fixed; left:0; bottom:0; width:0;
      height:env(safe-area-inset-bottom, 0px); pointer-events:none;
    }
    #fs-btn {
      position:fixed; top:6px; right:6px; z-index:20;
      width:36px; height:36px; border-radius:8px;
      background:rgba(0,0,0,0.45); border:1.5px solid rgba(255,255,255,0.35);
      color:white; font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.15s;
    }
    #fs-btn:hover { background:rgba(60,60,60,0.75); }
    /* ずかん（キャラメイク）へ行き来するボタン。フルスクリーンの左隣 */
    #zukan-btn {
      position:fixed; top:6px; right:48px; z-index:20;
      height:36px; padding:0 12px; border-radius:8px;
      background:rgba(0,0,0,0.45); border:1.5px solid rgba(255,255,255,0.35);
      color:white; font-size:13px; font-weight:700; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      text-decoration:none; transition:background 0.15s;
    }
    #zukan-btn:hover { background:rgba(60,60,60,0.75); }
    #factor-ui {
      display:none; position:fixed;
      bottom:0; left:0; right:0;
      height:calc(115px + env(safe-area-inset-bottom, 0px));
      background:rgba(0,0,0,0.18); z-index:10;
      padding:10px 16px 12px; flex-direction:column;
      align-items:center; gap:6px;
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    }
    #factor-ui.visible { display:flex; }
    #factor-num { font-size:28px; font-weight:bold; color:white; line-height:1; }
    #factor-range { width:min(340px,90vw); height:28px; cursor:pointer; accent-color:#f80; }
    /* ドリル（四則計算をひたすら解く）モードの設定パネル */
    #quiz-ui {
      display:none; position:fixed;
      bottom:0; left:0; right:0;
      height:calc(115px + env(safe-area-inset-bottom, 0px));
      background:rgba(0,0,0,0.18); z-index:10;
      padding:10px 16px 12px; flex-direction:column;
      align-items:center; gap:8px;
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    }
    #quiz-ui.visible { display:flex; }
    .quizRow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
    .quizRow label { color:white; font-size:13px; font-weight:700; }
    .opBtn {
      min-width:46px; height:38px; border-radius:9px; cursor:pointer;
      border:1.5px solid rgba(255,255,255,0.35); background:rgba(50,50,50,0.8);
      color:#bbb; font-size:19px; font-weight:700;
    }
    .opBtn.on { background:rgba(100,160,255,0.95); color:white; border-color:rgba(255,255,255,0.7); }
    #quiz-max { width:min(240px,52vw); height:28px; cursor:pointer; accent-color:#f80; }
    #quiz-limit {
      height:38px; padding:0 12px; border-radius:9px; cursor:pointer;
      border:1.5px solid rgba(255,255,255,0.35); background:rgba(50,50,50,0.8);
      color:#e9eefb; font-size:13px; font-weight:700;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe-probe"></div>
<button id="ver-btn" type="button" title="バージョン／再読み込み"></button>
<div id="ver-hint"><span>↻ よみこみ</span><div class="bar"><i></i></div></div>
<a id="zukan-btn" href="zukan.html" title="ずかん・キャラメイクへ">ずかん</a>
<button id="fs-btn" title="フルスクリーン">⛶</button>
<div id="factor-ui">
  <div id="factor-num">12</div>
  <input type="range" id="factor-range" min="1" max="100" value="12">
</div>
<div id="quiz-ui">
  <div class="quizRow">
    <button class="opBtn on" data-op="+"  title="たしざん">＋</button>
    <button class="opBtn on" data-op="-"  title="ひきざん">−</button>
    <button class="opBtn"    data-op="x"  title="かけざん">×</button>
    <button class="opBtn"    data-op="div" title="わりざん">÷</button>
  </div>
  <div class="quizRow">
    <label>かず 1〜<span id="quiz-max-val">10</span></label>
    <input type="range" id="quiz-max" min="3" max="100" value="10">
    <button id="quiz-limit">じかん：なし</button>
  </div>
</div>
<!-- キャラの見た目（かたち・色・顔・手足）は共通エンジンが担当する。
     キャラメイクツール（zukan.html）と同じファイルを読むので、
     あちらでデザインを直せばこのゲームにも自動的に反映される。
     ※ roundRect のポリフィルもこの中にある -->
<!-- 陽太さんの確定ぶん（自動生成）。エンジンより先に読ませる -->
<script>
// engine.js と overrides.js は index.html とは別ファイルなので、片方だけ古い
// キャッシュが残ると「新しい index.html が古い engine.js を呼ぶ」ことになり、
// 存在しない関数を呼んで画面が固まる。index.html の更新時刻を付けておけば、
// index.html が新しくなったときに必ず一緒に取り直される。
(function(){
  var v = encodeURIComponent(document.lastModified);
  document.write('<script src="overrides.js?v=' + v + '"><\/script>');
  document.write('<script src="engine.js?v=' + v + '"><\/script>');
})();
</script>
<script>
// ─── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let sw = 0, sh = 0;
function resize(){ sw = canvas.width = window.innerWidth; sh = canvas.height = window.innerHeight; }
// 画面をまわしたときは、並べ直しとオートスケールもやり直す
// （やらないと、たてで決めた大きさのまま よこ画面で はみ出す）
window.addEventListener('resize', ()=>{ resize(); updateTargets(); });
resize();

// ─── Constants / size ────────────────────────────────────────────────────────
// スマホは画面が狭いので、キャラを一回り小さくする（スマホの L ＝ PCの M 相当）。
// 端末の画面サイズで判定するので、ウィンドウを縮めただけのPCは対象外。
const SCR_MIN = Math.min(
  (window.screen && window.screen.width)  || window.innerWidth,
  (window.screen && window.screen.height) || window.innerHeight
);
const IS_PHONE = SCR_MIN < 500;
const BS_MAP = IS_PHONE ? { S:10, M:17, L:26 } : { S:20, M:40, L:60 };
// S/M/L は1マスの大きさを固定する。A（オート）は「全員を横に並べたときに
// 画面へ収まる大きさ」を自動で決める。カメラを引くイメージで、全員が同じ
// 1マスの大きさのままなので、大きい数ほど大きく見える関係が保たれる。
const SIZE_KEYS = ['S','M','L','A'];
let bsKey = 'A';              // 開いたときは A（オート）から始める
// A のときの初期値。キャラが出た時点で applyAutoScale が決め直す。
let BS = BS_MAP.L;
const GRAVITY  = 0.4;
const GH       = 50;
// 上部バーは2段。上段＝S/M/L・マジックミラー・（HTML側の）ずかん/全画面、
// 下段＝モードタブ。1段に詰めると幅が足りず重なるので段を分けている。
const TAB_ROW_H = 36;                        // モードタブ1行ぶんの高さ
const TOP_ROW_H = 44;                        // S/M/L とマジックミラーの行
const TAB_H     = TOP_ROW_H + TAB_ROW_H;     // 上部バー全体の高さ
const BAR_LEFT_RESERVE  = 116;               // 左に空ける幅（S/M/L/A ボタン）
const BAR_RIGHT_RESERVE = 116;               // 右に空ける幅（ずかん・全画面ボタン）
const FACTOR_H = 115;
const QUIZ_H   = 115;
const MAX_NUM = 1000;    // 出せる数の上限。101以上は板・棒・粒で組み立てる
const BIG_MAX_H = 400;   // 101以上のキャラの、画面上の高さの上限（S/M/L のとき）
const MAX_BLOCKS = 30;   // 同時に置けるキャラの数
const EDGE_MARGIN = 12;  // 画面の左右に空けておく幅（ブラウザのスワイプ対策）

function isLandscape(){ return sw > sh * 1.2; }
// 画面下のホームバーにボタンが隠れないよう、安全域ぶんを足しておく
const safeProbe = document.getElementById('safe-probe');
function safeBottom(){
  return safeProbe ? Math.round(safeProbe.getBoundingClientRect().height) : 0;
}
function getPadH(){ return (isLandscape() ? 56 : 110) + safeBottom(); }
// 画面下に出るパネルの高さ（モードで変わる）
function bottomPanelH(){
  if(mode==='factor') return FACTOR_H+safeBottom();
  if(mode==='quiz')   return QUIZ_H+safeBottom();
  if(mode==='clock')  return 26+safeBottom();   // とけいは文字盤を大きく見せたい
  return getPadH() + opBarH();                  // ＋−×÷ の段ぶんだけ高い
}
function calcFloor(){ return sh - GH - bottomPanelH() - 12; }

// ─── Colors ───────────────────────────────────────────────────────────────────
// キャラの配色（DIGIT_COLORS / RAINBOW など）と rgb() は共通エンジン側にある。
// ここで再定義すると同名の const がぶつかって動かなくなるので置かない。

// ─── Tabs & Size buttons ──────────────────────────────────────────────────────
// 合体したときにクイズを出すかどうか。OFF なら答えがすぐ出る（じゆうに積む遊び）。
// ドリルモードはクイズそのものなので、この設定の影響を受けない。
const QUIZ_ON_KEY = 'nbg.quizOn.v1';
let quizOn = true;
try{ const v=localStorage.getItem(QUIZ_ON_KEY); if(v!==null) quizOn = (v==='1'); }catch(e){}
function setQuizOn(v){
  quizOn = v;
  try{ localStorage.setItem(QUIZ_ON_KEY, v?'1':'0'); }catch(e){}
}

// ── おだい ──────────────────────────────────────────────────────────
// 使える数字をしばって、王道以外の道を探させる。順番に少しずつ難しくなる。
// どのお題も、ミラー（ふやす）と ×2・÷2 と合体だけで必ず作れる。
const TASK_LEVELS = [

  { name:'×2をつかう',   color:'#3f8fd0' },

const TASKS = [

  { lv:0, n:5,    use:[1], best:5, ref:5,      hint:'1を5こ' },

  { lv:1, n:64,   use:[2], best:5, ref:5,      hint:'×2を5かい' },
  { lv:1, n:27,   use:[3], best:5, ref:5,      hint:'3×3×3' },
  { lv:1, n:36,   use:[6], best:3, ref:3,      hint:'6×6' },
  // レベル3：10をつくる
  { lv:2, n:10,   use:[3,7], best:3, ref:3,    hint:'3+7' },
  { lv:2, n:30,   use:[4,7], best:5, ref:5,    hint:'7×4のあと' },
  { lv:2, n:50,   use:[3,7], best:6, ref:6,    hint:'10を5こ' },
  { lv:2, n:60,   use:[8,2], best:6, ref:8,    hint:'8+2から' },
  { lv:2, n:35,   use:[7,5], best:3, ref:3,    hint:'7×5' },
  { lv:2, n:45,   use:[9,5], best:3, ref:3,    hint:'9×5' },
  { lv:2, n:80,   use:[6,4], best:6, ref:6,    hint:'10を8こ' },
  { lv:2, n:70,   use:[9,1], best:6, ref:9,    hint:'9+1から' },
  { lv:2, n:90,   use:[9], best:5, ref:5,      hint:'9を10こ' },
  { lv:2, n:100,  use:[3,7], best:5, ref:5,    hint:'3+7は10' },
  // レベル4：100のかべ
  { lv:3, n:100,  use:[5], best:4, ref:4,      hint:'5×5から×2' },
  { lv:3, n:100,  use:[1], best:8, ref:8,      hint:'×2でのばして たす' },

  // レベル5：1000へ
  { lv:4, n:512,  use:[1], best:8, ref:8,      hint:'×2を9かい' },
  { lv:4, n:513,  use:[1], best:10, ref:10,      hint:'512のつぎ' },

  // レベル6：なぞとき
  { lv:5, n:1,    use:[7], best:3, ref:3,      hint:'おなじかずでわる' },

  { lv:5, n:99,   use:[10], best:7, ref:7,     hint:'100から1をひく' },
  { lv:5, n:101,  use:[10], best:7, ref:7,     hint:'100のつぎ' }
];
const TASK_KEY = 'nbg.task.v1';
let taskOn = false, taskIdx = 0, taskDone = false;
let taskCleared = {};   // どのおだいをクリアしたか（idx → true）
let taskLogs    = {};   // クリアしたときの手順（idx → [step,...]）
let taskLog     = [];   // いま解いている途中の手順
let stageOpen   = false;// ステージいちらんを出しているか
let stageDetail = -1;   // てじゅんを見せているステージ（-1＝出していない）
let stageBtns   = [];
let recOpen     = false;// きろくの せいり を出しているか
// 記録にさわるボタンは長押しでしか開かない（ひなたの誤操作よけ）
let stageHold   = null; // {val, i, t0, pid, rect}
const STAGE_HOLD_MS = 1200;
let recConfirm  = null; // たずねている最中の操作 {kind:'level'|'all'|'move', lv}
let hintOn      = false;// ヒントを開いているか（おだいを変えると閉じる）
let taskStartT  = 0;    // このおだいを始めた時こく
let hintShownAt = 0;    // ヒントボタンが出てきた時こく（ふわっと出すため）
// ヒントは最初から見せない。しばらく解けていないときだけ、そっと出す。
// 「時間がかかっている」か「さいたんよりだいぶ手数がかさんでいる」のどちらか。
const HINT_AFTER_MS = 60000;
const HINT_AFTER_MOVES = 4;
function hintReady(){
  if(!taskActive() || taskDone) return false;
  if(hintShownAt) return true;   // 一度出したら、そのおだいのあいだは引っこめない
  const t = currentTask();
  if(taskLog.length >= (t.best||0) + HINT_AFTER_MOVES) return true;
  return taskStartT > 0 && (Date.now() - taskStartT) > HINT_AFTER_MS;
}
// ── だれが遊んでいるか ────────────────────────────────────────────
// ひなたの記録と、パパの下見（テストプレイ）の記録を混ぜない。
// クリア状況・てじゅん・いま何問めかを、ひとりずつ別に持つ。
const PROFILES = [
  { id:'hinata', name:'ひなた', color:'#3f8fd0' },
  { id:'papa',   name:'パパ',   color:'#d9813a' }
];
let profileIdx = 0;
function profile(){ return PROFILES[profileIdx]; }
function emptyRec(){ return { idx:0, cleared:{}, logs:{} }; }
let taskStore = { hinata:emptyRec(), papa:emptyRec() };

try{
  const raw = localStorage.getItem(TASK_KEY);
  if(raw){
    const v = JSON.parse(raw);
    taskOn = !!v.on;
    if(v.v === 2 && v.p){
      for(const pr of PROFILES){
        const r = v.p[pr.id];
        if(r) taskStore[pr.id] = { idx:r.idx|0, cleared:r.cleared||{}, logs:r.logs||{} };
      }
      const i = PROFILES.findIndex(pr=>pr.id === v.cur);
      if(i >= 0) profileIdx = i;
    } else {
      // ひとりぶんしか無かったころの記録。ひなたのものとして引き継ぐ。
      const cl = {};
      if(v.cleared) for(const k of v.cleared) cl[k] = true;
      taskStore.hinata = { idx:v.idx|0, cleared:cl, logs:v.logs||{} };
    }
  }
}catch(e){}

// いま選んでいる子の記録を、遊び中に使う変数へつなぎ直す。
// （profileIdx は上でパパに固定してある）
// 中身は同じオブジェクトを指すので、書き込みはそのまま記録に残る。
function loadProfileState(){
  const r = taskStore[profile().id] || (taskStore[profile().id] = emptyRec());
  taskIdx = Math.min(TASKS.length-1, r.idx|0);
  taskCleared = r.cleared;
  taskLogs    = r.logs;
}
loadProfileState();

function saveTask(){
  const r = taskStore[profile().id];
  r.idx = taskIdx; r.cleared = taskCleared; r.logs = taskLogs;
  try{
    localStorage.setItem(TASK_KEY, JSON.stringify({
      v:2, on:taskOn, cur:profile().id, p:taskStore
    }));
  }catch(e){}
}

function setProfile(i){
  if(i === profileIdx || !PROFILES[i]) return;
  saveTask();                 // いままでの子の記録をしまう
  profileIdx = i;
  loadProfileState();
  taskDone = false; taskLog = []; winFx = null;
  hintOn = false; hintShownAt = 0; taskStartT = Date.now();
  blocks = []; puzzle = null; clearUndo();
  stageDetail = -1;
  saveTask(); updateTargets();
}
// ── ほめことば ───────────────────────────────────────────────────
// 3つ同時には出さない。上から順に、あてはまった1つだけを出す。
//   とってもじょうず！ … もうひとりの記録に並んだ／こえた
//   じょうず！         … おてほん（＋と×だけで作る最短）＋2手 いない
//   ちぢんだ！         … まえの自分より短くできた
const REF_SLACK = 2;
function otherProfileId(){ return PROFILES[(profileIdx+1) % PROFILES.length].id; }
function recordOf(id, idx){
  const r = taskStore[id]; const lg = r && r.logs[idx];
  return lg ? lg.length : null;
}
function judgeClear(idx, moves, prevOwn){
  const t = TASKS[idx];
  const other = otherProfileId(), o = recordOf(other, idx);
  if(o !== null && moves <= o)              return { text:'とってもじょうず！', color:'#c0398a', big:true };
  if(moves <= (t.ref||t.best) + REF_SLACK)  return { text:'じょうず！',        color:'#d69500' };
  if(prevOwn !== null && moves < prevOwn)   return { text:'ちぢんだ！',        color:'#2f7ac0' };
  return null;
}
function isNice(idx){                 // ★をつけるかどうか（おてほん基準）
  const lg = taskLogs[idx], t = TASKS[idx];
  return !!lg && lg.length <= (t.ref||t.best) + REF_SLACK;
}

// ── だれが あそぶ？ ──────────────────────────────────────────────
// 顔やWatchでは人を見分けられない（Face IDは本人1人ぶんしか登録できず、
// WebからWatchを見る口も無い）。なので判定ではなく、既定値で守る。
//
//   あいまいなときは、かならずパパ側に倒す。
//
// パパの記録は下見なので、まちがって混ざっても失うものは無い。
// ひなたの記録に書きこめるのは「ひなたを押してから、続けて遊んでいるあいだ」
// だけにしておけば、パパが気づかずひなたの記録を汚すことは起きない。
const PAPA_IDX = PROFILES.findIndex(pr => pr.id === 'papa');
const KID_IDLE_MS = 5*60*1000;   // ひなたのまま5分ほうっておいたら、パパに戻す
let whoOpen = false, whoBtns = [];
let lastTouchAt = Date.now();
let askOnListClose = false;      // きろくをのぞいたら、閉じるときにまた聞く
function noteSeen(){ lastTouchAt = Date.now(); }

// 開き直したときは、前回だれだったかに関わらず、かならずパパから始める
profileIdx = (PAPA_IDX >= 0) ? PAPA_IDX : 0;
loadProfileState();
whoOpen = taskOn;

// ひなたのまま放っておかれたら、そっとパパに戻して聞き直す
function guardKidProfile(){
  if(whoOpen || profileIdx === PAPA_IDX) return;
  if(Date.now() - lastTouchAt < KID_IDLE_MS) return;
  setProfile(PAPA_IDX);
  whoOpen = true; setWhoOverlay(true);
}

// ── ゆびの おおきさ ──────────────────────────────────────────────
// 大人と4歳では、ガラスに触れる面の大きさがちがうはず。
// いつか自動で見分けられるか判断するために、静かにためておく。
const TOUCH_KEY = 'nbg.touch.v1';
const TOUCH_BINS = 12, TOUCH_BIN_W = 2.5;   // 0〜30px を 12 に分ける
function emptyTouch(){ return { n:0, sum:0, hist:new Array(TOUCH_BINS).fill(0) }; }
let touchStats = { hinata:emptyTouch(), papa:emptyTouch() };
try{
  const raw = localStorage.getItem(TOUCH_KEY);
  if(raw){
    const v = JSON.parse(raw);
    for(const pr of PROFILES){
      const t = v[pr.id];
      if(t && t.hist && t.hist.length===TOUCH_BINS) touchStats[pr.id] = t;
    }
  }
}catch(e){}
function saveTouchStats(){
  try{ localStorage.setItem(TOUCH_KEY, JSON.stringify(touchStats)); }catch(e){}
}
function noteTouchSize(r){
  if(!(r > 0)) return;
  const st = touchStats[profile().id]; if(!st) return;
  st.n++; st.sum += r;
  st.hist[Math.max(0, Math.min(TOUCH_BINS-1, Math.floor(r/TOUCH_BIN_W)))]++;
  if(st.n % 10 === 0) saveTouchStats();
}

function clearedCountOf(id){
  const r = taskStore[id]; return r ? Object.keys(r.cleared).length : 0;
}
// そのレベルを何問クリアしているか
function levelCountOf(id, lv){
  const r = taskStore[id]; if(!r) return 0;
  let k = 0;
  TASKS.forEach((t,i)=>{ if(t.lv===lv && r.cleared[i]) k++; });
  return k;
}
function levelSize(lv){ return TASKS.filter(t=>t.lv===lv).length; }

// ── 記録の整理 ───────────────────────────────────────────────────
// レベルごとに消す／ぜんぶ消す／もうひとりへ移す。
// 消すのは取り返しがつかないので、かならず一度たずねてから実行する。
function clearLevelRecords(id, lv){
  const r = taskStore[id]; if(!r) return;
  TASKS.forEach((t,i)=>{
    if(t.lv===lv){ delete r.cleared[i]; delete r.logs[i]; }
  });
  afterRecordEdit();
}
function clearAllRecords(id){
  if(!taskStore[id]) return;
  taskStore[id] = emptyRec();
  afterRecordEdit();
}
// from の記録を to へ移して、from はまっさらにする。
// 同じおだいが両方にあるときは、手数の短いほうを残す。
function moveRecords(from, to){
  const a = taskStore[from], b = taskStore[to];
  if(!a || !b) return;
  for(const k in a.cleared){
    b.cleared[k] = true;
    const la = a.logs[k], lb = b.logs[k];
    if(la && (!lb || la.length < lb.length)) b.logs[k] = la;
  }
  if(a.idx && !b.idx) b.idx = a.idx;
  taskStore[from] = emptyRec();
  afterRecordEdit();
}
function afterRecordEdit(){
  loadProfileState();          // いじった記録をつなぎ直す
  taskDone = false; taskLog = []; winFx = null;
  hintOn = false; hintShownAt = 0; taskStartT = Date.now();
  blocks = []; puzzle = null; clearUndo();
  stageDetail = -1; recConfirm = null;
  saveTask(); updateTargets();
}
function currentTask(){ return TASKS[Math.min(taskIdx, TASKS.length-1)]; }
function taskActive(){ return taskOn && mode!=='factor' && mode!=='quiz' && mode!=='clock'; }
// そのおだいを最初から始める
function startTask(i){
  taskIdx = Math.max(0, Math.min(TASKS.length-1, i));
  taskDone = false; taskLog = []; winFx = null;
  hintOn = false; hintShownAt = 0; taskStartT = Date.now();
  blocks = []; puzzle = null; clearUndo();
  stageOpen = false; stageDetail = -1;
  saveTask(); updateTargets();
}
function nextTask(){ startTask((taskIdx + 1) % TASKS.length); }

// ── てじゅんの記録 ────────────────────────────────────────────────
// 「どうやって作ったか」を1手ずつ残しておき、あとから見られるようにする。
const STEP_MAX = 60;
function logStep(k, a, b, r){
  if(!taskActive() || taskDone) return;
  if(taskLog.length >= STEP_MAX) return;
  taskLog.push({k:k, a:a, b:b, r:r});
}
function stepText(st){
  const sym = {'+':'＋','-':'−','x':'×','div':'÷'}[st.k];
  if(sym) return st.a + ' ' + sym + ' ' + st.b + ' ＝ ' + st.r;
  if(st.k==='new')    return st.a + ' をだした';
  if(st.k==='double') return st.a + ' を ×2 → ' + st.r;
  if(st.k==='half')   return st.a + ' を ÷2 → ' + st.r;
  if(st.k==='copy')   return st.a + ' をコピー';
  if(st.k==='home')   return st.a + ' をおうちへ';
  return '';
}

let mode = '+';
// ＋ − × ÷ は「モード」ではなく「いま使う演算子」。画面左のたてならびに置く。
// タブ側は「けいさん／因数／ドリル／とけい」の4つだけにして広く使う。
const CALC_OPS  = ['+','-','x','div'];
const OP_LABEL  = {'+':'＋','-':'−','x':'×','div':'÷'};
function isCalcMode(m){ return CALC_OPS.indexOf(m || mode) >= 0; }
let lastOp = '+';   // けいさんタブに戻ったときに選び直す演算子
const TAB_DEFS = [
  {label:'けいさん', val:'calc'}, {label:'因数', val:'factor'},
  {label:'ドリル', val:'quiz'},   {label:'とけい', val:'clock'}
];
let tabBtns = [], sizeBtns = [], toggleBtns = [], opBarBtns = [];

// ─── もどす（アンドゥ）────────────────────────────────────────────
// 「まちがえた！」をすぐ取り消せるように、直前の場面を3つぶん覚えておく。
// 覚えているのは、そのとき画面にいたキャラの数と位置だけ。
const UNDO_MAX = 3;
let undoStack = [];
function pushUndo(){
  undoStack.push({
    items: blocks.map(b=>({ n:b.num, x:b.x, y:b.y })),
    logLen: taskLog.length,
    done: taskDone
  });
  if(undoStack.length > UNDO_MAX) undoStack.shift();   // 古いものから捨てる
}
function clearUndo(){ undoStack = []; }
function canUndo(){ return undoStack.length > 0; }
function doUndo(){
  const snap = undoStack.pop(); if(!snap) return;
  blocks = snap.items.map(it=>{
    const b = new NumberBlock(it.n, it.x, it.y);
    b.targetX = it.x; b.birth = 1;
    return b;
  });
  if(taskLog.length > snap.logLen) taskLog.length = snap.logLen;
  taskDone = snap.done;
  puzzle = null; dragBlock = null; dragPtr = null; dragPointers = {};
  for(let i=0;i<12;i++) fxParticles.push(new Particle(sw/2, calcFloor()-40));
  updateTargets();
}

// ─── 演算子バー（数字キーのすぐ上）───────────────────────────────────
// 数を出すキーと同じ指の届く場所に置く。選んでいるものだけを
// 大きく・明るくして、いまどの計算をしているかがひと目で分かるようにする。
function railOn(){ return isCalcMode(); }
function opBarH(){ return railOn() ? (isLandscape() ? 40 : 54) : 0; }
// 遊ぶ場所の左端（いまは演算子バーが下にあるので、ふつうの余白のまま）
function playLeft(){ return EDGE_MARGIN; }
const UNDO_W = 74;   // 「もどす」ボタンの幅（演算子の右どなり）
function opBarRects(){
  const h = opBarH(); if(!h) return [];
  const y = sh - getPadH() - h;
  const n = CALC_OPS.length, gap = 8, pad = 6;
  const w = (sw - pad*2 - gap*n - UNDO_W) / n;
  const list = CALC_OPS.map((op,i)=>({ op:op, x:pad + i*(w+gap), y:y+4, w:w, h:h-9 }));
  list.push({ op:'undo', x:pad + n*(w+gap), y:y+4, w:UNDO_W, h:h-9 });
  return list;
}

// 「もどす」ボタン。あと何回もどせるかを丸で見せる（読めなくても分かる）
function drawUndoBtn(ctx, r){
  const ok = canUndo();
  ctx.save();
  ctx.fillStyle = ok ? 'rgba(255,196,60,0.97)' : 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 11); ctx.fill();
  ctx.strokeStyle = ok ? 'rgba(180,120,10,0.55)' : 'rgba(70,90,120,0.22)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 11); ctx.stroke();
  ctx.fillStyle = ok ? '#5a3c00' : 'rgba(90,106,132,0.5)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 13px sans-serif';
  ctx.fillText('↩ もどす', r.x + r.w/2, r.y + r.h/2 - 7);
  // 残り回数の丸
  const dr = 3.5, dg = 11, cy = r.y + r.h - 12;
  const x0 = r.x + r.w/2 - dg*(UNDO_MAX-1)/2;
  for(let i=0;i<UNDO_MAX;i++){
    ctx.beginPath(); ctx.arc(x0 + i*dg, cy, dr, 0, Math.PI*2);
    ctx.fillStyle = (i < undoStack.length)
      ? (ok ? '#5a3c00' : '#8a97a8') : 'rgba(0,0,0,0.13)';
    ctx.fill();
  }
  ctx.restore();
}
function drawOpBar(ctx, t){
  opBarBtns = [];
  const rects = opBarRects(); if(!rects.length) return;
  const pulse = 0.5+0.5*Math.sin(t*0.005);
  ctx.save();
  // 数字キーの帯と地続きに見えるよう、うすい下地を敷く
  ctx.fillStyle='rgba(0,0,0,0.10)';
  ctx.fillRect(0, rects[0].y-4, sw, opBarH());
  for(const r of rects){
    if(r.op === 'undo'){ drawUndoBtn(ctx, r); opBarBtns.push({x:r.x-3,y:r.y-4,w:r.w+6,h:r.h+8,op:'undo'}); continue; }
    const on = (r.op === mode);
    ctx.save();
    if(on){
      ctx.shadowColor = 'rgba(60,130,255,'+(0.55+0.3*pulse)+')';
      ctx.shadowBlur  = 14;
      ctx.fillStyle   = 'rgba(45,120,250,0.98)';
    } else {
      ctx.fillStyle   = 'rgba(255,255,255,0.80)';
    }
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 11); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = on ? 'rgba(255,255,255,0.95)' : 'rgba(70,90,120,0.35)';
    ctx.lineWidth   = on ? 3 : 1.5;
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 11); ctx.stroke();
    ctx.fillStyle = on ? '#fff' : '#5a6a84';
    ctx.font = 'bold ' + (on ? 28 : 21) + 'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(OP_LABEL[r.op], r.x + r.w/2, r.y + r.h/2 + 1);
    ctx.restore();
    opBarBtns.push({x:r.x-3, y:r.y-4, w:r.w+6, h:r.h+8, op:r.op});
  }
  ctx.restore();
}

function drawTabsAndUI(ctx){
  // ＋−×÷ の段を出さないモードでは、当たり判定も消しておく
  // （残っていると、ドリル中にそこを触って計算モードへ飛んでしまう）
  if(!railOn()) opBarBtns = [];
  drawSizeButtons(ctx);
  drawQuizToggle(ctx);
  drawModeTabs(ctx);
  // おだい中は、いまだれの記録に残るのかを細い帯で常に見せる
  if(taskActive()){
    ctx.save();
    ctx.fillStyle = profile().color;
    ctx.fillRect(0, TAB_H-3, sw, 3);
    ctx.restore();
  }
  // ミラーはタブの位置を使って置くので、タブを並べたあとに描く。
  // 床のキャラに隠れないよう、実際の描画はメインループ側から呼ぶ。
}

// 上段左：キャラの大きさ S/M/L
function drawSizeButtons(ctx){
  const szW=26, szH=30, szY=Math.round((TOP_ROW_H-szH)/2);
  sizeBtns = [];
  SIZE_KEYS.forEach((k,i)=>{
    const bx=4+i*(szW+2), by=szY, active=bsKey===k;
    ctx.save();
    ctx.fillStyle=active?'rgba(255,180,0,0.95)':'rgba(82,92,110,0.95)';
    ctx.beginPath(); ctx.roundRect(bx,by,szW,szH,6); ctx.fill();
