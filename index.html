<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- ホーム画面に追加して起動すると全画面（スタンドアロン）になり、
       Safari の「引っぱって更新」「左端スワイプで戻る」が無くなる。
       キャラのドラッグがブラウザの操作と取り合いにならないので、これが一番効く。 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ナンバーブロックス">
  <title>Number Blocks</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      background:#000; overflow:hidden;
      overscroll-behavior:none;          /* 引っぱって更新・端のバウンドを止める */
      touch-action:none;                 /* ピンチ／ダブルタップ拡大を止める */
      -webkit-user-select:none; user-select:none;
      -webkit-touch-callout:none;        /* 長押しの「画像を保存」メニューを止める */
      -webkit-tap-highlight-color:transparent;
    }
    body { position:fixed; top:0; left:0; }
    canvas {
      display:block; touch-action:none;
      -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    }
    /* 画面下の安全域（ホームバー）の高さを測るためだけの目印 */
    #safe-probe {
      position:fixed; left:0; bottom:0; width:0;
      height:env(safe-area-inset-bottom, 0px); pointer-events:none;
    }
    #fs-btn {
      position:fixed; top:6px; right:6px; z-index:20;
      width:36px; height:36px; border-radius:8px;
      background:rgba(0,0,0,0.45); border:1.5px solid rgba(255,255,255,0.35);
      color:white; font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.15s;
    }
    #fs-btn:hover { background:rgba(60,60,60,0.75); }
    /* ずかん（キャラメイク）へ行き来するボタン。フルスクリーンの左隣 */
    #zukan-btn {
      position:fixed; top:6px; right:48px; z-index:20;
      height:36px; padding:0 12px; border-radius:8px;
      background:rgba(0,0,0,0.45); border:1.5px solid rgba(255,255,255,0.35);
      color:white; font-size:13px; font-weight:700; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      text-decoration:none; transition:background 0.15s;
    }
    #zukan-btn:hover { background:rgba(60,60,60,0.75); }
    #factor-ui {
      display:none; position:fixed;
      bottom:0; left:0; right:0;
      height:calc(115px + env(safe-area-inset-bottom, 0px));
      background:rgba(0,0,0,0.18); z-index:10;
      padding:10px 16px 12px; flex-direction:column;
      align-items:center; gap:6px;
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    }
    #factor-ui.visible { display:flex; }
    #factor-num { font-size:28px; font-weight:bold; color:white; line-height:1; }
    #factor-range { width:min(340px,90vw); height:28px; cursor:pointer; accent-color:#f80; }
    /* ドリル（四則計算をひたすら解く）モードの設定パネル */
    #quiz-ui {
      display:none; position:fixed;
      bottom:0; left:0; right:0;
      height:calc(115px + env(safe-area-inset-bottom, 0px));
      background:rgba(0,0,0,0.18); z-index:10;
      padding:10px 16px 12px; flex-direction:column;
      align-items:center; gap:8px;
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    }
    #quiz-ui.visible { display:flex; }
    .quizRow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
    .quizRow label { color:white; font-size:13px; font-weight:700; }
    .opBtn {
      min-width:46px; height:38px; border-radius:9px; cursor:pointer;
      border:1.5px solid rgba(255,255,255,0.35); background:rgba(50,50,50,0.8);
      color:#bbb; font-size:19px; font-weight:700;
    }
    .opBtn.on { background:rgba(100,160,255,0.95); color:white; border-color:rgba(255,255,255,0.7); }
    #quiz-max { width:min(240px,52vw); height:28px; cursor:pointer; accent-color:#f80; }
    #quiz-limit {
      height:38px; padding:0 12px; border-radius:9px; cursor:pointer;
      border:1.5px solid rgba(255,255,255,0.35); background:rgba(50,50,50,0.8);
      color:#e9eefb; font-size:13px; font-weight:700;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe-probe"></div>
<a id="zukan-btn" href="zukan.html" title="ずかん・キャラメイクへ">ずかん</a>
<button id="fs-btn" title="フルスクリーン">⛶</button>
<div id="factor-ui">
  <div id="factor-num">12</div>
  <input type="range" id="factor-range" min="1" max="100" value="12">
</div>
<div id="quiz-ui">
  <div class="quizRow">
    <button class="opBtn on" data-op="+"  title="たしざん">＋</button>
    <button class="opBtn on" data-op="-"  title="ひきざん">−</button>
    <button class="opBtn"    data-op="x"  title="かけざん">×</button>
    <button class="opBtn"    data-op="div" title="わりざん">÷</button>
  </div>
  <div class="quizRow">
    <label>かず 1〜<span id="quiz-max-val">10</span></label>
    <input type="range" id="quiz-max" min="3" max="100" value="10">
    <button id="quiz-limit">じかん：なし</button>
  </div>
</div>
<!-- キャラの見た目（かたち・色・顔・手足）は共通エンジンが担当する。
     キャラメイクツール（zukan.html）と同じファイルを読むので、
     あちらでデザインを直せばこのゲームにも自動的に反映される。
     ※ roundRect のポリフィルもこの中にある -->
<!-- 陽太さんの確定ぶん（自動生成）。エンジンより先に読ませる -->
<script src="overrides.js"></script>
<script src="engine.js"></script>
<script>
// ─── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let sw = 0, sh = 0;
function resize(){ sw = canvas.width = window.innerWidth; sh = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// ─── Constants / size ────────────────────────────────────────────────────────
// スマホは画面が狭いので、キャラを一回り小さくする（スマホの L ＝ PCの M 相当）。
// 端末の画面サイズで判定するので、ウィンドウを縮めただけのPCは対象外。
const SCR_MIN = Math.min(
  (window.screen && window.screen.width)  || window.innerWidth,
  (window.screen && window.screen.height) || window.innerHeight
);
const IS_PHONE = SCR_MIN < 500;
const BS_MAP = IS_PHONE ? { S:10, M:17, L:26 } : { S:20, M:40, L:60 };
let bsKey = 'M';
let BS = BS_MAP[bsKey];
const GRAVITY  = 0.4;
const GH       = 50;
// 上部バーは2段。上段＝S/M/L・マジックミラー・（HTML側の）ずかん/全画面、
// 下段＝モードタブ。1段に詰めると幅が足りず重なるので段を分けている。
const TAB_ROW_H = 36;                        // モードタブ1行ぶんの高さ
const TOP_ROW_H = 44;                        // S/M/L とマジックミラーの行
const TAB_H     = TOP_ROW_H + TAB_ROW_H;     // 上部バー全体の高さ
const BAR_LEFT_RESERVE  = 92;                // 左に空ける幅（S/M/Lボタン）
const BAR_RIGHT_RESERVE = 116;               // 右に空ける幅（ずかん・全画面ボタン）
const FACTOR_H = 115;
const QUIZ_H   = 115;
const MAX_BLOCKS = 30;   // 同時に置けるキャラの数
const EDGE_MARGIN = 12;  // 画面の左右に空けておく幅（ブラウザのスワイプ対策）

function isLandscape(){ return sw > sh * 1.2; }
// 画面下のホームバーにボタンが隠れないよう、安全域ぶんを足しておく
const safeProbe = document.getElementById('safe-probe');
function safeBottom(){
  return safeProbe ? Math.round(safeProbe.getBoundingClientRect().height) : 0;
}
function getPadH(){ return (isLandscape() ? 56 : 110) + safeBottom(); }
// 画面下に出るパネルの高さ（モードで変わる）
function bottomPanelH(){ return mode==='factor' ? FACTOR_H+safeBottom() : mode==='quiz' ? QUIZ_H+safeBottom() : getPadH(); }
function calcFloor(){ return sh - GH - bottomPanelH() - 12; }

// ─── Colors ───────────────────────────────────────────────────────────────────
// キャラの配色（DIGIT_COLORS / RAINBOW など）と rgb() は共通エンジン側にある。
// ここで再定義すると同名の const がぶつかって動かなくなるので置かない。

// ─── Tabs & Size buttons ──────────────────────────────────────────────────────
// 合体したときにクイズを出すかどうか。OFF なら答えがすぐ出る（じゆうに積む遊び）。
// ドリルモードはクイズそのものなので、この設定の影響を受けない。
const QUIZ_ON_KEY = 'nbg.quizOn.v1';
let quizOn = true;
try{ const v=localStorage.getItem(QUIZ_ON_KEY); if(v!==null) quizOn = (v==='1'); }catch(e){}
function setQuizOn(v){
  quizOn = v;
  try{ localStorage.setItem(QUIZ_ON_KEY, v?'1':'0'); }catch(e){}
}

let mode = '+';
const TAB_DEFS = [
  {label:'+', val:'+'}, {label:'−', val:'-'},
  {label:'×', val:'x'}, {label:'÷', val:'div'},
  {label:'因数', val:'factor'}, {label:'ドリル', val:'quiz'}
];
let tabBtns = [], sizeBtns = [], toggleBtns = [];

function drawTabsAndUI(ctx){
  drawSizeButtons(ctx);
  drawQuizToggle(ctx);
  drawModeTabs(ctx);
  // ミラーはタブの位置を使って置くので、タブを並べたあとに描く。
  // 床のキャラに隠れないよう、実際の描画はメインループ側から呼ぶ。
}

// 上段左：キャラの大きさ S/M/L
function drawSizeButtons(ctx){
  const szW=28, szH=30, szY=Math.round((TOP_ROW_H-szH)/2);
  sizeBtns = [];
  ['S','M','L'].forEach((k,i)=>{
    const bx=4+i*(szW+2), by=szY, active=bsKey===k;
    ctx.save();
    ctx.fillStyle=active?'rgba(255,180,0,0.95)':'rgba(82,92,110,0.95)';
    ctx.beginPath(); ctx.roundRect(bx,by,szW,szH,6); ctx.fill();
    ctx.strokeStyle=active?'rgba(255,255,255,0.75)':'rgba(255,255,255,0.35)';
    ctx.lineWidth=1.5; ctx.beginPath(); ctx.roundRect(bx,by,szW,szH,6); ctx.stroke();
    ctx.fillStyle=active?'#333':'#eef2f8'; ctx.font='bold 13px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(k,bx+szW/2,by+szH/2);
    ctx.restore();
    sizeBtns.push({x:bx,y:by,w:szW,h:szH,val:k});
  });
}

// ─── マジックミラー ───────────────────────────────────────────────────────────
// 上段の中央に置く。ここへキャラをドラッグして離すと、そのキャラが複製される。
// 因数モード・ドリルモードではキャラを自由に動かさないので出さない。
let mirrorFlash = 0;      // 複製した瞬間の光り（1→0へ減衰）
let fxParticles = [];     // 複製したときの紙吹雪
let mirrorRing  = 0;      // 複製した瞬間に広がる光の輪（0→1）
let mirrorAfter = 0;      // 指を離したあとの見せ場。指が無いのでよく見える
let mirrorHandoff = 0;    // 鏡の中の像 → 実体へのバトンタッチ（すぐ消える）
let homeAfter   = 0;      // おうちも同じ
let mirrorReflect = 0;    // 鏡に映るキャラの出かた（0→1）
let mirrorReflectNum = 0; // 今どのキャラが映っているか

function getMirrorRect(){
  if(mode==='factor'||mode==='quiz') return null;
  const w=51, h=60;                       // 以前の1.5倍
  // 「ドリル」タブの真下に置く。画面の右端ぴったりだと
  // ブラウザの端スワイプに取られるので、少し内側で止める。
  const lastTab = tabBtns.length ? tabBtns[tabBtns.length-1] : null;
  const cx = lastTab ? lastTab.x + lastTab.w/2 : sw - EDGE_MARGIN - w/2;
  const x  = Math.min(cx - w/2, sw - EDGE_MARGIN - w);
  return { x:Math.round(Math.max(EDGE_MARGIN, x)), y:TAB_H + 6, w:w, h:h };
}

// ドラッグ中の指／マウスがミラーの上にあるか。小さいので判定は広めにとる。
// 指と手のひらは「触れた点より下」を覆う。判定を下へ大きく伸ばしておくと、
// 本体を直接押さえなくても手前で反応するので、演出が手に隠れなくなる。
// （反応したあとはさらに広げる。端で「入った・出た」を繰り返さないため）
function inDropZone(m,x,y,grow){
  return ptInRect(x, y, m.x-58-grow, m.y-12, m.w+116+grow*2, m.h+200+grow);
}
function isOverMirror(x,y){
  const m=getMirrorRect(); if(!m) return false;
  return inDropZone(m, x, y, mirrorReflect>0.5 ? 26 : 0);
}

// 上がアーチ型の鏡のかたち
function mirrorPath(ctx,x,y,w,h){
  const rad=w/2, r=5;
  ctx.beginPath();
  ctx.moveTo(x, y+h-r);
  ctx.lineTo(x, y+rad);
  ctx.arc(x+rad, y+rad, rad, Math.PI, 0);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.closePath();
}

// ─── おうち ───────────────────────────────────────────────────────────────
// ミラーと対になる場所。ここへキャラをドラッグすると、手を振って帰っていく。
// 「消す」ではなく「おうちに帰る」なので、子どもにとって嫌な操作にならない。
let homeFlash = 0;     // 帰った瞬間の光り
let homeOpen  = 0;     // 扉の開きぐあい（0→1）
let homeNum   = 0;     // 今どのキャラが入ろうとしているか

function getHomeRect(){
  if(mode==='factor'||mode==='quiz') return null;
  const w=51, h=60;
  const firstTab = tabBtns.length ? tabBtns[0] : null;
  const cx = firstTab ? firstTab.x + firstTab.w/2 : EDGE_MARGIN + w/2;
  const x  = Math.max(EDGE_MARGIN, cx - w/2);
  return { x:Math.round(Math.min(x, sw-EDGE_MARGIN-w)), y:TAB_H + 6, w:w, h:h };
}

function isOverHome(x,y){
  const m=getHomeRect(); if(!m) return false;
  return inDropZone(m, x, y, homeOpen>0.5 ? 26 : 0);
}

// キャラをおうちへ帰す（＝画面から消す）
function sendHome(b){
  const m=getHomeRect(); if(!m) return;
  blocks = blocks.filter(x=>x!==b);
  homeNum = b.num; homeFlash = 1; homeAfter = 1;   // 離したあとに扉が閉じるまでを見せる
  const px=m.x+m.w/2, py=m.y+m.h*0.7;
  for(let i=0;i<16;i++) fxParticles.push(new Particle(px,py));
  updateTargets();
}

function drawHome(ctx, t){
  const m=getHomeRect(); if(!m) return;
  if(homeFlash>0) homeFlash=Math.max(0, homeFlash-0.04);
  const hover = !!(dragBlock && dragPtr && isOverHome(dragPtr.x, dragPtr.y));
  if(hover) homeNum = dragBlock.num;
  homeOpen += ((hover?1:0) - homeOpen) * 0.25;
  if(homeOpen < 0.02) homeOpen = 0;
  if(homeAfter>0) homeAfter = Math.max(0, homeAfter-0.018);
  const show  = Math.max(homeOpen, homeAfter);

  const beat  = 0.5+0.5*Math.sin(t*0.013);
  const swell = 1 + show*(0.92 + 0.10*beat) + 0.13*homeFlash;
  const ease  = show*show*(3-2*show);

  ctx.save();
  if(swell !== 1){
    const cx0=m.x+m.w/2, cy0=m.y+m.h/2;
    const hw=m.w*swell/2, hh=m.h*swell/2;
    const cx=Math.min(Math.max(cx0, EDGE_MARGIN+hw), sw-EDGE_MARGIN-hw);
    const cy=Math.max(cy0, TAB_H+6+hh);
    ctx.translate(cx, cy); ctx.scale(swell, swell); ctx.translate(-cx0, -cy0);
  }
  const glow = Math.max(homeFlash, show);
  if(glow>0){
    ctx.shadowColor='rgba(255,215,140,'+(0.55+glow*0.45)+')';
    ctx.shadowBlur=14+glow*(16+14*beat);
  }

  const wallY = m.y + m.h*0.38, wallH = m.h - (wallY-m.y);
  // 屋根
  ctx.fillStyle='#e0685f';
  ctx.beginPath();
  ctx.moveTo(m.x+m.w/2, m.y+2);
  ctx.lineTo(m.x+m.w-1, wallY+3);
  ctx.lineTo(m.x+1,     wallY+3);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  // 壁
  ctx.fillStyle='#f6ead6';
  ctx.beginPath(); ctx.roundRect(m.x+m.w*0.10, wallY, m.w*0.80, wallH-2, 4); ctx.fill();
  ctx.strokeStyle='#c9ab85'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(m.x+m.w*0.10, wallY, m.w*0.80, wallH-2, 4); ctx.stroke();

  // 扉。近づけると開いて、中のあかりが見える
  const dW=m.w*0.42, dH=wallH*0.72;
  const dX=m.x+m.w/2-dW/2, dY=m.y+m.h-2-dH;
  ctx.fillStyle='#4a3b2c';
  ctx.beginPath(); ctx.roundRect(dX,dY,dW,dH,3); ctx.fill();
  if(ease>0.02){
    const gl=ctx.createLinearGradient(dX,dY+dH,dX,dY);
    gl.addColorStop(0,'rgba(255,214,120,'+(0.95*ease)+')');
    gl.addColorStop(1,'rgba(255,240,200,'+(0.55*ease)+')');
    ctx.fillStyle=gl;
    ctx.beginPath(); ctx.roundRect(dX+1.5,dY+1.5,dW-3,dH-1.5,2); ctx.fill();
    // 中へ入っていくキャラの影
    if(homeNum>0) drawHomeSilhouette(ctx, dX, dY, dW, dH, homeNum, ease, t);
  } else {
    ctx.fillStyle='#e8c76a';   // ドアノブ
    ctx.beginPath(); ctx.arc(dX+dW*0.78, dY+dH*0.55, 1.8, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// 扉の中に見える、帰っていくキャラの影
function drawHomeSilhouette(ctx, dX, dY, dW, dH, num, ease, t){
  const spec = blockSpec(num);
  const cell = Math.max(1.2, Math.min((dW-6)/spec.cols, (dH-6)/spec.rows));
  const w=spec.cols*cell, h=spec.rows*cell;
  const bx=dX+dW/2-w/2, by=dY+dH-3-h;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(dX+1.5,dY+1.5,dW-3,dH-1.5,2); ctx.clip();
  ctx.globalAlpha=0.55*ease;
  ctx.fillStyle='#4a3b2c';
  ctx.fillRect(bx, by + Math.sin(t*0.006)*0.8, w, h);
  ctx.restore();
}

// 鏡の中に映るキャラ。実物と同じ描画エンジンを縮めて使い、左右を反転させる。
// prog は 0→1 で、小さく暗いところから、すっと浮かび上がってくる。
function drawMirrorReflection(ctx, m, num, prog, t){
  const spec = blockSpec(num);
  // アーチの内側に収まるように描く箱。上はアーチで狭いので少し下げる。
  const boxY = m.y + Math.round(m.w*0.40);      // 上のバッジを避けて下寄りに
  const boxW = m.w - 12, boxH = m.h - (boxY - m.y) - 6;
  const cell = Math.max(1.5, Math.min(boxW/spec.cols, boxH/spec.rows));
  const w = spec.cols*cell, h = spec.rows*cell;
  const cx = m.x + m.w/2;
  const bx = cx - w/2;
  const by = boxY + (boxH - h)/2;

  const ease = prog*prog*(3-2*prog);          // ゆるやかに出入りさせる
  const scale = 0.72 + 0.28*ease;
  const bob = Math.sin(t*0.006)*1.2*ease;     // 鏡の中でゆらゆらさせる

  ctx.save();
  mirrorPath(ctx, m.x+4, m.y+4, m.w-8, m.h-7); ctx.clip();

  // 鏡像なので左右反転。拡大縮小は鏡の中心を軸にする。
  ctx.translate(cx, by + h/2 + bob);
  ctx.scale(-scale, scale);
  ctx.translate(-cx, -(by + h/2));

  ctx.globalAlpha = 0.30 + 0.62*ease;
  drawNumberblock(ctx, num, bx, by, cell, { t:t, animate:true, numberling:false });
  ctx.restore();

  // 鏡らしく、上から薄い光の膜をかける
  ctx.save();
  mirrorPath(ctx, m.x+4, m.y+4, m.w-8, m.h-7); ctx.clip();
  const gl=ctx.createLinearGradient(m.x, m.y, m.x+m.w, m.y+m.h);
  gl.addColorStop(0,'rgba(255,255,255,'+(0.22*ease)+')');
  gl.addColorStop(0.5,'rgba(220,240,255,'+(0.05*ease)+')');
  gl.addColorStop(1,'rgba(255,255,255,'+(0.18*ease)+')');
  ctx.fillStyle=gl; ctx.fillRect(m.x, m.y, m.w, m.h);
  ctx.restore();
}

function drawMirror(ctx, t){
  const m=getMirrorRect(); if(!m) return;
  if(mirrorFlash>0) mirrorFlash=Math.max(0, mirrorFlash-0.035);
  // 複製できた合図の光の輪。鏡から外へ広がって消える。
  if(mirrorRing>0){
    mirrorRing=Math.max(0, mirrorRing-0.045);
    const e=1-mirrorRing;
    ctx.save();
    ctx.globalAlpha=mirrorRing*0.85;
    ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=3*mirrorRing+1;
    ctx.beginPath();
    ctx.ellipse(m.x+m.w/2, m.y+m.h/2, m.w*(0.5+e*1.1), m.h*(0.5+e*1.0), 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  const hover = !!(dragBlock && dragPtr && isOverMirror(dragPtr.x, dragPtr.y));
  if(hover) mirrorReflectNum = dragBlock.num;
  mirrorReflect += ((hover?1:0) - mirrorReflect) * 0.25;   // すっと現れて、すっと消える
  if(mirrorReflect < 0.02) mirrorReflect = 0;
  // 離したあとは指が画面から離れている。ここが一番よく見えるので、
  // すぐ縮めずにしばらく大きいまま見せる。
  if(mirrorAfter>0) mirrorAfter = Math.max(0, mirrorAfter-0.018);
  const show = Math.max(mirrorReflect, mirrorAfter);
  // 鏡の中の像は、複製が飛び出したらすぐ消す。残したままだと
  // 「実体2体＋鏡の中の1体」で3体いるように見えてしまう。
  if(mirrorHandoff>0) mirrorHandoff = Math.max(0, mirrorHandoff-0.16);
  const refl = Math.max(mirrorReflect, mirrorHandoff);
  const pulse = Math.sin(t*0.004)*0.5+0.5;
  const glow  = Math.max(mirrorFlash, show);

  ctx.save();
  // ドロップできる状態のときは、鏡がふくらんで脈打つ。
  // 「何が起きるか」は鏡の中の映り込みが伝えるので、こちらは
  // 「今が離すタイミング」だけを伝える役に徹する。
  const beat  = 0.5+0.5*Math.sin(t*0.013);
  const swell = 1 + show*(0.92 + 0.10*beat) + 0.13*mirrorFlash;
  if(swell !== 1){
    // 大きくすると画面からはみ出すので、中心を内側へずらしながら広げる
    const cx0=m.x+m.w/2, cy0=m.y+m.h/2;
    const hw=m.w*swell/2, hh=m.h*swell/2;
    const cx=Math.min(Math.max(cx0, EDGE_MARGIN+hw), sw-EDGE_MARGIN-hw);
    const cy=Math.max(cy0, TAB_H+6+hh);
    ctx.translate(cx, cy);
    ctx.scale(swell, swell);
    ctx.translate(-cx0, -cy0);
  }
  if(glow>0){
    ctx.shadowColor='rgba(150,220,255,'+(0.55+glow*0.45)+')';
    ctx.shadowBlur=14+glow*(16+14*beat);
  }
  // 鏡面（虹色のグラデーション）
  const g=ctx.createLinearGradient(m.x, m.y, m.x+m.w, m.y+m.h);
  g.addColorStop(0.00,'#bcd8ff');
  g.addColorStop(0.35,'#c3b2f2');
  g.addColorStop(0.62,'#a9ead9');
  g.addColorStop(1.00,'#f7c9e9');
  ctx.fillStyle=g;
  mirrorPath(ctx,m.x,m.y,m.w,m.h); ctx.fill();
  ctx.shadowBlur=0;

  // 内側の明るい面
  const gi=ctx.createLinearGradient(m.x, m.y+m.h, m.x+m.w, m.y);
  gi.addColorStop(0,'rgba(255,255,255,0.75)');
  gi.addColorStop(0.5,'rgba(255,255,255,0.25)');
  gi.addColorStop(1,'rgba(255,255,255,0.70)');
  ctx.fillStyle=gi;
  mirrorPath(ctx,m.x+4,m.y+4,m.w-8,m.h-7); ctx.fill();

  // 斜めのハイライト（鏡らしさ）
  ctx.save();
  mirrorPath(ctx,m.x+4,m.y+4,m.w-8,m.h-7); ctx.clip();
  ctx.fillStyle='rgba(255,255,255,'+(0.35+pulse*0.3)+')';
  ctx.beginPath();
  ctx.moveTo(m.x-4, m.y+m.h*0.72); ctx.lineTo(m.x+m.w*0.55, m.y-6);
  ctx.lineTo(m.x+m.w*0.80, m.y-6); ctx.lineTo(m.x+m.w*0.20, m.y+m.h+6);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // ここで離せばコピーされる、というときは鏡にそのキャラを映す。
  // 「鏡の中にもう一人いる」が見えるので、何が起きるか説明なしで伝わる。
  if(refl > 0.02 && mirrorReflectNum > 0){
    drawMirrorReflection(ctx, m, mirrorReflectNum, refl, t);
  }

  // 虹色のふち
  const gb=ctx.createLinearGradient(m.x, m.y+m.h, m.x+m.w, m.y);
  gb.addColorStop(0,'#7fd8f0'); gb.addColorStop(0.5,'#b39ef0'); gb.addColorStop(1,'#7ff0c8');
  ctx.strokeStyle=gb; ctx.lineWidth=2.5 + 1.8*show*beat;
  if(show>0){
    ctx.shadowColor='rgba(255,255,255,'+(0.5*show)+')';
    ctx.shadowBlur=8*show;
  }
  mirrorPath(ctx,m.x,m.y,m.w,m.h); ctx.stroke();
  ctx.shadowBlur=0;

  // 上のバッジ（おうちマーク）
  const bx=m.x+m.w/2, by=m.y+m.w*0.21, br=m.w*0.16;
  ctx.fillStyle='#e9f3ff'; ctx.strokeStyle='#8fb8e8'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill(); ctx.stroke();
  const hw=br*0.95, hh=br*0.80;
  ctx.fillStyle='#5ec8b8';
  ctx.beginPath();                                   // 屋根
  ctx.moveTo(bx, by-hh*0.72);
  ctx.lineTo(bx+hw*0.72, by-hh*0.06);
  ctx.lineTo(bx-hw*0.72, by-hh*0.06);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(bx-hw*0.42, by-hh*0.06, hw*0.84, hh*0.66);   // 壁

  ctx.restore();
}

// 上段中央：合体したときにクイズを出すかどうかの切り替え。
// ドリルモードはクイズそのものなので、そこでは出さない。
function drawQuizToggle(ctx){
  toggleBtns = [];
  if(mode==='factor'||mode==='quiz') return;
  const w=90, h=30, y=Math.round((TOP_ROW_H-h)/2);
  const x=Math.round((BAR_LEFT_RESERVE + (sw - BAR_RIGHT_RESERVE))/2 - w/2);
  ctx.save();
  ctx.fillStyle = quizOn ? 'rgba(100,160,255,0.95)' : 'rgba(82,92,110,0.95)';
  ctx.beginPath(); ctx.roundRect(x,y,w,h,8); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,'+(quizOn?0.75:0.35)+')'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,8); ctx.stroke();
  ctx.fillStyle='white'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 12px sans-serif';
  ctx.fillText('クイズ '+(quizOn?'ON':'OFF'), x+w/2, y+h/2);
  ctx.restore();
  toggleBtns.push({x:x,y:y,w:w,h:h,val:'quiz'});
}

// 下段：モードタブ（＋ − × ÷ 因数 ドリル）。画面幅いっぱいに等分する
function drawModeTabs(ctx){
  const n = TAB_DEFS.length;
  const pad = 3;
  const tabW = (sw - pad*2) / n;
  tabBtns = [];
  for(let i=0;i<n;i++){
    const td=TAB_DEFS[i];
    const tx=pad+i*tabW, ty=TOP_ROW_H, active=td.val===mode;
    ctx.save();
    // 選んでいないタブが「押せない」ように見えないよう、はっきり明るくする
    ctx.fillStyle = active?'rgba(100,160,255,0.95)':'rgba(82,92,110,0.95)';
    ctx.beginPath(); ctx.roundRect(tx+2,ty+2,tabW-4,TAB_ROW_H-4,8); ctx.fill();
    ctx.strokeStyle = active?'rgba(255,255,255,0.75)':'rgba(255,255,255,0.35)';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(tx+2,ty+2,tabW-4,TAB_ROW_H-4,8); ctx.stroke();
    ctx.fillStyle=active?'white':'#eef2f8';
    ctx.font='bold '+(td.label.length>1?'13':'17')+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(td.label,tx+tabW/2,ty+TAB_ROW_H/2);
    ctx.restore();
    tabBtns.push({x:tx+2,y:ty+2,w:tabW-4,h:TAB_ROW_H-4,val:td.val});
  }
}

// ─── NumberBlock ──────────────────────────────────────────────────────────────
// 見た目（かたち・色・顔・手足）は共通エンジン engine.js が担当する。
// このクラスは、ゲームの物理演算・ドラッグ・レイアウトに必要な当たり判定の
// 箱（x/y/width/height）と速度だけを持ち、描画はエンジンへ丸投げする。
let blockIdCounter = 0;
class NumberBlock {
  constructor(num,x,y){
    this.id=blockIdCounter++; this.num=Math.max(1,Math.min(100,num));
    this.x=x; this.y=y; this.vx=0; this.vy=0; this.onGround=false; this.targetX=x;
    this.birth=1;   // 1 なら通常。0 から始めるとミラーから生まれる演出が付く
    this.launch=0;  // >0 のあいだは整列を無視して飛ぶ（ミラーからの射出）
    this._computeShape();
  }
  _computeShape(){
    // かたちはエンジンの blockSpec が正。ここはその外形サイズを写すだけ
    const spec = blockSpec(this.num);
    this.cols = spec.cols; this.rows = spec.rows;
    this.width=this.cols*BS; this.height=this.rows*BS;
  }
  get cx(){ return this.x+this.width/2; }
  get cy(){ return this.y+this.height/2; }
  draw(ctx,t=0,bounceY=0){
    // ミラーから出てきた直後は、小さく現れて「ぽんっ」と実物大になる
    if(this.birth < 1){
      this.birth = Math.min(1, this.birth + 0.055);
      const p=this.birth, c1=1.70158, c3=c1+1;
      const back = 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2);   // 少し行き過ぎて戻る
      const sc = 0.30 + 0.70*back;
      const ax=this.x+this.width/2, ay=this.y+this.height;        // 足元を軸にする
      ctx.save();
      ctx.globalAlpha = Math.min(1, 0.35+0.75*p);
      ctx.translate(ax,ay); ctx.scale(sc,sc); ctx.translate(-ax,-ay);
      this._drawBody(ctx,t,bounceY);
      ctx.restore();
      return;
    }
    this._drawBody(ctx,t,bounceY);
  }
  _drawBody(ctx,t=0,bounceY=0){
    const n=this.num,x=this.x,y=this.y+bounceY;
    const isMoving=Math.abs(this.vx)>0.5||Math.abs(this.vy)>1.0;
    drawNumberblock(ctx, n, x, y, BS, { t:t, animate:isMoving, numberling:false });
    // 数字ラベルはゲーム側の見せ方（白フチ黒文字）を維持する
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.font='bold '+Math.max(9,Math.round(BS*0.6))+'px sans-serif';
    ctx.strokeStyle='white'; ctx.lineWidth=3; ctx.strokeText(String(n),x+this.width/2,y-3);
    ctx.fillStyle='#111'; ctx.fillText(String(n),x+this.width/2,y-3);
    ctx.restore();
  }
}

// ─── Particle ─────────────────────────────────────────────────────────────────
class Particle {
  constructor(x,y){
    this.x=x; this.y=y; this.vx=(Math.random()-0.5)*10; this.vy=-Math.random()*12-2;
    this.gravity=0.5; this.hue=Math.random()*360; this.life=1.0;
    this.rot=Math.random()*Math.PI*2; this.rotV=(Math.random()-0.5)*0.2;
    this.w=6+Math.random()*6; this.h=4+Math.random()*4;
  }
  update(){ this.vy+=this.gravity; this.x+=this.vx; this.y+=this.vy; this.rot+=this.rotV; this.life-=0.018; }
  draw(ctx){
    if(this.life<=0) return;
    ctx.save(); ctx.globalAlpha=Math.max(0,this.life); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    ctx.fillStyle=`hsl(${this.hue},90%,60%)`; ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);
    ctx.restore();
  }
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function drawNoEntry(ctx,x,y,r){
  ctx.save(); ctx.fillStyle='rgba(200,0,0,0.92)'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='white'; ctx.lineWidth=r*0.12; ctx.beginPath(); ctx.arc(x,y,r*0.88,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='white'; const bw=r*1.4,bh=r*0.45;
  ctx.beginPath(); ctx.roundRect(x-bw/2,y-bh/2,bw,bh,bh*0.3); ctx.fill(); ctx.restore();
}
function drawOKGlow(ctx,block,t){
  const pulse=Math.sin(t*0.015)*0.5+0.5; ctx.save();
  ctx.shadowColor=`rgba(0,220,60,${0.6+pulse*0.4})`; ctx.shadowBlur=18+pulse*10;
  ctx.strokeStyle=`rgba(0,200,50,${0.7+pulse*0.3})`; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect(block.x-3,block.y-3,block.width+6,block.height+6,6); ctx.stroke(); ctx.restore();
}
function canCalc(a,b,m){
  if(m==='+')   return a.num+b.num<=100;
  if(m==='-')   return Math.abs(a.num-b.num)>=1;
  if(m==='x')   return a.num*b.num<=100;
  if(m==='div'){ const lg=Math.max(a.num,b.num),sm=Math.min(a.num,b.num); return sm>=1&&lg%sm===0; }
  return false;
}

// ─── Puzzle class（4択クイズ）────────────────────────────────────────────────
class Puzzle {
  constructor(draggedBlock,targetBlock,calcMode){
    this.calcMode=calcMode;
    let n1,n2,ans;
    if(calcMode==='+'){      n1=draggedBlock.num; n2=targetBlock.num; ans=n1+n2;
    } else if(calcMode==='-'){
      n1=Math.max(draggedBlock.num,targetBlock.num); n2=Math.min(draggedBlock.num,targetBlock.num); ans=n1-n2;
    } else if(calcMode==='x'){
      n1=draggedBlock.num; n2=targetBlock.num; ans=n1*n2;
    } else {
      n1=Math.max(draggedBlock.num,targetBlock.num); n2=Math.min(draggedBlock.num,targetBlock.num); ans=n1/n2;
    }
    this.n1=n1; this.n2=n2; this.ans=ans;
    this.a=draggedBlock.num; this.b=targetBlock.num;   // 演算子の切り替え用
    this.mergeX=(draggedBlock.x+targetBlock.x)/2;
    this.char1=new NumberBlock(n1,0,0); this.char2=new NumberBlock(n2,0,0);
    this.charRes=new NumberBlock(Math.max(1,Math.round(ans)),0,0);
    this.choices=this._genChoices(ans);
    this.eliminated=new Set();
    this.wrongFlash=0; this.wrongChoiceIdx=null; // 誤答演出
    // 'countdown'（クイズ）｜'answer'（こたえをすぐ見せる）｜'correct'|'timeout'|'done'
    this.phase = (mode==='quiz' || quizOn) ? 'countdown' : 'answer';
    this.ANSWER_MS = 2200;   // 演算子ボタンに気づける程度の長さ。タップすればすぐ閉じる
    // 正解演出は続けて何問も解くので、長いとテンポが悪くなる。
    // さらに、待たされないよう画面をタップすれば途中でも先へ進める。
    this.elapsed=0; this.COUNTDOWN=5000; this.CORRECT_ANIM=700;
    this.particles=[];
  }

  // 同じ2体のまま、演算子だけ切り替える。モードを変えずに
  // ひきざん・かけざん・わりざんに触れられるようにするため。
  _opsAvailable(){
    const a={num:this.a}, b={num:this.b};
    return ['+','-','x','div'].filter(m=>canCalc(a,b,m));
  }
  setOp(op){
    if(op===this.calcMode) return;
    const a=this.a, b=this.b;
    let n1,n2,ans;
    if(op==='+'){ n1=a; n2=b; ans=a+b; }
    else if(op==='x'){ n1=a; n2=b; ans=a*b; }
    else if(op==='-'){ n1=Math.max(a,b); n2=Math.min(a,b); ans=n1-n2; }
    else { n1=Math.max(a,b); n2=Math.min(a,b); ans=n1/n2; }
    this.calcMode=op; this.n1=n1; this.n2=n2; this.ans=ans;
    this.char1=new NumberBlock(n1,0,0); this.char2=new NumberBlock(n2,0,0);
    this.charRes=new NumberBlock(Math.max(1,Math.round(ans)),0,0);
    this.elapsed=0;   // 見比べられるように表示時間を延ばす
  }

  _genChoices(ans){
    const n1 = this.n1;
    const n2 = this.n2;

    const candidates = new Set();

    function addIfValid(v){
      if(v >= 1 && v <= 100 && v !== ans){
        candidates.add(v);
      }
    }

    // --- ① 操作ミス ---
    if(this.calcMode === '+'){
      addIfValid(n1 * n2);
      addIfValid(Math.abs(n1 - n2));
    } else if(this.calcMode === '-'){
      addIfValid(n1 + n2);
      addIfValid(n2 - n1);
    } else if(this.calcMode === 'x'){
      addIfValid(n1 + n2);
      addIfValid(Math.abs(n1 - n2));
    } else if(this.calcMode === 'div'){
      addIfValid(n1 * n2);
      addIfValid(n1 + n2);
    }

    // --- ② 計算ミス ---
    for(let i=0;i<10;i++){
      const diff = Math.floor(Math.random()*5)+1;
      addIfValid(ans + diff);
      addIfValid(ans - diff);
    }

    // --- ③ 近似 ---
    addIfValid(ans + 10);
    addIfValid(ans - 10);

    // --- 配列化してシャッフル ---
    let wrongs = [...candidates];

    // 不足分を補充
    while(wrongs.length < 3){
      const v = ans + (Math.random()<0.5?-1:1)*(Math.floor(Math.random()*20)+1);
      if(v >= 1 && v <= 100 && v !== ans && !wrongs.includes(v)){
        wrongs.push(v);
      }
    }

    // 3つに絞る
    wrongs = wrongs.slice(0,3);

    // ★ 最後に正解を必ず追加
    const choices = [ans, ...wrongs];

    // 昇順ソート
    return choices.sort((a,b)=>a-b);
  }


  tapChoice(idx){
    if(this.phase!=='countdown') return;
    if(this.eliminated.has(idx)) return;
    if(this.choices[idx]===this.ans){
      // ドリルでは「一発で当てたか」を成績にする（間違えた後に当てても連続は途切れる）
      if(mode==='quiz') quizScore(this.eliminated.size===0);
      this.phase='correct'; this.elapsed=0;
      for(let i=0;i<70;i++) this.particles.push(new Particle(sw/2,sh/2));
    } else {
      this.eliminated.add(idx); this.elapsed=0;
      this.wrongFlash=500; this.wrongChoiceIdx=idx; // 誤答フラッシュ
    }
  }

  update(dt){
    this.elapsed+=dt; this.wrongFlash=Math.max(0,this.wrongFlash-dt);
    if(this.phase==='answer'&&this.elapsed>=this.ANSWER_MS) this.phase='done';
    else if(this.phase==='countdown'&&this.elapsed>=this.COUNTDOWN) this.phase='timeout';
    else if(this.phase==='correct'&&this.elapsed>=this.CORRECT_ANIM) this.phase='done';
    for(const p of this.particles) p.update();
    this.particles=this.particles.filter(p=>p.life>0);
  }

  _panelRect(){
    const pw=Math.min(sw-24,520), ph=Math.min(sh-60,480);
    return {px:(sw-pw)/2,py:(sh-ph)/2,pw,ph};
  }

  // 表示中の選択肢の座標（昇順ソート済み）
  _getChoiceRects(){
    const {px,py,pw,ph}=this._panelRect();
    const visible=[0,1,2,3].filter(i=>!this.eliminated.has(i));
    if(!visible.length) return [];
    const btnH=48,gap=8,totalW=pw-40,btnW=(totalW-(visible.length-1)*gap)/visible.length;
    const choiceY=py+ph-btnH-14;
    return visible.map((idx,pos)=>({idx,x:px+20+pos*(btnW+gap),y:choiceY,w:btnW,h:btnH}));
  }

  _opStr(){ return {'+':'+','-':'−','x':'×','div':'÷'}[this.calcMode]||'?'; }

  draw(ctx,t){
    const {px,py,pw,ph}=this._panelRect();
    // 暗幕は上部バーより下だけに掛ける。画面全体に掛けるとモードタブまで
    // 暗くなり、他のモードに切り替えられないように見えてしまう。
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,TAB_H,sw,sh-TAB_H);
    const grad=ctx.createLinearGradient(px,py,px+pw,py+ph);
    grad.addColorStop(0,'#f80'); grad.addColorStop(0.5,'#e00'); grad.addColorStop(1,'#80f');
    ctx.save(); ctx.beginPath(); ctx.roundRect(px-3,py-3,pw+6,ph+6,20); ctx.fillStyle=grad; ctx.fill(); ctx.restore();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.roundRect(px,py,pw,ph,16); ctx.fill();

    if(this.phase==='correct'){
      this._drawCorrectAnim(ctx,t,px,py,pw,ph);
    } else if(this.phase==='answer'){
      this._drawAnswerPanel(ctx,t,px,py,pw,ph);
    } else {
      this._drawQuestion(ctx,t,px,py,pw,ph);
      this._drawCountdownBar(ctx,px,py,pw,ph);
      this._drawChoiceButtons(ctx);
    }
    for(const p of this.particles) p.draw(ctx);

    // 誤答演出：赤フラッシュ＋✗
    if(this.wrongFlash>0){
      const alpha=(this.wrongFlash/500)*0.42;
      ctx.save();
      ctx.fillStyle=`rgba(220,20,20,${alpha})`;
      ctx.beginPath(); ctx.roundRect(px,py,pw,ph,16); ctx.fill();
      ctx.font=`bold ${Math.round(ph*0.28)}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=`rgba(255,0,0,${Math.min(1,alpha*3)})`;
      ctx.fillText('✗',px+pw/2,py+ph*0.45);
      ctx.restore();
    }
  }

  _drawQuestion(ctx,t,px,py,pw,ph){
    ctx.save(); ctx.font='bold 22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#333';
    ctx.fillText(`${this.n1} ${this._opStr()} ${this.n2} = ?`,px+pw/2,py+12); ctx.restore();
    if(this.calcMode==='x') this._drawMultiplyGrid(ctx,t,px,py,pw,ph);
    else this._drawCharPair(ctx,t,px,py,pw,ph);
  }

  _drawCharPair(ctx,t,px,py,pw,ph){
    const c1=this.char1,c2=this.char2;
    // 下揃え：選択肢＋バー分（92px）を除いたエリアの底に合わせる
    const contentBottom=py+ph-92;
    const b1Y=Math.sin(this.elapsed*0.003)*5, b2Y=Math.sin(this.elapsed*0.003+Math.PI)*5;
    const opW=30,gap=14,totalW=c1.width+gap+opW+gap+c2.width;
    let cx=(sw-totalW)/2;
    c1.x=cx; c1.y=contentBottom-c1.height; c1.draw(ctx,t,b1Y); cx+=c1.width+gap;
    const maxH=Math.max(c1.height,c2.height);
    ctx.save(); ctx.font='bold 28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#444';
    ctx.fillText(this._opStr(),cx+opW/2,contentBottom-maxH/2); ctx.restore(); cx+=opW+gap;
    c2.x=cx; c2.y=contentBottom-c2.height; c2.draw(ctx,t,b2Y);
  }

  _drawMultiplyGrid(ctx,t,px,py,pw,ph){
    const n1=this.n1,n2=this.n2,blockW=this.char2.width,blockH=this.char2.height;
    const cols=Math.min(10,n1),rows=Math.ceil(n1/cols),gapX=6,gapY=10;
    const totalRowW=cols*(blockW+gapX)-gapX;
    // 下揃え
    const contentBottom=py+ph-92;
    const gridH=rows*(blockH+gapY)-gapY;
    const startX=px+(pw-totalRowW)/2, startY=contentBottom-gridH;
    const bounce=Math.sin(this.elapsed*0.003)*4;
    for(let i=0;i<n1;i++){
      const col=i%cols,row=Math.floor(i/cols);
      const nb=new NumberBlock(n2,startX+col*(blockW+gapX),startY+row*(blockH+gapY));
      nb.draw(ctx,t,bounce);
    }
  }

  _drawCountdownBar(ctx,px,py,pw,ph){
    if(this.noBar) return;            // 制限なしのときは残り時間バーを出さない
    const prog=Math.max(0,1-this.elapsed/this.COUNTDOWN);
    const bw=pw-40,bh=12,bx=px+20,by=py+ph-78;
    ctx.fillStyle='#ddd'; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,6); ctx.fill();
    ctx.fillStyle=`hsl(${prog*120},80%,45%)`; ctx.beginPath(); ctx.roundRect(bx,by,bw*prog,bh,6); ctx.fill();
  }

  _drawChoiceButtons(ctx){
    const rects=this._getChoiceRects();
    for(const r of rects){
      ctx.save(); ctx.fillStyle='rgba(50,100,240,0.9)';
      ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,10); ctx.fill();
      ctx.fillStyle='white'; ctx.font='bold 24px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(this.choices[r.idx]),r.x+r.w/2,r.y+r.h/2);
      ctx.restore();
    }
  }

  // 演算子ボタンの位置。選択肢ボタンと同じ場所に4つ並べる。
  _getOpRects(){
    const {px,py,pw,ph}=this._panelRect();
    const ops=this._opsAvailable();
    if(!ops.length) return [];
    const btnH=48,gap=8,totalW=pw-40,btnW=(totalW-(ops.length-1)*gap)/ops.length;
    const y=py+ph-btnH-14;
    return ops.map((op,i)=>({op, x:px+20+i*(btnW+gap), y:y, w:btnW, h:btnH}));
  }

  // クイズOFFのときの画面。答えをすぐ見せ、演算子を押せば別の計算になる。
  _drawAnswerPanel(ctx,t,px,py,pw,ph){
    ctx.save();
    ctx.font='bold 26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#222';
    ctx.fillText(`${this.n1} ${this._opStr()} ${this.n2} = ${this.ans}`, px+pw/2, py+12);
    ctx.restore();

    const cr=this.charRes, bounce=Math.sin(this.elapsed*0.008)*7;
    const top=py+52, bottom=py+ph-78;
    cr.x=px+(pw-cr.width)/2;
    cr.y=Math.max(top, (top+bottom)/2 - cr.height/2);
    cr.draw(ctx,t,bounce);

    // 演算子ボタン
    for(const r of this._getOpRects()){
      const cur = r.op===this.calcMode;
      ctx.save();
      ctx.fillStyle = cur ? 'rgba(50,100,240,0.95)' : 'rgba(150,160,180,0.9)';
      ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,10); ctx.fill();
      if(cur){ ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2;
               ctx.beginPath(); ctx.roundRect(r.x,r.y,r.w,r.h,10); ctx.stroke(); }
      ctx.fillStyle='white'; ctx.font='bold 26px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText({'+':'＋','-':'−','x':'×','div':'÷'}[r.op], r.x+r.w/2, r.y+r.h/2);
      ctx.restore();
    }
  }

  _drawCorrectAnim(ctx,t,px,py,pw,ph){
    ctx.save(); ctx.font='bold 40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#080';
    ctx.fillText('正解！',px+pw/2,py+12); ctx.restore();
    const cr=this.charRes, bounce=Math.sin(this.elapsed*0.01)*10;
    cr.x=px+(pw-cr.width)/2; cr.y=py+(ph-cr.height)/2-10; cr.draw(ctx,t,bounce);
    ctx.save(); ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#333';
    ctx.fillText(`${this.n1} ${this._opStr()} ${this.n2} = ${this.ans}`,px+pw/2,py+ph-12); ctx.restore();
  }
}

// ─── Game state ───────────────────────────────────────────────────────────────
let blocks=[], puzzle=null, dragBlock=null, dragPointers={};
let dragPtr=null;   // ドラッグ中の指／マウスの位置（マジックミラーの判定用）
let walkTime=0;
// CLR（ぜんぶ消す）は取り返しがつかないので、押し続けないと実行しない。
// 押しているあいだリングが溜まっていき、一周したら実行する。
const CLR_HOLD_MS = 650;
let clrHold = null;   // {pid, t0}

function applyPhysics(){
  for(const b of blocks){
    if(b===dragBlock) continue;
    if(b.launch>0){
      // ミラーから射出された直後。整列に引き戻さず、そのまま飛ばす
      b.launch--; b.vx*=0.97;
    } else {
      const dx=b.targetX-b.x;
      if(Math.abs(dx)>1){ b.vx=dx>0?2:-2; } else { b.vx=0; b.x=b.targetX; }
    }
    b.vy+=GRAVITY; b.x+=b.vx; b.y+=b.vy;
    const fl=calcFloor()-b.height;
    if(b.y>=fl){ b.y=fl; b.vy=0; b.onGround=true; } else b.onGround=false;
    // 画面の左右ギリギリに立たせると、つかもうとした指が
    // Safari の「端からスワイプで戻る」に取られてしまう。少し内側で止める。
    if(b.x<EDGE_MARGIN){ b.x=EDGE_MARGIN; if(b.launch>0){ b.vx=0; b.launch=0; } }
    if(b.x+b.width>sw-EDGE_MARGIN){ b.x=sw-EDGE_MARGIN-b.width; if(b.launch>0){ b.vx=0; b.launch=0; } }
  }
}

function updateTargets(){
  const sorted=[...blocks].sort((a,b)=>a.num-b.num);
  if(!sorted.length) return;
  // 数が増えると1列に収まらなくなるので、間隔を詰めて画面内に入れる。
  // それでも足りないときは少しだけ重ねる（小さい数から順に並ぶので、
  // 重なっても手前の大きい数が隠れてしまうことはない）。
  const margin = 14 + EDGE_MARGIN;
  const blocksW = sorted.reduce((s,b)=>s+b.width,0);
  const avail   = sw - margin*2;
  if(sorted.length === 1){ sorted[0].targetX = Math.max(margin, (sw-blocksW)/2); return; }

  const gap = (avail - blocksW) / (sorted.length - 1);
  if(gap >= 0){
    // 余裕がある：すき間を最大16pxまでにして中央寄せ
    const g = Math.min(16, gap);
    const total = blocksW + g*(sorted.length-1);
    let cx = Math.max(margin, (sw-total)/2);
    for(const b of sorted){ b.targetX=cx; cx+=b.width+g; }
  } else {
    // 入りきらない：左右いっぱいに等間隔で置く（重なるが必ず画面内に収まる）
    const last = sorted[sorted.length-1];
    const step = (avail - last.width) / (sorted.length - 1);
    sorted.forEach((b,i) => { b.targetX = margin + step*i; });
  }
}

function spawnBlock(num){
  if(blocks.length>=MAX_BLOCKS) return;
  blocks.push(new NumberBlock(num,sw/2+(Math.random()-0.5)*100,TAB_H+20));
  updateTargets();
}

function setBlockSize(k){
  if(bsKey===k) return; bsKey=k; BS=BS_MAP[k];
  for(const b of blocks) b._computeShape();
  updateTargets();
}

// ─── Formula display ──────────────────────────────────────────────────────────
function drawFormula(ctx){
  if(!blocks.length) return;
  const sorted=[...blocks].sort((a,b)=>a.num-b.num);
  const nums=sorted.map(b=>b.num);
  let formula='';
  if(mode==='+') formula=nums.join(' + ')+' = '+nums.reduce((a,v)=>a+v,0);
  else if(mode==='-'&&nums.length===2){ const big=Math.max(...nums),sm=Math.min(...nums); formula=`${big} − ${sm} = ${big-sm}`; }
  else if(mode==='x'&&nums.length===2) formula=`${nums[0]} × ${nums[1]} = ${nums[0]*nums[1]}`;
  else if(mode==='div'&&nums.length===2){ const big=Math.max(...nums),sm=Math.min(...nums); if(sm>=1&&big%sm===0) formula=`${big} ÷ ${sm} = ${big/sm}`; }
  if(!formula) formula=nums.join(', ');
  ctx.save();
  ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const maxW = sw - 24;
  const lines = wrapText(ctx, formula, maxW);
  const lh = 20;
  let ty = TAB_H + 16;
  for(const line of lines){
    ctx.strokeStyle='white'; ctx.lineWidth=4; ctx.strokeText(line, sw/2, ty);
    ctx.fillStyle='#111'; ctx.fillText(line, sw/2, ty);
    ty += lh;
  }
  ctx.restore();
}

// 数式が画面幅に収まらないときは、区切り（空白）で折り返す。
// 「7 +」で行が終わらないよう、演算子は次の行の先頭に送らず行末に残す。
function wrapText(ctx, text, maxW){
  if(ctx.measureText(text).width <= maxW) return [text];
  const parts = text.split(' ');
  const lines = [];
  let cur = '';
  for(const part of parts){
    const next = cur ? cur+' '+part : part;
    if(cur && ctx.measureText(next).width > maxW){ lines.push(cur); cur = part; }
    else cur = next;
  }
  if(cur) lines.push(cur);
  return lines;
}

// ─── Numpad ───────────────────────────────────────────────────────────────────
function getNumpadLayout(){
  const padH=getPadH(),padY=sh-padH;
  const items=[
    {label:'1',val:1},{label:'2',val:2},{label:'3',val:3},{label:'4',val:4},
    {label:'5',val:5},{label:'6',val:6},{label:'7',val:7},{label:'8',val:8},
    {label:'9',val:9},{label:'10',val:10},
    {label:'R',val:'R',color:'#5a9'},{label:'CLR',val:'CLR',color:'#c55'}
  ];
  if(isLandscape()){
    const btnH=padH-12,btnW=Math.min(Math.floor((sw-10)/items.length)-2,70);
    return items.map((item,i)=>({...item,x:5+i*(btnW+2),y:padY+6,w:btnW,h:btnH}));
  }
  const btnH=36,col6W=Math.min(Math.floor((sw-10)/6)-2,58);
  return [
    ...items.slice(0,6).map((item,i)=>({...item,x:5+i*(col6W+2),y:padY+8,w:col6W,h:btnH})),
    ...items.slice(6).map((item,i)=>({...item,x:5+i*(col6W+2),y:padY+52,w:col6W,h:btnH}))
  ];
}

function drawNumpad(ctx){
  const padH=getPadH(),padY=sh-padH;
  ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(0,padY,sw,padH);
  // CLR を押し続けている進み具合（0〜1）。一周したら実行する。
  let clrProg = 0;
  if(clrHold){
    clrProg = Math.min(1, (Date.now()-clrHold.t0)/CLR_HOLD_MS);
    if(clrProg>=1){ blocks=[]; updateTargets(); clrHold=null; clrProg=0; }
  }
  for(const b of getNumpadLayout()){
    const holding = (b.val==='CLR' && clrProg>0);
    ctx.save();
    ctx.fillStyle=b.color||'rgba(80,80,180,0.9)';
    ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,8); ctx.fill();
    if(holding){
      // 下から溜まっていくゲージ。どこまで進んだかが一目で分かる
      ctx.save();
      ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,8); ctx.clip();
      ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.fillRect(b.x, b.y+b.h*(1-clrProg), b.w, b.h*clrProg);
      ctx.restore();
      ctx.strokeStyle='white'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.roundRect(b.x-2,b.y-2,b.w+4,b.h+4,10); ctx.stroke();
    }
    ctx.fillStyle='white'; ctx.font='bold 15px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2);
    ctx.restore();
  }
}

// ─── Factor mode ──────────────────────────────────────────────────────────────
let factorVal=12, factorReveal={}, factorBlocks=[], factorBS=10;
const factorUI=document.getElementById('factor-ui');
const factorNum=document.getElementById('factor-num');
const factorRange=document.getElementById('factor-range');

function buildFactorRows(n){
  factorReveal={}; factorBlocks=[];
  // 分母ごとのrows数をBS=1で取得してfactorBSを計算
  const divisors=[];
  for(let d=1;d<=n;d++) if(n%d===0) divisors.push(d);
  const savedBS=BS;
  BS=1;
  const rowCounts=divisors.map(d=>{ const tmp=new NumberBlock(d,0,0); return tmp.rows; });
  BS=savedBS;
  const avail=sh-TAB_H-FACTOR_H-safeBottom()-8;
  const totalBlockRows=rowCounts.reduce((s,r)=>s+r,0);
  // factorBS × totalBlockRows + 12 × numRows ≤ avail
  factorBS=Math.max(4,Math.min(BS,Math.floor((avail-12*divisors.length)/Math.max(1,totalBlockRows))));
  // blocksをfactorBSで生成
  BS=factorBS;
  divisors.forEach((d,ri)=>{
    const m=n/d,row=[];
    for(let bi=0;bi<m;bi++){
      const nb=new NumberBlock(d,0,0); nb.x=-nb.width-20; nb.y=0; row.push(nb);
    }
    factorBlocks.push({d,m,L:n,blocks:row,rowH:Math.max(36,row[0].height+12)});
  });
  BS=savedBS;
}

function updateFactorTargets(){
  const savedBS=BS; BS=factorBS;
  const labelW=90,gapX=4; let curY=TAB_H+8;
  for(const row of factorBlocks){
    for(let bi=0;bi<row.blocks.length;bi++){
      const nb=row.blocks[bi]; nb.targetX=labelW+bi*(nb.width+gapX); nb.y=curY+(row.rowH-nb.height)/2;
    }
    curY+=row.rowH;
  }
  BS=savedBS;
}

function lerpFactorBlocks(){
  for(const row of factorBlocks) for(const nb of row.blocks) nb.x+=(nb.targetX-nb.x)*0.12;
}

function drawFactorMode(ctx,t){
  const savedBS=BS; BS=factorBS;
  let curY=TAB_H+8;
  for(let ri=0;ri<factorBlocks.length;ri++){
    const row=factorBlocks[ri],rowH=row.rowH;
    if(curY+rowH>sh-FACTOR_H) break;
    ctx.fillStyle=ri%2===0?'rgba(255,255,255,0.09)':'rgba(255,255,255,0.04)';
    ctx.fillRect(0,curY,sw,rowH);
    ctx.save(); ctx.font='bold 14px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='white';
    ctx.fillText(`${row.d}×${row.m}=${row.L}`,6,curY+rowH/2); ctx.restore();
    for(const nb of row.blocks) nb.draw(ctx,t,0);
    const bw=row.blocks[0]?.width||factorBS;
    const btnW=Math.max(70,sw-row.blocks.length*(bw+4)-95-6),revX=sw-btnW-6;
    const revealed=!!factorReveal[ri];
    ctx.save(); ctx.fillStyle=revealed?'rgba(80,200,80,0.85)':'rgba(200,200,200,0.3)';
    ctx.beginPath(); ctx.roundRect(revX,curY+8,btnW,rowH-16,8); ctx.fill();
    ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#111';
    ctx.fillText(`${row.L}÷${row.d}=${revealed?String(row.m):'?'}`,revX+btnW/2,curY+rowH/2); ctx.restore();
    curY+=rowH;
  }
  BS=savedBS;
}

function handleFactorTap(x,y){
  let curY=TAB_H+8;
  for(let ri=0;ri<factorBlocks.length;ri++){
    const row=factorBlocks[ri],rowH=row.rowH;
    if(curY+rowH>sh-FACTOR_H) break;
    const bw=row.blocks[0]?.width||factorBS;
    const btnW=Math.max(70,sw-row.blocks.length*(bw+4)-95-6),revX=sw-btnW-6;
    if(ptInRect(x,y,revX,curY+8,btnW,rowH-16)){ factorReveal[ri]=!factorReveal[ri]; return; }
    curY+=rowH;
  }
}

factorRange.addEventListener('input',()=>{
  factorVal=parseInt(factorRange.value,10); factorNum.textContent=String(factorVal);
  buildFactorRows(factorVal); updateFactorTargets(); factorReveal={};
});

// ─── ドリルモード（四則計算をひたすら解く）──────────────────────────────────
// キャラ同士をくっつけたときに出るのと同じクイズを、ランダムに出し続ける。
// 出題そのものは既存の Puzzle クラスをそのまま使う（見た目・操作を揃えるため）。
const quizUI      = document.getElementById('quiz-ui');
const quizMaxEl   = document.getElementById('quiz-max');
const quizMaxVal  = document.getElementById('quiz-max-val');
const quizLimitEl = document.getElementById('quiz-limit');

let quizOps   = ['+','-'];      // 出題する計算の種類（最低1つ）
let quizMax   = 10;             // 使う数の上限
const QUIZ_LIMITS = [0, 10000, 5000];   // 0＝制限なし
let quizLimitIdx = 0;
let quizStats = { asked:0, correct:0, streak:0, best:0 };
let quizScored = false;         // この問題の正誤をもう数えたか

function quizLimitLabel(){
  const ms = QUIZ_LIMITS[quizLimitIdx];
  return 'じかん：' + (ms ? (ms/1000)+'びょう' : 'なし');
}
/** 1〜quizMax の範囲で、その計算が成り立つ2つの数を選ぶ */
function quizPickPair(op){
  const M = quizMax, r = n => 1 + Math.floor(Math.random()*n);
  for(let i=0;i<200;i++){
    if(op==='+'){
      const a=r(M), b=r(M);
      if(a+b<=100) return [a,b];
    } else if(op==='-'){
      const a=r(M), b=r(M);
      if(a!==b) return [Math.max(a,b), Math.min(a,b)];
    } else if(op==='x'){
      const a=r(M), b=r(M);
      if(a*b<=100) return [a,b];
    } else {
      const b=r(M), q=r(M);          // わり算は「割り切れる」ように積から作る
      if(b*q<=100 && b>1) return [b*q, b];
    }
  }
  return op==='div' ? [6,3] : [1,1];   // 念のための保険
}
function quizNewPuzzle(){
  const op = quizOps[Math.floor(Math.random()*quizOps.length)];
  const [a,b] = quizPickPair(op);
  puzzle = new Puzzle({num:a, x:sw/2}, {num:b, x:sw/2}, op);
  const ms = QUIZ_LIMITS[quizLimitIdx];
  if(!ms) puzzle.COUNTDOWN = Infinity;   // 制限なし（あせらせない）
  else    puzzle.COUNTDOWN = ms;
  puzzle.noBar = !ms;
  quizStats.asked++;
  quizScored = false;
}
function quizReset(){
  quizStats = { asked:0, correct:0, streak:0, best:0 };
  puzzle = null;
  quizNewPuzzle();
}
/** 成績を1問ぶん記録する（一発で当てたときだけ「せいかい」に数える） */
function quizScore(ok){
  if(quizScored) return;
  quizScored = true;
  if(ok){
    quizStats.correct++;
    quizStats.streak++;
    if(quizStats.streak > quizStats.best) quizStats.best = quizStats.streak;
  } else {
    quizStats.streak = 0;
  }
}
function drawQuizScore(ctx){
  const txt = 'もんだい ' + quizStats.asked + '　せいかい ' + quizStats.correct +
              '　れんぞく ' + quizStats.streak + '（さいこう ' + quizStats.best + '）';
  ctx.save();
  ctx.font='bold 15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle='white'; ctx.lineWidth=4; ctx.strokeText(txt, sw/2, TAB_H+16);
  ctx.fillStyle='#111'; ctx.fillText(txt, sw/2, TAB_H+16);
  ctx.restore();
}

quizMaxEl.addEventListener('input', ()=>{
  quizMax = parseInt(quizMaxEl.value,10);
  quizMaxVal.textContent = String(quizMax);
});
quizMaxEl.addEventListener('change', ()=>{ if(mode==='quiz') quizNewPuzzle(); });
quizLimitEl.addEventListener('click', ()=>{
  quizLimitIdx = (quizLimitIdx+1) % QUIZ_LIMITS.length;
  quizLimitEl.textContent = quizLimitLabel();
  if(mode==='quiz') quizNewPuzzle();
});
for(const btn of document.querySelectorAll('.opBtn')){
  btn.addEventListener('click', ()=>{
    const op = btn.dataset.op;
    const i = quizOps.indexOf(op);
    if(i>=0){ if(quizOps.length>1){ quizOps.splice(i,1); btn.classList.remove('on'); } }  // 最低1つは残す
    else    { quizOps.push(op); btn.classList.add('on'); }
    if(mode==='quiz') quizNewPuzzle();
  });
}

// ─── Background ───────────────────────────────────────────────────────────────
function drawBG(ctx){
  const grad=ctx.createLinearGradient(0,0,0,sh);
  grad.addColorStop(0,'#a0d2ff'); grad.addColorStop(1,'#d2eeff');
  ctx.fillStyle=grad; ctx.fillRect(0,0,sw,sh);
  const groundY=sh-GH-bottomPanelH();
  ctx.fillStyle='rgb(160,230,160)'; ctx.fillRect(0,groundY,sw,GH);
}

// ─── Hit test ─────────────────────────────────────────────────────────────────
function ptInRect(px,py,x,y,w,h){ return px>=x&&px<=x+w&&py>=y&&py<=y+h; }
function blockHit(b,x,y){ return ptInRect(x,y,b.x-14,b.y-20,b.width+28,b.height+34); }
function getPos(e,t){
  const rect=canvas.getBoundingClientRect();
  return {x:(t.clientX-rect.left)*(sw/rect.width),y:(t.clientY-rect.top)*(sh/rect.height)};
}

// ─── Event handlers ───────────────────────────────────────────────────────────
function handleStart(x,y,pid){
  for(const sb of sizeBtns){ if(ptInRect(x,y,sb.x,sb.y,sb.w,sb.h)){ setBlockSize(sb.val); return; } }
  for(const tb of tabBtns){ if(ptInRect(x,y,tb.x,tb.y,tb.w,tb.h)){ setMode(tb.val); return; } }
  for(const gb of toggleBtns){ if(ptInRect(x,y,gb.x,gb.y,gb.w,gb.h)){ setQuizOn(!quizOn); return; } }
  // 正解演出の途中なら、どこをタップしても次へ進む。見終わった子を待たせない。
  if(puzzle && puzzle.phase==='correct'){ puzzle.phase='done'; return; }
  // こたえ表示中：演算子を押せば同じ2体で別の計算に。それ以外を押せば閉じる。
  if(puzzle && puzzle.phase==='answer'){
    for(const r of puzzle._getOpRects()){
      if(ptInRect(x,y,r.x,r.y,r.w,r.h)){ puzzle.setOp(r.op); return; }
    }
    puzzle.phase='done'; return;
  }
  if(mode==='factor'){ handleFactorTap(x,y); return; }
  if(mode==='quiz'){
    // ドリル中は選択肢のタップだけ受け付ける（キャラの操作や数字パッドは無い）
    if(puzzle && puzzle.phase==='countdown'){
      for(const r of puzzle._getChoiceRects()){ if(ptInRect(x,y,r.x,r.y,r.w,r.h)){ puzzle.tapChoice(r.idx); return; } }
    }
    return;
  }
  if(puzzle){
    if(puzzle.phase==='countdown'){
      for(const r of puzzle._getChoiceRects()){ if(ptInRect(x,y,r.x,r.y,r.w,r.h)){ puzzle.tapChoice(r.idx); return; } }
    }
    return;
  }
  for(const b of getNumpadLayout()){
    if(ptInRect(x,y,b.x,b.y,b.w,b.h)){
      if(b.val==='R') spawnBlock(Math.floor(Math.random()*100)+1);
      else if(b.val==='CLR'){ clrHold={pid:pid, t0:Date.now()}; }   // 長押しで実行
      else spawnBlock(Number(b.val));
      return;
    }
  }
  for(let i=blocks.length-1;i>=0;i--){
    const b=blocks[i];
    if(blockHit(b,x,y)){
      // ダブルタップでの削除は誤爆が多いので廃止した。
      // 消したいときは「おうち」へドラッグする（ミラーと対の操作）。
      dragPointers[pid]={x,y,offX:x-b.x,offY:y-b.y,block:b};
      dragBlock=b; dragPtr={x:x,y:y}; blocks.splice(i,1); blocks.push(b); return;
    }
  }
}

// マジックミラーにキャラを入れたときの複製。元のキャラはそのまま残る。
function duplicateAtMirror(b){
  const m=getMirrorRect();
  // ミラーまで勢いよく運んでくるので、そのままだと元のキャラが上へ飛んでいく。
  // 速度を消して、ミラーの真下から落としなおす。
  if(m){ b.vx=0; b.vy=0; b.y=Math.max(b.y, m.y+m.h+4); }
  if(m && blocks.length < MAX_BLOCKS){
    const copy=new NumberBlock(b.num, m.x+m.w/2, m.y+m.h+4);
    copy.x = m.x + m.w/2 - copy.width/2;
    // 元のキャラは真下に落ちるので、複製は左斜め下へ飛ばす。
    // 2体が別々の方向に分かれるので「増えた」ことがはっきり分かる。
    copy.vx = -7; copy.vy = -1.5;
    copy.launch = 48;        // このあいだは整列に引っぱられず自由に飛ぶ
    copy.birth = 0;          // 鏡から「ぽんっ」と出てくる
    blocks.push(copy);
    mirrorFlash = 1; mirrorRing = 1; mirrorAfter = 1; mirrorHandoff = 1;
    const px=m.x+m.w/2, py=m.y+m.h;
    for(let i=0;i<22;i++) fxParticles.push(new Particle(px,py));
  }
  updateTargets();
}

function handleMove(x,y,pid){
  if(clrHold && clrHold.pid===pid){
    const btn=getNumpadLayout().find(n=>n.val==='CLR');
    if(!btn || !ptInRect(x,y,btn.x-10,btn.y-10,btn.w+20,btn.h+20)) clrHold=null;
    return;
  }
  const ptr=dragPointers[pid]; if(!ptr) return;
  const b=ptr.block; b.vx=x-ptr.x; b.vy=y-ptr.y; b.x=x-ptr.offX; b.y=y-ptr.offY; ptr.x=x; ptr.y=y;
  if(b===dragBlock) dragPtr={x:x,y:y};
}

function handleEnd(x,y,pid){
  if(clrHold && clrHold.pid===pid){ clrHold=null; return; }   // 途中で離した＝中止
  const ptr=dragPointers[pid]; if(!ptr){ dragBlock=null; dragPtr=null; return; }
  const b=ptr.block; delete dragPointers[pid]; dragBlock=null; dragPtr=null;
  // マジックミラーの上で離した → そのキャラを複製する（合体はしない）
  if(isOverMirror(x,y)){ duplicateAtMirror(b); return; }
  // おうちの上で離した → そのキャラは帰る（画面から消える）
  if(isOverHome(x,y)){ sendHome(b); return; }
  let best=null,bestD=Infinity;
  for(const other of blocks){
    if(other===b) continue;
    const d=Math.hypot(b.cx-other.cx,b.cy-other.cy);
    if(d<80&&canCalc(b,other,mode)&&d<bestD){ bestD=d; best=other; }
  }
  if(best){ blocks=blocks.filter(bl=>bl!==b&&bl!==best); puzzle=new Puzzle(b,best,mode); }
  updateTargets();
}

// ─── Mode switching ───────────────────────────────────────────────────────────
function setMode(newMode){
  // 計算モード（＋−×÷）どうしの行き来ならキャラを残す。因数・ドリルを跨ぐときは片付ける
  const isCalc = m => m!=='factor' && m!=='quiz';
  if(!isCalc(mode) || !isCalc(newMode)) blocks=[];
  mode=newMode; puzzle=null; dragBlock=null; dragPtr=null; dragPointers={}; clrHold=null;
  fxParticles=[]; mirrorFlash=0; mirrorRing=0; mirrorReflect=0; mirrorReflectNum=0;
  homeFlash=0; homeOpen=0; homeNum=0; homeAfter=0; mirrorAfter=0; mirrorHandoff=0;
  factorUI.classList.toggle('visible',newMode==='factor');
  quizUI.classList.toggle('visible',newMode==='quiz');
  if(newMode==='factor'){ buildFactorRows(factorVal); updateFactorTargets(); factorReveal={}; }
  if(newMode==='quiz'){ quizReset(); }
  updateTargets();
}

// ─── Touch / Mouse ────────────────────────────────────────────────────────────
// ─── ブラウザのジェスチャ対策 ─────────────────────────────────────────────
// Safari はピンチ・ダブルタップ拡大・長押しメニュー・引っぱって更新を
// 勝手に拾ってしまう。キャラのドラッグと取り合いになるので明示的に止める。
['gesturestart','gesturechange','gestureend'].forEach(ev=>{
  document.addEventListener(ev, e=>e.preventDefault(), {passive:false});
});
document.addEventListener('contextmenu', e=>e.preventDefault());          // 長押しメニュー
document.addEventListener('dblclick',   e=>e.preventDefault(), {passive:false}); // ダブルタップ拡大
document.addEventListener('touchmove', e=>{
  // スライダー（因数・ドリルのつまみ）だけはブラウザに操作させる
  if(e.target && e.target.closest && e.target.closest('input,button,a')) return;
  if(e.cancelable) e.preventDefault();
}, {passive:false});

// OS やブラウザに指を横取りされたとき（コントロールセンター、端スワイプ、着信など）は
// touchcancel が飛んでくる。ここで後始末しないとキャラが指に貼りついたままになる。
function cancelDrag(pid){
  const ptr=dragPointers[pid]; if(!ptr) return;
  delete dragPointers[pid];
  ptr.block.vx=0; ptr.block.vy=0;
  if(ptr.block===dragBlock){ dragBlock=null; dragPtr=null; }
  updateTargets();
}
function cancelAllDrags(){
  for(const pid in dragPointers) cancelDrag(pid);
  dragBlock=null; dragPtr=null; mouseDown=false; clrHold=null;
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) cancelAllDrags(); });
window.addEventListener('blur', cancelAllDrags);

canvas.addEventListener('touchstart',e=>{ e.preventDefault(); for(const t of e.changedTouches){ const {x,y}=getPos(e,t); handleStart(x,y,t.identifier); } },{passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); for(const t of e.changedTouches){ const {x,y}=getPos(e,t); handleMove(x,y,t.identifier); } },{passive:false});
canvas.addEventListener('touchend',  e=>{ e.preventDefault(); for(const t of e.changedTouches){ const {x,y}=getPos(e,t); handleEnd(x,y,t.identifier); } },{passive:false});
canvas.addEventListener('touchcancel', e=>{ for(const t of e.changedTouches) cancelDrag(t.identifier); },{passive:false});

let mouseDown=false;
canvas.addEventListener('mousedown',e=>{ mouseDown=true; const rect=canvas.getBoundingClientRect(); handleStart((e.clientX-rect.left)*(sw/rect.width),(e.clientY-rect.top)*(sh/rect.height),'mouse'); });
canvas.addEventListener('mousemove',e=>{ if(!mouseDown) return; const rect=canvas.getBoundingClientRect(); handleMove((e.clientX-rect.left)*(sw/rect.width),(e.clientY-rect.top)*(sh/rect.height),'mouse'); });
canvas.addEventListener('mouseup',  e=>{ if(!mouseDown) return; mouseDown=false; const rect=canvas.getBoundingClientRect(); handleEnd((e.clientX-rect.left)*(sw/rect.width),(e.clientY-rect.top)*(sh/rect.height),'mouse'); });

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastTime=0;
function loop(ts){
  const dt=Math.min(ts-lastTime,100); lastTime=ts; walkTime+=dt;
  ctx.clearRect(0,0,sw,sh); drawBG(ctx); drawTabsAndUI(ctx);
  if(mode==='factor'){
    lerpFactorBlocks(); drawFactorMode(ctx,walkTime);
  } else if(mode==='quiz'){
    // 解き終わったら（正解演出が終わる／時間切れ）すぐ次の問題へ。ずっと続く。
    // ここで間を置くと、その間 puzzle.draw() が「正解画面」ではなく問題を
    // もう一度描いてしまい、同じ問題が出たように見えるので待たせない。
    if(!puzzle) quizNewPuzzle();
    else {
      puzzle.update(dt);
      if(puzzle.phase==='timeout') quizScore(false);
      if(puzzle.phase==='timeout'||puzzle.phase==='done') quizNewPuzzle();
    }
    puzzle.draw(ctx,walkTime);
    drawQuizScore(ctx);
  } else {
    if(puzzle){
      puzzle.update(dt);
      if(puzzle.phase==='timeout'||puzzle.phase==='done'){
        blocks.push(new NumberBlock(puzzle.charRes.num,puzzle.mergeX,TAB_H+20));
        puzzle=null; updateTargets();
      } else {
        puzzle.draw(ctx,walkTime);
      }
    } else {
      applyPhysics();
      for(const b of blocks){ if(b===dragBlock) continue; b.draw(ctx,walkTime,0); }
      if(dragBlock){
        let bestMerge=null,bestMergeD=Infinity;
        for(const o of blocks){
          if(o===dragBlock) continue;
          const d=Math.hypot(dragBlock.cx-o.cx,dragBlock.cy-o.cy);
          if(d<80&&canCalc(dragBlock,o,mode)&&d<bestMergeD){ bestMergeD=d; bestMerge=o; }
        }
        for(const o of blocks){
          if(o===dragBlock) continue;
          const d=Math.hypot(dragBlock.cx-o.cx,dragBlock.cy-o.cy);
          if(d<100){
            if(o===bestMerge) drawOKGlow(ctx,o,walkTime);
            else if(!canCalc(dragBlock,o,mode)) drawNoEntry(ctx,o.cx,o.y-28,22);
          }
        }
        // ミラーに入りかけているときは、持っているキャラを薄くする。
        // 「実体が鏡に吸い込まれ、代わりに鏡の中に映っている」という見え方にする。
        const fade = Math.max(mirrorReflect, homeOpen);
        if(fade > 0.02){
          ctx.save();
          ctx.globalAlpha = 1 - 0.55*fade;
          dragBlock.draw(ctx,walkTime,0);
          ctx.restore();
        } else {
          dragBlock.draw(ctx,walkTime,0);
        }
      }
      // ミラーとおうちは最後に描く。持っているキャラで隠れると、
      // 鏡の中の映り込みや扉のあかりが見えなくなってしまうため。
      drawMirror(ctx, walkTime);
      drawHome(ctx, walkTime);
      // マジックミラーの紙吹雪
      for(const fp of fxParticles) fp.update();
      fxParticles = fxParticles.filter(fp=>fp.life>0);
      for(const fp of fxParticles) fp.draw(ctx);
      drawFormula(ctx);
      drawNumpad(ctx);
      drawKeyInput(ctx, dt);
    }
  }
  requestAnimationFrame(loop);
}

// ─── キーボード召喚（デバッグ・確認用）────────────────────────────────────────
// 数字を続けて打って Enter で、その数のキャラを出す（47 → 4,7,Enter）。
// 特定のキャラをすぐ出せるので、見た目の確認に使う。
//   数字      入力（画面左上に表示。3桁まで＝最大100）
//   Enter     召喚
//   Esc       入力を取り消す
//   Backspace 1文字消す
//   R         ランダムに1体（小さい数ほど出やすい）
//   C / Delete 全部消す
let keyInput = '';           // 入力中の数字（文字列）
let keyFlash = 0;            // 入力できなかったときの赤い点滅（ms）
function keySummon(){
  const v = parseInt(keyInput, 10);
  keyInput = '';
  if(isNaN(v) || v < 1 || v > 100){ keyFlash = 600; return; }   // 1〜100 の外
  if(blocks.length >= MAX_BLOCKS){ keyFlash = 600; return; }     // 置ける数の上限
  spawnBlock(v);
}
document.addEventListener('keydown', e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;   // ブラウザのショートカットは邪魔しない
  if(mode === 'factor' || mode === 'quiz') return;  // 因数・ドリルはキャラを出さないので対象外
  if(puzzle) return;                               // クイズ中は入力を受けない
  if(e.key >= '0' && e.key <= '9'){
    if(keyInput.length < 3) keyInput += e.key;
    e.preventDefault();
  } else if(e.key === 'Enter'){
    keySummon(); e.preventDefault();
  } else if(e.key === 'Escape'){
    keyInput = ''; e.preventDefault();
  } else if(e.key === 'Backspace'){
    keyInput = keyInput.slice(0, -1); e.preventDefault();
  } else if(e.key === 'r' || e.key === 'R'){
    // 小さい数ほど出やすくする（1 が最も出やすい）
    let total = 0; const wts = [];
    for(let i=1;i<=100;i++){ const wt = 101 - i; wts.push(wt); total += wt; }
    let pick = Math.random() * total, num = 1;
    for(let i=0;i<100;i++){ pick -= wts[i]; if(pick <= 0){ num = i+1; break; } }
    if(blocks.length >= MAX_BLOCKS) keyFlash = 600; else spawnBlock(num);
    e.preventDefault();
  } else if(e.key === 'c' || e.key === 'C' || e.key === 'Delete'){
    blocks = []; updateTargets(); e.preventDefault();
  }
});

/** 入力中の数字を画面左上に出す（今なにを打っているか分かるように） */
function drawKeyInput(ctx, dt){
  keyFlash = Math.max(0, keyFlash - dt);
  if(!keyInput && !keyFlash) return;
  const label = keyInput || '×';
  const bw = 96, bh = 44, bx = 6, by = TAB_H + 6;
  ctx.save();
  ctx.fillStyle = keyFlash > 0 ? 'rgba(200,30,30,0.88)' : 'rgba(0,0,0,0.62)';
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8); ctx.stroke();
  ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(label, bx + bw/2, by + bh/2 - 5);
  ctx.font = '10px sans-serif';
  ctx.fillText(keyFlash > 0 ? '出せません' : 'Enterで出す', bx + bw/2, by + bh - 9);
  ctx.restore();
}

// ─── Fullscreen ───────────────────────────────────────────────────────────────
const fsBtn = document.getElementById('fs-btn');
function updateFsIcon(){ fsBtn.textContent = document.fullscreenElement ? '✕' : '⛶'; }
fsBtn.addEventListener('click', ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});
document.addEventListener('fullscreenchange', updateFsIcon);

// ─── 図鑑での編集をその場で受け取る ───────────────────────────────────────────
// zukan.html を別ウィンドウで開いて調整すると、共通エンジンが変更を検知して
// ここを呼ぶ。かたちが変わるとブロックの縦横も変わるので、外形を計算し直して
// 並べ直す（描画は毎フレーム行われるので、ここでは寸法の更新だけでよい）。
onNumberblocksChanged(function(){
  for(const b of blocks) b._computeShape();
  updateTargets();
  if(mode === 'factor'){
    for(const row of factorBlocks) for(const nb of row.blocks) nb._computeShape();
    updateFactorTargets();
  }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
quizMaxEl.value = String(quizMax); quizMaxVal.textContent = String(quizMax);
quizLimitEl.textContent = quizLimitLabel();
setMode('+');
requestAnimationFrame(loop);
</script>
