}

// ─── きろくの せいり ──────────────────────────────────────────
// レベルごとに消す／ぜんぶ消す／もうひとりへ移す。
// 消す前にはかならず「ほんとうに？」とたずねる。
function drawRecordPanel(ctx){
  const id = profile().id;
  const rowH = 30, w = Math.min(344, sw-20);
  const moveRows = PROFILES.length - 1;
  const touchH = 26 + PROFILES.length*18;   // ゆびの おおきさ（1人1行）
  const h = 46 + 34 + TASK_LEVELS.length*rowH + 12 + 34 + rowH + 8 + moveRows*rowH + 8 + touchH + 12 + 52;
  const x = (sw-w)/2, y = Math.max(TAB_H+6, (sh-h)/2);

  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,TAB_H,sw,sh-TAB_H);
  ctx.fillStyle='#fdfdff';
  ctx.beginPath(); ctx.roundRect(x,y,w,h,14); ctx.fill();
  ctx.strokeStyle='rgba(60,80,110,0.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,14); ctx.stroke();

  ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.fillStyle='#16233a'; ctx.font='bold 18px sans-serif';
  ctx.fillText('きろくの せいり' + (begOf(id) ? '（ビギナー）' : ''), x+16, y+26);

  // どちらの子の記録をいじるか
  let ty = y+46;
  const tw=76, th=28;
  PROFILES.forEach((pr,i)=>{
    const bx = x+16 + i*(tw+6), on = (i===profileIdx);
    ctx.fillStyle = on ? pr.color : 'rgba(225,231,240,0.95)';
    ctx.beginPath(); ctx.roundRect(bx,ty,tw,th,8); ctx.fill();
    ctx.fillStyle = on ? '#fff' : '#66748a';
    ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
    ctx.fillText(pr.name + ' ' + clearedCountOf(pr.id, begOf(pr.id)), bx+tw/2, ty+th/2);
    stageBtns.push({x:bx,y:ty,w:tw,h:th,val:'recProf',i:i});
  });
  ctx.textAlign='left';
  ty += 34;

  // 1行ぶんを描く。たずねている最中は「はい／やめる」に入れかわる
  const row = (label, count, kind, lv, tone) => {
    const asking = recConfirm && recConfirm.kind===kind && recConfirm.lv===lv;
    ctx.textAlign='left';
    ctx.fillStyle = asking ? '#c0392b' : '#2b3a52';
    ctx.font = (kind==='level' ? '13px' : 'bold 13px') + ' sans-serif';
    ctx.fillText(asking ? 'ほんとうに いい？' : label, x+16, ty+14);
    if(!asking && count !== null){
      ctx.fillStyle='#8a97a8'; ctx.font='bold 12px sans-serif'; ctx.textAlign='right';
      ctx.fillText(count, x+w-84, ty+14);
      ctx.textAlign='left';
    }
    if(asking){
      const yw=42, nw=50, nx=x+w-16-nw, yx=nx-yw-6;
      drawCardBtn(ctx, yx, ty, yw, 26, 'はい',   'rgba(200,60,50,0.95)',   '#fff');
      drawCardBtn(ctx, nx, ty, nw, 26, 'やめる', 'rgba(228,233,242,0.98)', '#22314a');
      stageBtns.push({x:yx,y:ty,w:yw,h:26,val:'recYes'});
      stageBtns.push({x:nx,y:ty,w:nw,h:26,val:'recNo'});
    } else {
      const bw2 = (kind==='move') ? 62 : 48, bx2 = x+w-16-bw2;
      const lbl = (kind==='move') ? 'うつす' : 'けす';
      const col = (kind==='move') ? 'rgba(60,110,240,0.95)' : (tone||'rgba(228,233,242,0.98)');
      drawCardBtn(ctx, bx2, ty, bw2, 26, lbl, col, (kind==='move')?'#fff':'#22314a');
      stageBtns.push({x:bx2,y:ty,w:bw2,h:26,val:'recAsk',kind:kind,lv:lv});
    }
    ty += rowH;
  };

  for(let lv=0; lv<TASK_LEVELS.length; lv++){
    row('レベル' + (lv+1) + '  ' + TASK_LEVELS[lv].name,
        levelCountOf(id, lv, begOf(id)) + ' / ' + levelSize(lv), 'level', lv);
  }

  ctx.strokeStyle='rgba(60,80,110,0.18)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+16,ty-4); ctx.lineTo(x+w-16,ty-4); ctx.stroke();
  ty += 8;

  row('ぜんぶ けす', clearedCountOf(id, begOf(id)) + ' / ' + TASKS.length, 'all', -1, 'rgba(255,214,214,0.98)');
  // まぜまぜの とけいの レベルを はじめ（ちょうど）に もどす
  row('とけいの レベルを 1に もどす', 'いま ' + clockStatsOf(id).lv, 'clock', -1);
  row('ひっさんの レベルを 1に もどす', 'いま ' + hissanStatsOf(id).lv, 'hissan', -1);
  ty += 8;
  // うつす先は1人ずつ。たずねるときに どの行か分かるよう、lv に行き先の番号を入れる
  PROFILES.forEach((pr, i) => {
    if(i === profileIdx) return;
    row(profile().name + ' の きろくを ' + pr.name + ' へ', null, 'move', i);
  });

  // ゆびの おおきさ。いつか自動で見分けられるか判断するための下調べ。
  // ふたつの山が離れていれば見分けられるし、重なっていれば無理と分かる。
  ty += 10;
  ctx.strokeStyle='rgba(60,80,110,0.18)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+16,ty-6); ctx.lineTo(x+w-16,ty-6); ctx.stroke();
  ctx.textAlign='left'; ctx.fillStyle='#5a6a80'; ctx.font='bold 11px sans-serif';
  ctx.fillText('ゆびの おおきさ', x+16, ty+6);
  ty += 16;
  const gw = 132, bwid = gw/TOUCH_BINS, gx = x+60;
  PROFILES.forEach((pr,i)=>{
    const st = touchStats[pr.id] || emptyTouch();
    const yy = ty + i*18;
    ctx.textAlign='left'; ctx.fillStyle='#2b3a52'; ctx.font='bold 11px sans-serif';
    ctx.fillText(pr.name, x+16, yy+7);
    let mx = 1;
    for(const v of st.hist) if(v > mx) mx = v;
    for(let k=0;k<TOUCH_BINS;k++){
      const hh = Math.max(1, (st.hist[k]/mx)*13);
      ctx.fillStyle = pr.color;
      ctx.globalAlpha = st.n ? 0.85 : 0.15;
      ctx.fillRect(gx + k*bwid, yy+13-hh, bwid-1.5, hh);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign='right'; ctx.fillStyle='#8a97a8'; ctx.font='10px sans-serif';
    ctx.fillText(st.n ? ((st.sum/st.n).toFixed(1) + ' ・ ' + st.n + 'かい') : 'まだ なし',
                 x+w-16, yy+7);
  });
  ctx.textAlign='left';

  const bh=34, by=y+h-bh-12;
  drawCardBtn(ctx, x+16, by, w-32, bh, 'とじる', 'rgba(228,233,242,0.98)', '#22314a');
  stageBtns.push({x:x+16,y:by,w:w-32,h:bh,val:'recClose'});
  ctx.restore();
}

// クリアしたステージの「どうやって解いたか」
function drawStageDetail(ctx, idx){
  const task = TASKS[idx]; if(!task) return;
  const steps = taskLogs[idx] || [];
  const lines = [];
  if(!steps.length) lines.push('（てじゅんの きろくが ないよ）');
  else if(steps.length<=12) for(const st of steps) lines.push(stepText(st));
  else {
    for(let i=0;i<6;i++) lines.push(stepText(steps[i]));
    lines.push('… ほか ' + (steps.length-11) + ' て …');
    for(let i=steps.length-5;i<steps.length;i++) lines.push(stepText(steps[i]));
  }
  const lh = 20;
  const w = Math.min(330, sw-32);
  const h = 98 + lines.length*lh + 50;
  const x = (sw-w)/2, y = Math.max(TAB_H+10, (sh-h)/2);

  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,TAB_H,sw,sh-TAB_H);
  ctx.fillStyle='#fdfdff';
  ctx.beginPath(); ctx.roundRect(x,y,w,h,14); ctx.fill();
  ctx.strokeStyle=TASK_LEVELS[task.lv||0].color; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,14); ctx.stroke();

  ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.fillStyle='#5a6a80'; ctx.font='bold 11px sans-serif';
  ctx.fillText(stageLabel(idx) + (begMode() ? '　ビギナー' : '　つかえる ' + task.use.join(' と ')), x+16, y+20);
  ctx.fillStyle='#16233a'; ctx.font='bold 21px sans-serif';
  ctx.fillText(task.n + ' の てじゅん', x+16, y+44);
  // 手数くらべ。ここは「振り返る場所」なので、ならべて見せてよい。
  if(steps.length && !begMode()){
    const nice = steps.length <= (task.ref||task.best) + REF_SLACK;
    let cx = x+16;
    const put = (label, val, col, bold) => {
      ctx.fillStyle = col; ctx.font = (bold?'bold ':'') + '11px sans-serif';
      const t = label + ' ' + val + 'て';
      ctx.fillText(t, cx, y+62); cx += ctx.measureText(t).width + 10;
    };
    put('きみ', steps.length, nice ? '#c08a20' : '#2b3a52', true);
    put('おてほん', (task.ref||task.best), '#5a6a80');
    ctx.fillStyle='#a8b4c4'; ctx.font='10px sans-serif';
    ctx.fillText('きかいのさいたん ' + task.best + 'て', cx, y+62);
    // ほかの人の記録（ある人だけ）
    cx = x+16;
    for(const pr of otherProfiles()){
      const m = recordOf(pr.id, idx);
      if(m === null) continue;
      ctx.fillStyle = pr.color; ctx.font = 'bold 11px sans-serif';
      const tx = pr.name + ' ' + m + 'て';
      ctx.fillText(tx, cx, y+78); cx += ctx.measureText(tx).width + 12;
    }
  }

  ctx.font='15px sans-serif'; ctx.fillStyle='#2b3a52';
  lines.forEach((ln,i)=>{ ctx.fillText(ln, x+18, y+104+i*lh); });

  const bh=34, by=y+h-bh-12, bw=(w-40)/2;
  drawCardBtn(ctx, x+16, by, bw, bh, 'もういちど', 'rgba(60,110,240,0.95)', '#fff');
  drawCardBtn(ctx, x+24+bw, by, bw, bh, 'とじる', 'rgba(228,233,242,0.98)', '#22314a');
  stageBtns.push({x:x+16,y:by,w:bw,h:bh,val:'retry',idx:idx});
  stageBtns.push({x:x+24+bw,y:by,w:bw,h:bh,val:'closeDetail'});
  ctx.restore();
}

// ステージいちらんのタップ
function handleStageTap(x,y,pid){
  for(let i=stageBtns.length-1;i>=0;i--){
    const b = stageBtns[i];
    if(!ptInRect(x,y,b.x,b.y,b.w,b.h)) continue;
    // きろくパネルを出しているあいだは、そのボタンだけ受け付ける
    if(recOpen){
      if(b.val==='recProf'){ setProfile(b.i); recConfirm=null; askOnListClose=true; }
      // 消すのも移すのも取り返しがつかないので、かならず一度たずねる
      else if(b.val==='recAsk'){ recConfirm = { kind:b.kind, lv:b.lv }; }
      else if(b.val==='recYes'){
        if(recConfirm){
          if(recConfirm.kind==='level')     clearLevelRecords(profile().id, recConfirm.lv);
          else if(recConfirm.kind==='all')  clearAllRecords(profile().id);
          else if(recConfirm.kind==='clock'){ const st = clockStats(); st.lv = 1; st.hist = []; saveTask(); }
          else if(recConfirm.kind==='hissan'){ const st = hissanStats(); st.lv = 1; st.hist = []; saveTask(); }
          else if(recConfirm.kind==='move' && PROFILES[recConfirm.lv]){
            moveRecords(profile().id, PROFILES[recConfirm.lv].id);
          }
        }
        recConfirm = null;
      }
      else if(b.val==='recNo'){ recConfirm = null; }
      else if(b.val==='recClose'){ recOpen=false; recConfirm=null; }
      return true;
    }
    // 記録にさわるボタンは長押しでだけ開く。押した瞬間には何もしない。
    if(b.val==='mode'){ if(stageDetail < 0) setBegMode(b.v); return true; }
    if(b.val==='mix'){ if(stageDetail < 0) setMix(b.v); return true; }
    if(b.val==='prof' || b.val==='rec'){
      stageHold = { val:b.val, i:b.i, t0:Date.now(), pid:pid,
                    rect:{x:b.x,y:b.y,w:b.w,h:b.h}, sx:x, sy:y };
    }
    else if(b.val==='close'){
      stageOpen=false; stageDetail=-1;
      // きろくをのぞいたあとは、だれの番か決め直してから遊ぶ
      if(askOnListClose){ askOnListClose=false; whoOpen=true; }
    }
    else if(b.val==='closeDetail'){ stageDetail=-1; }
    else if(b.val==='retry'){ startTask(b.idx); }
    else if(b.val==='go'){
      // 詳細を出しているあいだは、うしろのマス目には反応させない
      if(stageDetail>=0) return true;
      if(taskCleared[b.idx]) stageDetail = b.idx;
      else startTask(b.idx);
    }
    return true;
  }
  return true;   // いちらんの外を押しても、後ろのゲームには届かせない
}

// 目標の数のキャラができたかを見る
function checkTask(){
  if(!taskActive() || taskDone) return;
  const t = currentTask();
  if(blocks.some(b=>b.num===t.n)){
    taskDone = true;
    clearedAt = Date.now(); autoNextOff = false;
    taskCleared[taskIdx] = true;
    const kept = taskLogs[taskIdx];
    const prevOwn = kept ? kept.length : null;
    const moves = taskLog.length;
    const rainbow = begMode() && !usedOther;
    const praise = rainbow ? { text:RAINBOW_TEXT, color:'#c0398a', big:true, rainbow:true }
                           : judgeClear(taskIdx, moves, prevOwn);
    lastRainbow = rainbow;
    if(rainbow){ const cr = curRec(); cr.rainbow = cr.rainbow || {}; cr.rainbow[taskIdx] = true; }
    if(!kept || moves < kept.length) taskLogs[taskIdx] = taskLog.slice();
    saveTask();
    notePrize(t.n);
    const win = blocks.find(b=>b.num===t.n);
    winFx = { block:win, num:t.n, t:0, praise:praise, moves:moves,
              arc: rainbow ? rainbowArcPlace() : null, stampAt: stampPlace(),
              landedAt: null, life: rainbow ? RAINBOW_LIFE : WIN_MS };
    if(win){
      win.vy = -9; win.onGround = false;              // うれしくて跳ねる
      for(let i=0;i<70;i++) fxParticles.push(new Particle(win.cx, win.y + win.height*0.35));
    } else {
      for(let i=0;i<40;i++) fxParticles.push(new Particle(sw/2, TAB_H+120));
    }
  }
}

// ─── Background ───────────────────────────────────────────────────────────────
// 青みどりの空、流れる雲、奥にかさなる まるいお山、はしっこの木と茂み、草はらの花。
// キャラと数字が主役なので、景色は ぜんぶキャラのうしろに置き、色は うすく やさしく、
// 木や茂みは 画面の左右に寄せて まん中（キャラが並ぶところ）を空けておく。
// 絵のファイルは使わず ぜんぶ描くので、どの画面の大きさにも そのまま合う。

// 雲。x と y は空の中での位置（0〜1）、s は大きさ、v は流れる速さ（px/ミリ秒）。
// お山のうしろから少しのぞく高さにも置く。
const CLOUDS = [
  { x:0.08, y:0.50, s:1.00, v:0.0045 },
  { x:0.46, y:0.26, s:1.35, v:0.0030 },
  { x:0.80, y:0.58, s:0.90, v:0.0055 },
];
// ふわふわの雲を1つ。下に うすい影をつけて まるみを出す
function drawCloud(ctx, x, y, s){
  const r = 24*s;
  const puffs = [[-1.55,0.30,0.70],[-0.80,-0.10,0.98],[0.15,-0.38,1.15],[1.05,-0.08,0.95],[1.75,0.28,0.68]];
  const blob = (dy, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    for(const [px,py,pr] of puffs){
      ctx.moveTo(x + px*r + pr*r, y + py*r + dy);
      ctx.arc(x + px*r, y + py*r + dy, pr*r, 0, Math.PI*2);
    }
    ctx.fill();
    ctx.beginPath();                                   // そこは たいらに
    ctx.roundRect(x - 2.1*r, y + dy - 0.05*r, 4.2*r, 0.9*r, 0.45*r);
    ctx.fill();
  };
  blob(0.18*r, 'rgba(206,226,238,0.85)');
  blob(0, 'rgba(255,255,255,0.97)');
}

// キャラが立つ 手前の草はらの上のふち（キャラの足もとは これより下にくる）
function groundTopY(){ return sh - GH - bottomPanelH() - 30; }

// まるいお山を横にならべた1まい。cx は横の位置（画面幅に対する割合）
function drawMounds(g, base, list, h, top, bottom){
  const grad = g.createLinearGradient(0, base - h, 0, base);
  grad.addColorStop(0, top); grad.addColorStop(1, bottom);
  g.fillStyle = grad;
  g.beginPath();
  for(const [cx, rx, k] of list){
    const x = cx*sw, rX = rx*sw, rY = h*k;
    g.moveTo(x - rX, base);
    g.ellipse(x, base, rX, rY, 0, Math.PI, 0);
  }
  g.rect(0, base - 1, sw, sh - base + 1);
  g.fill();
}

// まるい木。幹のうえに 葉っぱのかたまりを いくつか重ねる
function drawTree(g, x, base, H){
  const r = H*0.30;
  // 幹
  g.fillStyle = '#b07a4a';
  g.beginPath();
  g.moveTo(x - r*0.16, base);
  g.quadraticCurveTo(x - r*0.10, base - H*0.35, x - r*0.05, base - H*0.60);
  g.lineTo(x + r*0.12, base - H*0.60);
  g.quadraticCurveTo(x + r*0.10, base - H*0.30, x + r*0.22, base);
  g.closePath(); g.fill();
  // 葉っぱ：こい色 → ふつう → あかるい色 の順に重ねて、まるみを出す
  const cy = base - H*0.66;
  const layer = (color, list) => {
    g.fillStyle = color; g.beginPath();
    for(const [dx, dy, k] of list){
      g.moveTo(x + dx*r + k*r, cy + dy*r);
      g.arc(x + dx*r, cy + dy*r, k*r, 0, Math.PI*2);
    }
    g.fill();
  };
  layer('#3f8a4c', [[-0.75,0.25,0.62],[0.75,0.25,0.62],[0,0.35,0.70],[-0.35,-0.45,0.70],[0.45,-0.40,0.68]]);
  layer('#58a55a', [[-0.55,0.05,0.55],[0.55,0.00,0.55],[0,-0.30,0.66],[0,0.15,0.55]]);
  layer('#72bd6b', [[-0.30,-0.45,0.34],[0.25,-0.55,0.30],[-0.60,-0.10,0.24]]);
}

// まるい茂み
function drawBush(g, x, base, r){
  const layer = (color, list) => {
    g.fillStyle = color; g.beginPath();
    for(const [dx, dy, k] of list){
      g.moveTo(x + dx*r + k*r, base + dy*r);
      g.arc(x + dx*r, base + dy*r, k*r, 0, Math.PI*2);
    }
    g.fill();
  };
  layer('#4d9e50', [[-0.7,-0.25,0.55],[0.7,-0.25,0.55],[0,-0.45,0.72],[0,0,0.6]]);
  layer('#69b965', [[-0.35,-0.55,0.42],[0.35,-0.50,0.40]]);
}

// 草はらの小さな花
function drawFlower(g, x, y, r, petal){
  g.fillStyle = petal;
  for(let i=0;i<5;i++){
    const a = i/5*Math.PI*2 - Math.PI/2;
    g.beginPath(); g.arc(x + Math.cos(a)*r, y + Math.sin(a)*r, r*0.72, 0, Math.PI*2); g.fill();
  }
  g.fillStyle = '#ffd84a';
  g.beginPath(); g.arc(x, y, r*0.6, 0, Math.PI*2); g.fill();
}

// 動かない景色は 一度だけ描いて おぼえておく。画面の大きさか 地面の高さが
// 変わったときだけ 描きなおす。虹を はさめるよう「奥」と「手前」の2まいに分けてある。
//   奥（far） … 遠くのお山
//   手前（near）… 近くのお山・木・茂み・草はら・花
let sceneryCache = null, sceneryKey = '';
function sceneryLayers(groundY){
  const key = sw + 'x' + sh + ':' + Math.round(groundY);
  if(sceneryCache && sceneryKey === key) return sceneryCache;
  const mk = () => { const c = document.createElement('canvas');
                     c.width = Math.max(1, sw); c.height = Math.max(1, sh); return c; };
  const far = mk(), near = mk();
  const gTop = groundY - 30;                           // 草はらの上のふち
  const H = Math.max(60, gTop - TAB_H);                // 遊ぶ場所の高さ

  // 奥のお山（うすい）
  drawMounds(far.getContext('2d'), gTop + 6, [[-0.05,0.42,1.0],[0.42,0.40,0.86],[0.92,0.44,0.95]],
             H*0.52, '#f1faec', '#d9eecb');

  // ここから手前
  const g = near.getContext('2d');
  drawMounds(g, gTop + 6, [[0.18,0.38,1.0],[0.72,0.40,0.82],[1.12,0.30,0.9]],
             H*0.30, '#e4f3d6', '#c8e6b1');

  // はしっこの木と茂み（まん中は空けておく）
  const treeH = Math.min(260, H*0.46);
  drawTree(g, sw*0.88, gTop + 8, treeH);
  drawBush(g, sw*0.03, gTop + 10, Math.min(46, H*0.11));
  drawBush(g, sw*0.97, gTop + 12, Math.min(38, H*0.09));

  // 手前の草はら：上はかすんだ色、下ほど あざやか
  const mg = g.createLinearGradient(0, gTop, 0, groundY + GH);
  mg.addColorStop(0, '#bfe6a2'); mg.addColorStop(1, '#94ce6d');
  g.fillStyle = mg;
  g.beginPath(); g.moveTo(0, sh);
  const L = Math.max(50, sw/4.4);
  for(let x = 0; x <= sw + 12; x += 12){
    g.lineTo(x, gTop + 4 - 4*Math.sin(x/L + 4.1));
  }
  g.lineTo(sw, sh); g.closePath(); g.fill();

  // 花：キャラの足もとより下の すき間に、ぽつぽつと
  const fy = groundY + 6, fr = Math.max(2.4, Math.min(3.6, sw/130));
  const flowers = [[0.07,'#ff9fb8'],[0.19,'#ffffff'],[0.31,'#ffb347'],[0.63,'#ffffff'],[0.76,'#ff9fb8'],[0.91,'#ffb347']];
  flowers.forEach(([fx, col], i) => drawFlower(g, fx*sw, fy + (i%2)*9, fr, col));

  sceneryCache = { far, near }; sceneryKey = key;
  return sceneryCache;
}

function drawBG(ctx){
  const groundY = sh - GH - bottomPanelH();
  // 空：上は あざやかな青みどり、地平線に近いほど白っぽく
  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0,    '#6fd0e2');
  g.addColorStop(0.55, '#bde9f0');
  g.addColorStop(1,    '#eaf8f2');
  ctx.fillStyle = g; ctx.fillRect(0, 0, sw, sh);

  // 雲：ゆっくり右へ流れて、画面の右から出たら左から また入る（お山のうしろを通る）
  const skyTop = TAB_H, skyH = Math.max(60, groundY - skyTop);
  const k = Math.min(1.3, Math.max(0.7, sw/393));
  const span = sw + 260*k;
  for(const c of CLOUDS){
    const x = ((c.x*span + walkTime*c.v) % span) - 130*k;
    drawCloud(ctx, x, skyTop + skyH*c.y, c.s*k);
  }

  // 奥のお山 → 虹 → 手前のお山・木・茂み・草はら・花（おぼえておいたものを貼るだけ）。
  // 虹は遠くの空にかかるので、手前の丘や木のうしろに 足がかくれる。
  // （せっていの「にじの ちょうせい」で、重なる場所を かえられる）
  const sc = sceneryLayers(groundY), layer = arcLayer();
  if(layer === 0) drawRainbowArc(ctx);
  ctx.drawImage(sc.far, 0, 0);
  if(layer === 1) drawRainbowArc(ctx);
  ctx.drawImage(sc.near, 0, 0);
  if(layer === 2) drawRainbowArc(ctx);

  // 下の操作パネル（＋−×÷・数字キー）は景色と分けて、落ち着いた色の下地にする。
  // 草の上に半透明のキーを置くと、ひかえめなキーが灰みどりに濁って見えるため。
  const panelTop = sh - bottomPanelH();
  ctx.fillStyle = '#dde9ef';
  ctx.fillRect(0, panelTop, sw, sh - panelTop);
}

// ─── Hit test ─────────────────────────────────────────────────────────────────
function ptInRect(px,py,x,y,w,h){ return px>=x&&px<=x+w&&py>=y&&py<=y+h; }
function blockHit(b,x,y){ return ptInRect(x,y,b.x-14,b.y-20,b.width+28,b.height+34); }
function getPos(e,t){
  const rect=canvas.getBoundingClientRect();
  return {x:(t.clientX-rect.left)*(sw/rect.width),y:(t.clientY-rect.top)*(sh/rect.height)};
}

// ─── Event handlers ───────────────────────────────────────────────────────────
function handleStart(x,y,pid){
  noteSeen();
  // 「だれが あそぶ？」を出しているあいだは、それだけ受け付ける
  if(whoOpen){ handleWhoTap(x,y); return; }
  // せってい を出しているあいだは、それだけ受け付ける（タブの歯車で閉じることもできる）
  if(setOpen){
    const g = tabBtns.find(b => b.val === 'settings');
    if(g && ptInRect(x,y,g.x,g.y,g.w,g.h)){ setOpen = false; return; }
    handleSettingsTap(x,y); return;
  }
  // いちらんを出しているあいだは、ほかのボタンには触れさせない
  if(stageOpen){ handleStageTap(x,y,pid); return; }
  // パレードの とちゅうは、ながおし で つぎの おだいへ（ちょんと おしただけでは すすまない。
  // ひなたが さいごまで 見られるように）。タブと 歯車は そのまま きく。
  if(paradeBreak && y > TAB_H){ paradeHold = { pid, t0: Date.now(), x, y }; return; }
  for(const ob of opBarBtns){
    if(!ptInRect(x,y,ob.x,ob.y,ob.w,ob.h)) continue;
    if(ob.op==='undo') doUndo(); else setMode(ob.op);
    return;
  }
  for(const tb of tabBtns){
    if(!ptInRect(x,y,tb.x,tb.y,tb.w,tb.h)) continue;
    if(tb.val==='settings'){ setOpen = true; stageOpen = false; }
    // おだいに入るときは、かならず「だれが あそぶ？」を聞く（setTaskOn）
    else if(tb.val==='task'){ if(!taskOn) setTaskOn(true); }
    else { if(taskOn) setTaskOn(false); setMode(tb.val); }
    return;
  }
  for(const tb of taskBtns){
    if(!ptInRect(x,y,tb.x,tb.y,tb.w,tb.h)) continue;
    if(tb.val==='hint')        hintOn = !hintOn;
    else if(tb.val==='next')   nextTask();
    else if(tb.val==='stages'){ openStages(); }
    else if(tb.val==='steps'){  openStages(taskIdx); autoNextOff=true; }
    return;
  }
  // 正解演出の途中なら、どこをタップしても次へ進む。見終わった子を待たせない。
  if(puzzle && puzzle.phase==='correct'){ puzzle.phase='done'; return; }
  if(mode==='factor'){ handleFactorTap(x,y); return; }
  if(mode==='clock'){ handleClockStart(x,y); return; }
  if(mode==='quiz'){
    // ドリル中は選択肢のタップだけ受け付ける（キャラの操作や数字パッドは無い）
    if(puzzle && puzzle.phase==='countdown'){
      for(const r of puzzle._getChoiceRects()){ if(ptInRect(x,y,r.x,r.y,r.w,r.h)){ puzzle.tapChoice(r.idx); return; } }
    }
    return;
  }
  if(puzzle){
    if(puzzle.phase==='countdown'){
      for(const r of puzzle._getChoiceRects()){ if(ptInRect(x,y,r.x,r.y,r.w,r.h)){ puzzle.tapChoice(r.idx); return; } }
    }
    return;
  }
  for(const b of getNumpadLayout()){
    if(ptInRect(x,y,b.x,b.y,b.w,b.h)){
      if(b.val==='R') spawnBlock(Math.floor(Math.random()*100)+1);
      else if(b.val==='CLR'){ clrHold={pid:pid, t0:Date.now()}; }   // 長押しで実行
      else spawnBlock(Number(b.val));
      return;
    }
  }
  for(let i=blocks.length-1;i>=0;i--){
    const b=blocks[i];
    if(blockHit(b,x,y)){
      // ダブルタップでの削除は誤爆が多いので廃止した。
      // 消したいときは「おうち」へドラッグする（ミラーと対の操作）。
      dragPointers[pid]={x,y,offX:x-b.x,offY:y-b.y,block:b};
      dragBlock=b; dragPtr={x:x,y:y}; blocks.splice(i,1); blocks.push(b); return;
    }
  }
}

// クイズOFFのときの合体。本物のナンバーブロックスのように、枠も選択肢も出さず
// その場で1体のキャラになる。演出は「生まれる」動きと光の粒だけ。

function fuseBlocks(a, c){
  pushUndo();
  const na=a.num, nc=c.num;
  const cx=(a.cx + c.cx)/2, cy=(a.cy + c.cy)/2;
  const { n1, n2, ans } = calcPair(na, nc, mode);
  logStep(mode, n1, n2, Math.max(1,Math.round(ans)));
  blocks = blocks.filter(bl => bl!==a && bl!==c);
  const res = makeFused(na, nc, mode, ans, cx, cy);
  for(let i=0;i<20;i++) fxParticles.push(new Particle(cx, cy));
}

// 合体後のキャラを、2体がいた場所に置く
function makeFused(na, nc, op, ans, cx, cy){
  const res = new NumberBlock(Math.max(1,Math.round(ans)), 0, 0);
  res.x = Math.min(Math.max(playLeft(), cx - res.width/2), sw-EDGE_MARGIN-res.width);
  res.y = Math.min(Math.max(targetRowY()+2, cy - res.height/2), calcFloor()-res.height);
  res.targetX = res.x; res.birth = 0;
  blocks.push(res);
  updateTargets();
  return res;
}

// マジックミラーにキャラを入れたときの複製。元のキャラはそのまま残る。
function duplicateAtMirror(b){
  const m=getMirrorRect();
  // ミラーまで勢いよく運んでくるので、そのままだと元のキャラが上へ飛んでいく。
  // 速度を消して、ミラーの真下から落としなおす。
  if(m){ b.vx=0; b.vy=0; b.y=Math.max(b.y, m.y+m.h+4); }
  if(m && blocks.length < MAX_BLOCKS){
    pushUndo();
    const copy=new NumberBlock(b.num, m.x+m.w/2, m.y+m.h+4);
    copy.x = m.x + m.w/2 - copy.width/2;
    // 元のキャラは真下に落ちるので、複製は左斜め下へ飛ばす。
    // 2体が別々の方向に分かれるので「増えた」ことがはっきり分かる。
    copy.vx = -7; copy.vy = -1.5;
    copy.launch = 48;        // このあいだは整列に引っぱられず自由に飛ぶ
    copy.birth = 0;          // 鏡から「ぽんっ」と出てくる
    blocks.push(copy);
    logStep('copy', b.num);
    mirrorFlash = 1; mirrorRing = 1; mirrorAfter = 1; mirrorHandoff = 1;
    const px=m.x+m.w/2, py=m.y+m.h;
    for(let i=0;i<22;i++) fxParticles.push(new Particle(px,py));
  }
  updateTargets();
}

function handleMove(x,y,pid){
  if(paradeHold && paradeHold.pid===pid){
    if(Math.hypot(x-paradeHold.x, y-paradeHold.y) > 24) paradeHold = null;   // 指が うごいたら やめ
    return;
  }
  if(stageHold && stageHold.pid===pid){
    if(Math.hypot(x-stageHold.sx, y-stageHold.sy) > 16) stageHold = null;
    return;
  }
  if(mode==='clock'){ handleClockMove(x,y); return; }
  if(clrHold && clrHold.pid===pid){
    const btn=getNumpadLayout().find(n=>n.val==='CLR');
    if(!btn || !ptInRect(x,y,btn.x-10,btn.y-10,btn.w+20,btn.h+20)) clrHold=null;
    return;
  }
  const ptr=dragPointers[pid]; if(!ptr) return;
  const b=ptr.block; b.vx=x-ptr.x; b.vy=y-ptr.y; b.x=x-ptr.offX; b.y=y-ptr.offY; ptr.x=x; ptr.y=y;
  if(b===dragBlock) dragPtr={x:x,y:y};
}

function handleEnd(x,y,pid){
  if(paradeHold && paradeHold.pid===pid){ paradeHold = null; return; }  // 途中で離した＝中止
  if(stageHold && stageHold.pid===pid){ stageHold = null; return; }   // 途中で離した＝中止
  if(mode==='clock'){ if(drum && drum.drag) drumEnd(x, y); clockDrag=null; return; }
  if(clrHold && clrHold.pid===pid){ clrHold=null; return; }   // 途中で離した＝中止
  const ptr=dragPointers[pid]; if(!ptr){ dragBlock=null; dragPtr=null; return; }
  const b=ptr.block; delete dragPointers[pid]; dragBlock=null; dragPtr=null;
  // マジックミラーの上で離した → そのキャラを複製する（合体はしない）
  if(isOverMirror(x,y)){ duplicateAtMirror(b); return; }
  // おうちの上で離した → そのキャラは帰る（画面から消える）
  if(isOverHome(x,y)){ sendHome(b); return; }
  // ×2 / ÷2 の上で離した → そのキャラが2倍・半分になる。
  // できない組み合わせ（奇数の÷2など）は何も起きず、そのまま落ちる。
  for(const id of ['double','half']){
    if(isOverTarget(id,x,y)){ if(canScale(id,b.num)) scaleBlock(b,id); updateTargets(); return; }
  }
  let best=null,bestD=Infinity;
  for(const other of blocks){
    if(other===b) continue;
    const d=blockGap(b,other);
    if(d<MERGE_REACH&&canCalc(b,other,mode)&&d<bestD){ bestD=d; best=other; }
  }
  if(best){
    if(quizOn) { pushUndo(); blocks=blocks.filter(bl=>bl!==b&&bl!==best); puzzle=new Puzzle(b,best,mode); }
    else       { fuseBlocks(b,best); }
  }
  updateTargets();
}

// ─── Mode switching ───────────────────────────────────────────────────────────
function setMode(newMode){
  if(newMode==='calc') newMode = lastOp;
  if(isCalcMode(newMode)) lastOp = newMode;
  if(newMode===mode) return;
  // 計算モード（＋−×÷）どうしの行き来ならキャラを残す。因数・ドリルを跨ぐときは片付ける
  const isCalc = m => m!=='factor' && m!=='quiz';
  if(!isCalc(mode) || !isCalc(newMode)) blocks=[];
  if(!isCalcMode(newMode)){ stageOpen=false; stageDetail=-1; }
  mode=newMode; puzzle=null; dragBlock=null; dragPtr=null; dragPointers={}; clrHold=null; clockDrag=null; clockMerged=false;
  if(!isCalcMode(newMode)){ clearUndo(); opBarBtns = []; }   // ＋−×÷ の当たり判定も すぐ消す
  fxParticles=[]; mirrorFlash=0; mirrorRing=0; mirrorReflect=0; mirrorReflectNum=0;
  homeFlash=0; homeOpen=0; homeNum=0; homeAfter=0; mirrorAfter=0; mirrorHandoff=0;
  for(const k in tgtFx) tgtFx[k]={open:0,after:0,flash:0,num:0};
  factorUI.classList.toggle('visible',newMode==='factor');
  quizUI.classList.toggle('visible',newMode==='quiz');
  if(newMode==='factor'){ buildFactorRows(factorVal); updateFactorTargets(); factorReveal={}; }
  if(newMode==='quiz'){ quizReset(); }
  updateTargets();
}

// ─── Touch / Mouse ────────────────────────────────────────────────────────────
// ─── バージョン表示と再読み込み ───────────────────────────────────────────
// 「今どの版で遊んでいるか」を確かめるための小さな表示。
// 表示しているのはサーバーが返したこのファイルの更新時刻なので、
// 古いキャッシュのまま開いていれば古い時刻が出る。
// すぐ上に数字パッドの「7」があり、連打すると指が触れてしまうので、
// タップでは何も起きない。1秒押し続けたときだけ読み直す（CLRと同じ作法）。
(function(){
  const btn = document.getElementById('ver-btn');
  if(!btn) return;
  const HOLD_MS = 1000;
  const d = new Date(document.lastModified);
  const two = v => String(v).padStart(2,'0');
  const stamp = isNaN(d) ? '-' :
    two(d.getMonth()+1)+'/'+two(d.getDate())+' '+two(d.getHours())+':'+two(d.getMinutes());
  const idle = 'v '+stamp;
  btn.textContent = idle;

  const hint = document.getElementById('ver-hint');
  const fill = hint ? hint.querySelector('.bar i') : null;
  let timer = null, tick = null, t0 = 0;
  function reset(){
    clearTimeout(timer); clearInterval(tick); timer = tick = null;
    if(hint){ hint.classList.remove('show'); if(fill) fill.style.width = '0'; }
  }
  function start(e){
    if(timer) return;
    t0 = Date.now();
    // 押しているあいだの進み具合は、指より上に出す。ボタンの位置だと手で隠れる。
    tick = setInterval(() => {
      const p = Math.min(1, (Date.now()-t0)/HOLD_MS);
      if(p > 0.12 && hint){ hint.classList.add('show'); if(fill) fill.style.width = (p*100)+'%'; }
    }, 40);
    timer = setTimeout(() => {
      reset();
      // キャッシュを避けるため、毎回ちがうURLで読み直す
      const base = location.href.split('?')[0].split('#')[0];
      location.replace(base + '?v=' + Date.now());
    }, HOLD_MS);
  }
  btn.addEventListener('touchstart', e => { e.preventDefault(); start(e); }, {passive:false});
  btn.addEventListener('touchend',    reset);
  btn.addEventListener('touchcancel', reset);
  btn.addEventListener('mousedown',   start);
  btn.addEventListener('mouseup',     reset);
  btn.addEventListener('mouseleave',  reset);
  btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
})();

// ─── ブラウザのジェスチャ対策 ─────────────────────────────────────────────
// Safari はピンチ・ダブルタップ拡大・長押しメニュー・引っぱって更新を
// 勝手に拾ってしまう。キャラのドラッグと取り合いになるので明示的に止める。
['gesturestart','gesturechange','gestureend'].forEach(ev=>{
  document.addEventListener(ev, e=>e.preventDefault(), {passive:false});
});
document.addEventListener('contextmenu', e=>e.preventDefault());          // 長押しメニュー
document.addEventListener('dblclick',   e=>e.preventDefault(), {passive:false}); // ダブルタップ拡大
document.addEventListener('touchmove', e=>{
  // スライダー（因数・ドリルのつまみ）だけはブラウザに操作させる
  if(e.target && e.target.closest && e.target.closest('input,button,a')) return;
  if(e.cancelable) e.preventDefault();
}, {passive:false});

// OS やブラウザに指を横取りされたとき（コントロールセンター、端スワイプ、着信など）は
// touchcancel が飛んでくる。ここで後始末しないとキャラが指に貼りついたままになる。
function cancelDrag(pid){
  const ptr=dragPointers[pid]; if(!ptr) return;
  delete dragPointers[pid];
  ptr.block.vx=0; ptr.block.vy=0;
  if(ptr.block===dragBlock){ dragBlock=null; dragPtr=null; }
  updateTargets();
}
function cancelAllDrags(){
  for(const pid in dragPointers) cancelDrag(pid);
  dragBlock=null; dragPtr=null; mouseDown=false; clrHold=null;
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) cancelAllDrags(); });
window.addEventListener('blur', cancelAllDrags);

canvas.addEventListener('touchstart',e=>{ e.preventDefault(); for(const t of e.changedTouches){
  noteTouchSize(Math.max(t.radiusX||0, t.radiusY||0));   // 指の大きさを静かにためる
  const {x,y}=getPos(e,t); handleStart(x,y,t.identifier); } },{passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); for(const t of e.changedTouches){ const {x,y}=getPos(e,t); handleMove(x,y,t.identifier); } },{passive:false});
canvas.addEventListener('touchend',  e=>{ e.preventDefault(); for(const t of e.changedTouches){ const {x,y}=getPos(e,t); handleEnd(x,y,t.identifier); } },{passive:false});
canvas.addEventListener('touchcancel', e=>{ for(const t of e.changedTouches) cancelDrag(t.identifier); },{passive:false});

let mouseDown=false;
canvas.addEventListener('mousedown',e=>{ mouseDown=true; const rect=canvas.getBoundingClientRect(); handleStart((e.clientX-rect.left)*(sw/rect.width),(e.clientY-rect.top)*(sh/rect.height),'mouse'); });
canvas.addEventListener('mousemove',e=>{ if(!mouseDown) return; const rect=canvas.getBoundingClientRect(); handleMove((e.clientX-rect.left)*(sw/rect.width),(e.clientY-rect.top)*(sh/rect.height),'mouse'); });
canvas.addEventListener('mouseup',  e=>{ if(!mouseDown) return; mouseDown=false; const rect=canvas.getBoundingClientRect(); handleEnd((e.clientX-rect.left)*(sw/rect.width),(e.clientY-rect.top)*(sh/rect.height),'mouse'); });

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastTime=0;
let loopErr = '';
function loop(ts){
  try{ drawFrame(ts); }
  catch(e){ if(!loopErr) loopErr = String((e && e.message) || e); }
  if(loopErr) drawLoopError(ctx);
  requestAnimationFrame(loop);
}

// 一度でもエラーが出たら、画面のすみに小さく出す。
// 手元で確認できないので、これが唯一の手がかりになる。
function drawLoopError(ctx){
  ctx.save();
  ctx.font='9px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillStyle='rgba(180,0,0,0.85)';
  ctx.fillText('!' + loopErr.slice(0,70), 78, sh-4);
  ctx.restore();
}

function drawFrame(ts){
  const dt=Math.min(ts-lastTime,100); lastTime=ts; walkTime+=dt;
  guardKidProfile();
  tickAutoNext();
  ctx.clearRect(0,0,sw,sh); drawBG(ctx); drawTabsAndUI(ctx);
  if(paradeBreak){
    // できた おだいは かたづけて、パレードだけ。おわったら つぎの おだいへ
    for(const fp of fxParticles) fp.update();
    fxParticles = fxParticles.filter(fp=>fp.life>0);
    drawCast(ctx);
    for(const fp of fxParticles) fp.draw(ctx);
    // ながおしの ゲージ（ゆびの まわりに たまっていく わ）。いっぱいで つぎへ
    if(paradeHold){
      const hp = Math.min(1, (Date.now() - paradeHold.t0) / PARADE_HOLD_MS);
      ctx.save();
      ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(paradeHold.x, paradeHold.y, 34, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,190,50,0.95)';
      ctx.beginPath(); ctx.arc(paradeHold.x, paradeHold.y, 34, -Math.PI/2, -Math.PI/2 + Math.PI*2*hp); ctx.stroke();
      ctx.restore();
      if(hp >= 1){ paradeHold = null; endParadeBreak(); }
    }
    if(paradeBreak && !cast.some(a => a.kind === 'parade')) endParadeBreak();
  } else if(mode==='clock'){
    updateWinFx(dt);
    drawWinLines(ctx);
    drawClockMode(ctx, walkTime);
    drawCast(ctx);
    drawWinStamp(ctx);
    for(const fp of fxParticles) fp.update();
    fxParticles = fxParticles.filter(fp=>fp.life>0);
    for(const fp of fxParticles) fp.draw(ctx);
    drawTaskCard(ctx, walkTime);
  } else if(mode==='factor'){
    lerpFactorBlocks(); drawFactorMode(ctx,walkTime);
    updateWinFx(dt); drawCast(ctx);          // おいわいの プレビューは どの画面でも 見られる
  } else if(mode==='quiz'){
    // 解き終わったら（正解演出が終わる／時間切れ）すぐ次の問題へ。ずっと続く。
    // ここで間を置くと、その間 puzzle.draw() が「正解画面」ではなく問題を
    // もう一度描いてしまい、同じ問題が出たように見えるので待たせない。
    if(!puzzle) quizNewPuzzle();
    else {
      puzzle.update(dt);
      if(puzzle.phase==='timeout') quizScore(false);
      if(puzzle.phase==='timeout'||puzzle.phase==='done') quizNewPuzzle();
    }
    puzzle.draw(ctx,walkTime);
    drawQuizScore(ctx);
    updateWinFx(dt); drawCast(ctx);
  } else {
    drawOpBar(ctx, walkTime);
    if(puzzle){
      puzzle.update(dt);
      if(puzzle.phase==='timeout'||puzzle.phase==='done'){
        blocks.push(new NumberBlock(puzzle.charRes.num,puzzle.mergeX,TAB_H+20));
        logStep(puzzle.calcMode, puzzle.n1, puzzle.n2, puzzle.charRes.num);
        puzzle=null; updateTargets();
      } else {
        puzzle.draw(ctx,walkTime);
      }
    } else {
      applyPhysics();
      updateWinFx(dt);
      drawWinLines(ctx);
      drawWinStamp(ctx);
      for(const b of blocks){ if(b===dragBlock) continue; b.draw(ctx,walkTime,0); }
      drawCast(ctx);                                  // パレードは キャラより てまえ
      if(dragBlock){
        let bestMerge=null,bestMergeD=Infinity;
        for(const o of blocks){
          if(o===dragBlock) continue;
          const d=blockGap(dragBlock,o);
          if(d<MERGE_REACH&&canCalc(dragBlock,o,mode)&&d<bestMergeD){ bestMergeD=d; bestMerge=o; }
        }
        for(const o of blocks){
          if(o===dragBlock) continue;
          const d=blockGap(dragBlock,o);
          if(d<NEAR_REACH){
            if(o===bestMerge) drawOKGlow(ctx,o,walkTime);
            else if(!canCalc(dragBlock,o,mode)) drawNoEntry(ctx,o.cx,o.y-28,22);
          }
        }
        // ミラーに入りかけているときは、持っているキャラを薄くする。
        // 「実体が鏡に吸い込まれ、代わりに鏡の中に映っている」という見え方にする。
        const fade = Math.max(mirrorReflect, homeOpen, tgtFx.double.open, tgtFx.half.open);
        if(fade > 0.02){
          ctx.save();
          ctx.globalAlpha = 1 - 0.55*fade;
          dragBlock.draw(ctx,walkTime,0);
          ctx.restore();
        } else {
          dragBlock.draw(ctx,walkTime,0);
        }
      }
      // ミラーとおうちは最後に描く。持っているキャラで隠れると、
      // 鏡の中の映り込みや扉のあかりが見えなくなってしまうため。
      drawDropTargets(ctx, walkTime);
      // マジックミラーの紙吹雪
      for(const fp of fxParticles) fp.update();
      fxParticles = fxParticles.filter(fp=>fp.life>0);
      for(const fp of fxParticles) fp.draw(ctx);
      checkWay();
      checkTask();
      drawTaskCard(ctx, walkTime);
      drawFormula(ctx);
      drawNumpad(ctx);
      drawKeyInput(ctx, dt);
    }
  }
  // ステージいちらんはいちばん上に重ねる
  if(stageOpen) drawStageSelect(ctx, walkTime);
  if(setOpen) drawSettings(ctx);
  // 「だれが あそぶ？」はさらにその上
  if(whoOpen) drawWhoPicker(ctx, walkTime);
}

// ─── キーボード召喚（デバッグ・確認用）────────────────────────────────────────
// 数字を続けて打って Enter で、その数のキャラを出す（47 → 4,7,Enter）。
// 特定のキャラをすぐ出せるので、見た目の確認に使う。
//   数字      入力（画面左上に表示。3桁まで＝最大100）
//   Enter     召喚
//   Esc       入力を取り消す
//   Backspace 1文字消す
//   R         ランダムに1体（小さい数ほど出やすい）
//   C / Delete 全部消す
let keyInput = '';           // 入力中の数字（文字列）
let keyFlash = 0;            // 入力できなかったときの赤い点滅（ms）
function keySummon(){
  const v = parseInt(keyInput, 10);
  keyInput = '';
  if(isNaN(v) || v < 1 || v > 100){ keyFlash = 600; return; }   // 1〜100 の外
  if(blocks.length >= MAX_BLOCKS){ keyFlash = 600; return; }     // 置ける数の上限
  spawnBlock(v);
}
document.addEventListener('keydown', e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;   // ブラウザのショートカットは邪魔しない
  if(mode === 'factor' || mode === 'quiz') return;  // 因数・ドリルはキャラを出さないので対象外
  if(puzzle) return;                               // クイズ中は入力を受けない
  if(e.key >= '0' && e.key <= '9'){
    if(keyInput.length < 3) keyInput += e.key;
    e.preventDefault();
  } else if(e.key === 'Enter'){
    keySummon(); e.preventDefault();
  } else if(e.key === 'Escape'){
    keyInput = ''; e.preventDefault();
  } else if(e.key === 'Backspace'){
    keyInput = keyInput.slice(0, -1); e.preventDefault();
  } else if(e.key === 'r' || e.key === 'R'){
    // 小さい数ほど出やすくする（1 が最も出やすい）
    let total = 0; const wts = [];
    for(let i=1;i<=100;i++){ const wt = 101 - i; wts.push(wt); total += wt; }
    let pick = Math.random() * total, num = 1;
    for(let i=0;i<100;i++){ pick -= wts[i]; if(pick <= 0){ num = i+1; break; } }
    if(blocks.length >= MAX_BLOCKS) keyFlash = 600; else spawnBlock(num);
    e.preventDefault();
  } else if(e.key === 'c' || e.key === 'C' || e.key === 'Delete'){
    blocks = []; updateTargets(); e.preventDefault();
  }
});

/** 入力中の数字を画面左上に出す（今なにを打っているか分かるように） */
function drawKeyInput(ctx, dt){
  keyFlash = Math.max(0, keyFlash - dt);
  if(!keyInput && !keyFlash) return;
  const label = keyInput || '×';
  const bw = 96, bh = 44, bx = 6, by = TAB_H + 6;
  ctx.save();
  ctx.fillStyle = keyFlash > 0 ? 'rgba(200,30,30,0.88)' : 'rgba(0,0,0,0.62)';
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8); ctx.stroke();
  ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(label, bx + bw/2, by + bh/2 - 5);
  ctx.font = '10px sans-serif';
  ctx.fillText(keyFlash > 0 ? '出せません' : 'Enterで出す', bx + bw/2, by + bh - 9);
  ctx.restore();
}

// ─── Fullscreen ───────────────────────────────────────────────────────────────

// ─── 図鑑での編集をその場で受け取る ───────────────────────────────────────────
// zukan.html を別ウィンドウで開いて調整すると、共通エンジンが変更を検知して
// ここを呼ぶ。かたちが変わるとブロックの縦横も変わるので、外形を計算し直して
// 並べ直す（描画は毎フレーム行われるので、ここでは寸法の更新だけでよい）。
onNumberblocksChanged(function(){
  for(const b of blocks) b._computeShape();
  updateTargets();
  if(mode === 'factor'){
    for(const row of factorBlocks) for(const nb of row.blocks) nb._computeShape();
    updateFactorTargets();
  }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
quizMaxEl.value = String(quizMax); quizMaxVal.textContent = String(quizMax);
quizLimitEl.textContent = quizLimitLabel();
setMode('+');
followTaskMode();          // 前回とけいの おだいの とちゅうなら、とけいの画面から始める
requestAnimationFrame(loop);
</script>
