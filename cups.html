<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>みずのコップ（2台デモ）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body { font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
         background:#cfeef7; color:#233; user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  #head { padding:8px 10px 2px; }
  #title { font-size:19px; font-weight:900; color:#1f66ab; }
  #conn { display:flex; align-items:center; gap:6px; margin-top:5px; flex-wrap:wrap; }
  #dot { width:13px; height:13px; border-radius:50%; background:#c3ced4; flex:none; }
  #dot.on { background:#58a34c; }
  #status { font-size:13px; font-weight:800; color:#40627a; }
  #code { width:74px; font-size:17px; font-weight:900; text-align:center; padding:4px 2px;
          border:2.5px solid #9db8c9; border-radius:10px; font-family:inherit; color:#1f66ab; }
  .btn { border:2.5px solid #2f7fd0; background:#2f7fd0; color:#fff; border-radius:999px;
         padding:5px 14px; font-size:14.5px; font-weight:900; font-family:inherit; cursor:pointer; }
  .btn.sub { background:#fff; color:#2f7fd0; }
  #stage { position:relative; flex:1; min-height:0; }
  #cv { position:absolute; inset:0; }
  #bar { display:flex; align-items:center; gap:8px; padding:8px 10px 12px; }
  #pour { flex:1; border:none; border-radius:18px; padding:15px 0; font-size:19px; font-weight:900;
          font-family:inherit; background:#2f7fd0; color:#fff; cursor:pointer; box-shadow:0 3px 0 #1f66ab; }
  #pour:active, #pour.held { background:#1f66ab; transform:translateY(2px); box-shadow:none; }
  .chip { width:40px; height:40px; border-radius:50%; border:3px solid #fff; cursor:pointer; flex:none;
          box-shadow:0 0 0 2px #b9cdd8; }
  .chip.on { box-shadow:0 0 0 3.5px #40627a; }
</style>
</head>
<body>
<div id="wrap">
  <div id="head">
    <div id="title">🥤 みずのコップ（2台デモ）</div>
    <div id="conn">
      <div id="dot"></div><div id="status">あいことば を あわせて「つなぐ」</div>
      <input id="code" type="text" inputmode="numeric" maxlength="3" value="">
      <button class="btn" id="connectBtn">つなぐ</button>
      <button class="btn sub" id="tiltBtn">かたむき：OFF</button>
    </div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="bar">
    <button id="pour">そそぐ（おしながら）→</button>
    <div class="chip on" data-col="70,150,230" style="background:rgb(70,150,230)"></div>
    <div class="chip" data-col="235,90,90" style="background:rgb(235,90,90)"></div>
    <div class="chip" data-col="245,190,60" style="background:rgb(245,190,60)"></div>
  </div>
</div>

<script>
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let W = 0, H = 0, DPR = 1;
/* ── じょうたい ── */
const myId = Math.random().toString(36).slice(2, 9);
let amt = 0.5;                       // じぶんの 量（0..1）
let col = [70, 150, 230];            // じぶんの 色
let partner = null;                  // { amt, col } あいての 最新
let btnPour = false, recvUntil = 0, lastSend = 0;
let tiltEnabled = false, tiltSm = 0, tiltPour = false, pourDir = 1;
const isPouring = () => btnPour || tiltPour;
const pourRate = () => tiltPour && !btnPour ? 0.30 * Math.min(1, (Math.abs(tiltSm) - 18) / 30 + 0.3) : 0.30;
let slosh = 0, sloshV = 0, dragLevel = null, drops = [];
const seen = new Set();
/* ── つうしん（BroadcastChannel＝同じ端末のタブ / PeerJS＝2台の iPhone） ── */
let bc = null, peer = null, conn = null, isHost = false;
const statusEl = document.getElementById('status'), dotEl = document.getElementById('dot');
function setStatus(txt, on){ statusEl.textContent = txt; dotEl.className = on ? 'on' : ''; dotEl.id = 'dot'; }
function send(obj){
  obj.from = myId;
  try{ if(bc) bc.postMessage(obj); }catch(_){}
  try{ if(conn && conn.open) conn.send(obj); }catch(_){}
}
function recv(obj){
  if(!obj || obj.from === myId) return;
  if(obj.mid){ if(seen.has(obj.mid)) return; seen.add(obj.mid); if(seen.size > 400) seen.clear(); }
  if(obj.t === 'hello' || obj.t === 'amt'){ partner = { amt: obj.v, col: obj.col }; if(obj.t === 'hello') send({ t: 'amt', v: amt, col }); }
  else if(obj.t === 'xfer'){
    const accept = Math.max(0, Math.min(obj.d, 1 - amt));
    if(accept > 0){
      col = mixCol(col, obj.col, amt, accept);
      amt += accept;
      recvUntil = performance.now() + 260;
      for(let i = 0; i < 3; i++) drops.push({ x: cupGeom().x0 + 26 + Math.random() * 22, y: cupGeom().top + 8, vx: 1 + Math.random() * 1.6, vy: 2 + Math.random() * 2, life: 22 });
      sloshV += 1.6;
    }
    if(accept < obj.d - 1e-9) send({ t: 'ret', d: obj.d - accept });
  }
  else if(obj.t === 'ret'){ amt = Math.min(1, amt + obj.d); }
}
function mixCol(c1, c2, a1, a2){
  const tot = a1 + a2; if(tot <= 0) return c2.slice();
  return [0, 1, 2].map(i => Math.round((c1[i] * a1 + c2[i] * a2) / tot));
}
let midSeq = 0;
function sendAmt(){ send({ t: 'amt', v: amt, col, mid: myId + ':' + (midSeq++) }); }
function loadPeerJS(){
  return new Promise(res => {
    if(window.Peer) return res(true);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = () => res(true); s.onerror = () => res(false);
    document.head.appendChild(s);
  });
}
async function connect(code){
  code = String(code || '').trim() || '100';
  try{ if(bc) bc.close(); }catch(_){}
  try{ bc = new BroadcastChannel('nbcup-' + code); bc.onmessage = e => recv(e.data); setStatus('つなぎ中…（あいことば ' + code + '）', false); }catch(_){}
  const ok = await loadPeerJS();
  if(ok){
    try{ if(peer) peer.destroy(); }catch(_){}
    const mk = suffix => new Peer('nbcup1-' + code + '-' + suffix);
    peer = mk('a'); isHost = true;
    peer.on('error', e => {
      if(e.type === 'unavailable-id' && isHost){
        isHost = false;
        try{ peer.destroy(); }catch(_){}
        peer = mk('b');
        peer.on('open', () => { conn = peer.connect('nbcup1-' + code + '-a', { reliable: true }); wireConn(); });
        peer.on('error', () => setStatus('つなげなかった（あいことば を たしかめて）', false));
      } else if(e.type !== 'peer-unavailable') setStatus('つうしん エラー： ' + e.type, false);
    });
    peer.on('connection', c => { conn = c; wireConn(); });
    peer.on('open', () => { if(isHost) setStatus('まちうけ中… もう1台で おなじ あいことば で「つなぐ」', false); });
  }
  setTimeout(() => send({ t: 'hello', v: amt, col, mid: myId + ':h' + (midSeq++) }), 350);
}
function wireConn(){
  conn.on('open', () => { setStatus('つながった！', true); send({ t: 'hello', v: amt, col, mid: myId + ':h' + (midSeq++) }); });
  conn.on('data', recv);
  conn.on('close', () => { setStatus('きれた。もういちど「つなぐ」', false); conn = null; });
}
document.getElementById('connectBtn').onclick = () => connect(document.getElementById('code').value);
document.getElementById('code').value = String(100 + Math.floor(Math.random() * 900));
/* ── コップの かたち ── */
function cupGeom(){
  const topW = W * 0.80, botW = W * 0.60;
  const top = H * 0.17, bot = H * 0.88;
  return { top, bot, x0: (W - topW) / 2, topW, botW, bx0: (W - botW) / 2 };
}
function innerAt(y, g){ // その 高さでの 内がわ （左・右）
  const t = (y - g.top) / (g.bot - g.top);
  const lx = g.x0 + (g.bx0 - g.x0) * t + 8, rx = (g.x0 + g.topW) - ((g.x0 + g.topW) - (g.bx0 + g.botW)) * t - 8;
  return { lx, rx };
}
function levelY(a, g){ return (g.bot - 9) - a * ((g.bot - 9) - (g.top + 9)); }
function gcd(a, b){ return b ? gcd(b, a % b) : a; }
function fracLabel(v){
  const k = Math.round(v * 120);
  if(k <= 0) return '0';
  if(k >= 120) return '1';
  const g = gcd(k, 120);
  return (k / g) + '/' + (120 / g);
}
function layout(){
  const r = stage.getBoundingClientRect();
  const nw = Math.max(280, r.width), nh = Math.max(280, r.height);
  if(Math.abs(nw - W) < 2 && Math.abs(nh - H) < 2) return;
  W = nw; H = nh; DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
/* ── 描画 ── */
function draw(t){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#dff4fa'; ctx.fillRect(0, 0, W, H);
  const g = cupGeom();
  const sy = levelY(amt, g) + Math.sin(t * 0.004) * 1.6 + slosh * 6;
  const colCss = a => 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + a + ')';
  /* 液体 */
  if(amt > 0.003){
    const li = innerAt(sy, g), bi = innerAt(g.bot - 4, g);
    ctx.beginPath();
    const N = 26;
    for(let i = 0; i <= N; i++){
      const x = li.lx + (li.rx - li.lx) * i / N;
      const y = sy + Math.sin(t * 0.006 + i * 0.85) * (1.5 + Math.abs(slosh) * 5) * Math.sin(Math.PI * i / N)
                  + slosh * 9 * (i / N - 0.5) + tiltSm * 0.85 * (i / N - 0.5);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.lineTo(bi.rx, g.bot - 6); ctx.lineTo(bi.lx, g.bot - 6); ctx.closePath();
    const gr = ctx.createLinearGradient(0, sy, 0, g.bot);
    gr.addColorStop(0, colCss(0.75)); gr.addColorStop(1, colCss(0.95));
    ctx.fillStyle = gr; ctx.fill();
  }
  /* 注がれている（入ってくる）流れ */
  if(t < recvUntil){
    ctx.strokeStyle = colCss(0.85); ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(g.x0 - 26, g.top - 44);
    ctx.quadraticCurveTo(g.x0 + 6, g.top - 30, g.x0 + 34, sy - 8); ctx.stroke();
  }
  /* 注いでいる流れ（傾けた側へ） */
  if(isPouring() && amt > 0.003){
    ctx.strokeStyle = colCss(0.9); ctx.lineWidth = 10;
    if(pourDir >= 0){
      ctx.beginPath(); ctx.moveTo(g.x0 + g.topW - 6, g.top + 2);
      ctx.quadraticCurveTo(W + 26, g.top - 26, W + 44, g.top + 42); ctx.stroke();
      for(let i = 0; i < 2; i++) drops.push({ x: W - 8, y: g.top + 16 + Math.random() * 16, vx: 2.4 + Math.random() * 1.6, vy: 0.4, life: 15 });
    } else {
      ctx.beginPath(); ctx.moveTo(g.x0 + 6, g.top + 2);
      ctx.quadraticCurveTo(-26, g.top - 26, -44, g.top + 42); ctx.stroke();
      for(let i = 0; i < 2; i++) drops.push({ x: 8, y: g.top + 16 + Math.random() * 16, vx: -2.4 - Math.random() * 1.6, vy: 0.4, life: 15 });
    }
  }
  /* しずく */
  drops = drops.filter(d => d.life > 0);
  for(const d of drops){ d.x += d.vx; d.y += d.vy; d.vy += 0.35; d.life--;
    ctx.fillStyle = colCss(0.8); ctx.beginPath(); ctx.arc(d.x, d.y, 3.2, 0, 6.29); ctx.fill(); }
  /* ガラス */
  ctx.strokeStyle = 'rgba(70,110,140,0.85)'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(g.x0, g.top); ctx.lineTo(g.bx0 + 9, g.bot - 12);
  ctx.quadraticCurveTo(g.bx0 + 14, g.bot, g.bx0 + 30, g.bot);
  ctx.lineTo(g.bx0 + g.botW - 30, g.bot);
  ctx.quadraticCurveTo(g.bx0 + g.botW - 14, g.bot, g.bx0 + g.botW - 9, g.bot - 12);
  ctx.lineTo(g.x0 + g.topW, g.top);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(g.x0 + 13, g.top + 14); ctx.lineTo(g.bx0 + 22, g.bot - 26); ctx.stroke();
  /* 目盛り（右） */
  const gx = g.x0 + g.topW + 12;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for(let k = 0; k <= 12; k++){
    const a = k / 12, y = levelY(a, g), major = k % 3 === 0;
    ctx.strokeStyle = major ? '#40627a' : 'rgba(64,98,122,0.45)';
    ctx.lineWidth = major ? 3 : 2;
    ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx + (major ? 15 : 9), y); ctx.stroke();
    if(major && k > 0){ ctx.fillStyle = '#40627a'; ctx.font = '900 16px sans-serif'; ctx.fillText(fracLabel(a), gx + 20, y); }
  }
  ctx.fillStyle = '#40627a'; ctx.font = '900 16px sans-serif'; ctx.fillText('1', gx + 20, levelY(1, g));
  ctx.fillText('0', gx + 20, levelY(0, g));
  /* 量の ラベル */
  ctx.textAlign = 'center';
  ctx.font = '900 43px "Hiragino Maru Gothic ProN",sans-serif';
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 9;
  const label = fracLabel(amt);
  ctx.strokeText(label, W / 2, g.top - 34);
  ctx.fillStyle = '#1f66ab'; ctx.fillText(label, W / 2, g.top - 34);
  /* あいての ミニコップ */
  if(partner){
    const mw = 44, mh = 62, mx = W - mw - 12, my = 10;
    ctx.strokeStyle = '#40627a'; ctx.lineWidth = 2.5;
    ctx.strokeRect(mx, my, mw, mh);
    const ph = partner.amt * (mh - 6);
    ctx.fillStyle = 'rgba(' + partner.col[0] + ',' + partner.col[1] + ',' + partner.col[2] + ',0.85)';
    ctx.fillRect(mx + 3, my + mh - 3 - ph, mw - 6, ph);
    ctx.fillStyle = '#40627a'; ctx.font = '900 12.5px sans-serif';
    ctx.fillText('あいて ' + fracLabel(partner.amt), mx + mw / 2, my + mh + 11);
  }
}
/* ── 更新 ── */
let lastT = 0;
function tick(t){
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016); lastT = t;
  sloshV += (-slosh * 0.14 - sloshV * 0.16); slosh += sloshV * 0.06;
  tiltPour = tiltEnabled && Math.abs(tiltSm) > 18;
  if(tiltPour) pourDir = tiltSm >= 0 ? 1 : -1; else if(btnPour) pourDir = 1;
  if(isPouring() && amt > 0){
    const room = partner ? 1 - partner.amt : 1;
    const d = Math.min(pourRate() * dt, amt, Math.max(0, room));
    if(d > 0){
      amt -= d; sloshV -= 0.7;
      send({ t: 'xfer', d, col, mid: myId + ':' + (midSeq++) });
      if(partner) partner = { amt: Math.min(1, partner.amt + d), col: partner.col };
    }
  }
  if((isPouring() || dragLevel) && t - lastSend > 90){ lastSend = t; sendAmt(); }
  draw(t);
  requestAnimationFrame(tick);
}
/* ── 操作 ── */
function ptr(e){ const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  const p = ptr(e), g = cupGeom();
  if(p.x > g.x0 - 16 && p.x < g.x0 + g.topW + 16 && p.y > g.top - 56 && p.y < g.bot + 8){
    dragLevel = { dy: p.y - levelY(amt, g) };
    setFromY(p.y - dragLevel.dy);
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  }
});
cv.addEventListener('pointermove', e => { if(dragLevel) setFromY(ptr(e).y - dragLevel.dy); });
function setFromY(y){
  const g = cupGeom();
  const a = ((g.bot - 9) - y) / ((g.bot - 9) - (g.top + 9));
  const na = Math.max(0, Math.min(1, a));
  if(Math.abs(na - amt) > 0.0005){ sloshV += (na - amt) * 22; amt = na; sendAmt(); }
}
cv.addEventListener('pointerup', () => { dragLevel = null; });
cv.addEventListener('pointercancel', () => { dragLevel = null; });
const pourBtn = document.getElementById('pour');
pourBtn.addEventListener('pointerdown', e => { e.preventDefault(); btnPour = true; pourBtn.classList.add('held'); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => pourBtn.addEventListener(ev, () => { btnPour = false; pourBtn.classList.remove('held'); }));
/* ── かたむき（DeviceOrientation）：右／左に かたむけると そっちへ 注ぐ ── */
window.addEventListener('deviceorientation', e => {
  if(e.gamma === null || e.gamma === undefined) return;
  const landscape = window.screen && window.screen.orientation && Math.abs(window.screen.orientation.angle || 0) === 90;
  const target = landscape ? (e.beta || 0) : e.gamma;
  tiltSm += (target - tiltSm) * 0.25;
});
const tiltBtn = document.getElementById('tiltBtn');
function setTilt(on){
  tiltEnabled = !!on;
  tiltBtn.textContent = 'かたむき：' + (tiltEnabled ? 'ON' : 'OFF');
  if(tiltEnabled) setStatus('かたむき ON：右か左に かたむけると 注ぐよ', partner !== null);
}
tiltBtn.addEventListener('click', async () => {
  if(tiltEnabled){ setTilt(false); return; }
  try{
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      const r = await DeviceOrientationEvent.requestPermission();
      if(r !== 'granted'){ setStatus('かたむきの 許可が なかった', false); return; }
    }
  }catch(_){}
  setTilt(true);
});
document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(o => o.classList.toggle('on', o === ch));
  col = ch.dataset.col.split(',').map(Number);
  sendAmt();
}));
new ResizeObserver(layout).observe(stage);
window.addEventListener('resize', layout);
layout();
requestAnimationFrame(tick);
/* ── テスト用 ── */
window.cups = {
  state(){ const g = cupGeom(); return { amt, col: col.slice(), partner: partner ? { amt: partner.amt, col: partner.col.slice() } : null, pouring: isPouring(), tilt: tiltEnabled, gamma: Math.round(tiltSm * 10) / 10,
    y0: Math.round(levelY(0, g)), y1: Math.round(levelY(1, g)), cx: Math.round(W / 2) }; },
  connect, setAmt(v){ amt = Math.max(0, Math.min(1, v)); sendAmt(); },
  pour(on){ btnPour = !!on; },
  tilt(on){ setTilt(!!on); },
};
</script>
</body>
</html>
